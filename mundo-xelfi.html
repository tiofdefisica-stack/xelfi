<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🌍 Mundo Xelfi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#1a2e1a;color:#ede8f5;font-family:'Nunito Sans',sans-serif;overflow:hidden;height:100vh;width:100vw;touch-action:none;}

/* HUD */
.hud-top{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(#000a,transparent);}
.hud-logo{font-family:'Comic Sans MS',cursive;font-weight:900;font-size:1.3em;color:#9b2dc8;-webkit-text-stroke:1.5px #6a0a9e;font-style:italic;}
.hud-pills{display:flex;gap:7px;align-items:center;}
.hud-pill{display:flex;align-items:center;gap:4px;background:#1c172988;border:1px solid #2e2540;border-radius:16px;padding:5px 10px;font-size:12px;font-weight:800;font-family:Nunito,sans-serif;backdrop-filter:blur(6px);}
.hud-pill.xc{color:#fbbf24;}
.hud-pill.online{color:#4ade80;}

/* MINIMAP */
.minimap-wrap{position:fixed;top:60px;right:12px;z-index:100;border:2px solid #2e2540;border-radius:10px;overflow:hidden;box-shadow:0 4px 14px #000a;}
#minimap{display:block;}

/* JOYSTICK */
.joystick-wrap{position:fixed;bottom:24px;left:20px;z-index:100;}
.joystick-base{width:86px;height:86px;border-radius:50%;background:#00000055;border:2px solid #ffffff22;position:relative;display:flex;align-items:center;justify-content:center;}
.joystick-knob{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#c060ff,#9b35e8);position:absolute;box-shadow:0 2px 10px #9b35e888;pointer-events:none;}

/* ACTION BUTTONS */
.action-btns{position:fixed;bottom:24px;right:14px;z-index:100;display:flex;flex-direction:column;gap:8px;}
.act-btn{width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px #0008;transition:transform .1s;}
.act-btn:active{transform:scale(.9);}
.act-btn.buy{background:linear-gradient(135deg,#fbbf24,#f59e0b);}
.act-btn.home{background:linear-gradient(135deg,#9b35e8,#c060ff);}
.act-btn.chat{background:linear-gradient(135deg,#4ade80,#22c55e);}

/* WORLD */
#worldCanvas{position:fixed;top:0;left:0;image-rendering:pixelated;}

/* PANELS */
.panel-overlay{position:fixed;inset:0;background:#000b;z-index:500;display:none;align-items:flex-end;justify-content:center;}
.panel-overlay.open{display:flex;}
.panel-box{background:#16121f;border:2px solid #9b35e8;border-radius:20px 20px 0 0;width:100%;max-width:500px;padding:20px 18px;padding-bottom:max(20px,env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;}
.panel-title{font-weight:900;font-size:17px;font-family:Nunito,sans-serif;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
.panel-sub{font-size:12px;color:#7a6a9a;margin-bottom:16px;}
.panel-close{background:transparent;border:none;color:#7a6a9a;font-size:22px;cursor:pointer;}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #2e2540;}
.info-label{font-size:13px;color:#7a6a9a;}
.info-val{font-size:14px;font-weight:800;font-family:Nunito,sans-serif;}
.btn-primary{background:linear-gradient(135deg,#c060ff,#9b35e8);color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:Nunito,sans-serif;width:100%;margin-top:14px;}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-secondary{background:transparent;border:1px solid #2e2540;color:#7a6a9a;border-radius:12px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:Nunito,sans-serif;width:100%;margin-top:8px;}
.house-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.house-opt{background:#1c1729;border:2px solid #2e2540;border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;transition:border-color .2s;}
.house-opt.sel{border-color:#9b35e8;background:#2d1f45;}
.house-opt:active{transform:scale(.96);}
.house-icon{font-size:30px;margin-bottom:5px;}
.house-name{font-size:11px;font-weight:800;font-family:Nunito,sans-serif;}
.house-price{font-size:11px;color:#fbbf24;margin-top:3px;}
.plot-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;font-family:Nunito,sans-serif;margin-bottom:12px;}
.plot-badge.free{background:#4ade8022;color:#4ade80;border:1px solid #4ade8055;}
.plot-badge.mine{background:#9b35e822;color:#c060ff;border:1px solid #9b35e855;}
.plot-badge.taken{background:#ff4d6d22;color:#ff4d6d;border:1px solid #ff4d6d55;}

/* TOOLTIP */
.world-tooltip{position:fixed;background:#1c1729ee;border:1px solid #9b35e8;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:700;pointer-events:none;z-index:200;display:none;backdrop-filter:blur(4px);}

/* CHAT BUBBLE */
.proximity-chat{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#1c1729ee;border:1px solid #2e2540;border-radius:14px;padding:10px 14px;z-index:300;display:none;min-width:220px;backdrop-filter:blur(6px);}
.proximity-chat.show{display:block;}
.prox-name{font-size:11px;font-weight:800;color:#c060ff;margin-bottom:4px;}
.prox-msg{font-size:13px;}

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#2e2540;border-radius:3px;}
</style>
</head>
<body>

<canvas id="worldCanvas"></canvas>

<!-- HUD -->
<div class="hud-top">
  <div class="hud-logo">Xelfi</div>
  <div class="hud-pills">
    <div class="hud-pill online">🟢 <span id="onlineCount">8</span></div>
    <div class="hud-pill xc">🪙 <span id="xcCount">9999</span></div>
  </div>
</div>

<!-- MINIMAP -->
<div class="minimap-wrap">
  <canvas id="minimap" width="90" height="90"></canvas>
</div>

<!-- JOYSTICK -->
<div class="joystick-wrap">
  <div class="joystick-base" id="jBase">
    <div class="joystick-knob" id="jKnob"></div>
  </div>
</div>

<!-- ACTIONS -->
<div class="action-btns">
  <button class="act-btn home" onclick="goHome()" title="Mi casa">🏠</button>
  <button class="act-btn buy" id="buyBtn" onclick="openPlotPanel()" title="Ver parcela" style="display:none">🏷️</button>
  <button class="act-btn chat" onclick="openWorldChat()" title="Chat">💬</button>
</div>

<!-- TOOLTIP -->
<div class="world-tooltip" id="tooltip"></div>

<!-- PROXIMITY CHAT -->
<div class="proximity-chat" id="proxChat">
  <div class="prox-name" id="proxName"></div>
  <div class="prox-msg" id="proxMsg"></div>
</div>

<!-- PLOT PANEL -->
<div class="panel-overlay" id="plotPanel">
  <div class="panel-box">
    <div class="panel-title">
      <span id="plotTitle">Parcela #1</span>
      <button class="panel-close" onclick="closePlotPanel()">✕</button>
    </div>
    <div class="panel-sub" id="plotSub">Zona residencial</div>
    <div id="plotBadge"></div>
    <div id="plotInfo"></div>
    <div id="plotActions"></div>
  </div>
</div>

<!-- HOUSE BUILDER PANEL -->
<div class="panel-overlay" id="builderPanel">
  <div class="panel-box">
    <div class="panel-title">
      <span>🏗️ Construir casa</span>
      <button class="panel-close" onclick="closeBuilder()">✕</button>
    </div>
    <div class="panel-sub">Elige el estilo de tu casa</div>
    <div class="house-grid" id="houseGrid"></div>
    <button class="btn-primary" id="buildBtn" onclick="buildHouse()">Construir</button>
    <button class="btn-secondary" onclick="closeBuilder()">Cancelar</button>
  </div>
</div>

<!-- WORLD CHAT -->
<div class="panel-overlay" id="worldChatPanel">
  <div class="panel-box" style="border-radius:20px;margin:16px;max-height:70vh;">
    <div class="panel-title">
      <span>🌍 Chat del pueblo</span>
      <button class="panel-close" onclick="document.getElementById('worldChatPanel').classList.remove('open')">✕</button>
    </div>
    <div id="worldChatMsgs" style="min-height:150px;max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;padding:4px 0;"></div>
    <div style="display:flex;gap:8px;">
      <input id="worldChatInp" style="flex:1;background:#0e0b14;border:1.5px solid #2e2540;border-radius:20px;padding:9px 13px;color:#ede8f5;font-size:14px;outline:none;" placeholder="Escribe...">
      <button style="background:linear-gradient(135deg,#c060ff,#9b35e8);border:none;border-radius:50%;width:38px;height:38px;color:#fff;cursor:pointer;font-size:16px;" onclick="sendWorldChat()">➤</button>
    </div>
  </div>
</div>

<script>
// ===== WORLD CONFIG =====
const TILE = 48;
const COLS = 20;
const ROWS = 16;
const W = COLS * TILE;
const H = ROWS * TILE;

// Terrain types
const T = { GRASS:0, GRASS2:1, WATER:2, SAND:3, PATH:4, PLAZA:5 };
const COLORS = {
  [T.GRASS]:'#2d5a2d', [T.GRASS2]:'#3a6e3a',
  [T.WATER]:'#1a3a6e', [T.SAND]:'#8a7a4a',
  [T.PATH]:'#6e5a3a', [T.PLAZA]:'#5a4a3a'
};

// Plot zones
const ZONES = [
  {id:1,x:1,y:1,w:3,h:3,name:'Parcela #1',zone:'Norte',price:500},
  {id:2,x:5,y:1,w:3,h:3,name:'Parcela #2',zone:'Norte',price:500},
  {id:3,x:9,y:1,w:3,h:3,name:'Parcela #3',zone:'Norte',price:600},
  {id:4,x:13,y:1,w:3,h:3,name:'Parcela #4',zone:'Norte',price:600},
  {id:5,x:1,y:10,w:3,h:3,name:'Parcela #5',zone:'Sur',price:450},
  {id:6,x:5,y:10,w:3,h:3,name:'Parcela #6',zone:'Sur',price:450},
  {id:7,x:9,y:10,w:3,h:3,name:'Parcela #7',zone:'Sur',price:500},
  {id:8,x:13,y:10,w:3,h:3,name:'Parcela #8',zone:'Sur',price:500},
  {id:9,x:1,y:5,w:2,h:3,name:'Parcela #9',zone:'Oeste',price:400},
  {id:10,x:15,y:5,w:2,h:3,name:'Parcela #10',zone:'Este',price:400},
];

// House styles
const HOUSE_STYLES = [
  {id:'cottage',icon:'🏠',name:'Cabaña',price:200,color:'#8B4513'},
  {id:'modern',icon:'🏡',name:'Moderna',price:350,color:'#4682B4'},
  {id:'castle',icon:'🏰',name:'Castillo',price:800,color:'#696969'},
  {id:'treehouse',icon:'🌳',name:'Arbol',price:300,color:'#228B22'},
  {id:'beach',icon:'🏖️',name:'Playa',price:500,color:'#DEB887'},
  {id:'space',icon:'🚀',name:'Espacial',price:1000,color:'#9b35e8'},
];

// Decorations
const DECOS = [
  {x:3,y:7,icon:'🌳'},{x:7,y:7,icon:'🌺'},{x:11,y:7,icon:'🌳'},
  {x:4,y:4,icon:'⛲'},{x:8,y:8,icon:'🏮'},{x:12,y:4,icon:'🌳'},
  {x:16,y:3,icon:'🌺'},{x:17,y:8,icon:'🌳'},{x:2,y:8,icon:'🌺'},
  {x:6,y:13,icon:'🌳'},{x:10,y:13,icon:'🌺'},{x:14,y:13,icon:'🌳'},
  {x:0,y:4,icon:'🌾'},{x:19,y:4,icon:'🌾'},{x:0,y:11,icon:'🌾'},{x:19,y:11,icon:'🌾'},
];

// NPCs wandering
const NPCS = [
  {x:9*TILE,y:7*TILE,emoji:'🌙',name:'Gama',dx:0.7,dy:0.3,color:'#ff6b9d',msg:'¡Hola vecino!'},
  {x:5*TILE,y:8*TILE,emoji:'⭐',name:'Carlos',dx:-0.5,dy:0.6,color:'#4ade80',msg:'Compré mi parcela ayer'},
  {x:13*TILE,y:6*TILE,emoji:'🔭',name:'Hiza',dx:0.4,dy:-0.5,color:'#fbbf24',msg:'¿Construyes hoy?'},
  {x:3*TILE,y:12*TILE,emoji:'🌺',name:'Daniele',dx:0.6,dy:0.4,color:'#a78bfa',msg:'Me encanta este pueblo'},
];

// State
const player = {x:9*TILE+24,y:7*TILE+24,emoji:'🚀',name:'Eloy',dir:0,moving:false,step:0};
let cam = {x:0,y:0};
let xc = 9999;
let plots = {}; // plotId -> {owner, houseStyle}
let selectedPlot = null;
let selectedHouseStyle = null;
let worldChatMsgs = [];
let frame = 0;
let jDx=0,jDy=0;

// Demo: some plots already owned
plots[3] = {owner:'Carlos',houseStyle:'modern',ownerEmoji:'⭐'};
plots[7] = {owner:'Gama',houseStyle:'cottage',ownerEmoji:'🌙'};

// Generate terrain
const terrain = [];
for(let r=0;r<ROWS;r++){
  terrain[r]=[];
  for(let c=0;c<COLS;c++){
    // Water border
    if(c===0||c===COLS-1||r===0||r===ROWS-1){terrain[r][c]=T.WATER;continue;}
    // Plaza in center
    if(c>=8&&c<=11&&r>=6&&r<=9){terrain[r][c]=T.PLAZA;continue;}
    // Main roads
    if(r===7||r===8||c===7||c===12){terrain[r][c]=T.PATH;continue;}
    // Sand near water
    if(c===1||c===COLS-2||r===1||r===ROWS-2){terrain[r][c]=T.SAND;continue;}
    // Varied grass
    terrain[r][c]=((c+r)%3===0)?T.GRASS2:T.GRASS;
  }
}

// Canvas setup
const canvas = document.getElementById('worldCanvas');
const ctx = canvas.getContext('2d');
const mm = document.getElementById('minimap');
const mmCtx = mm.getContext('2d');

function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

// ===== DRAW FUNCTIONS =====
function drawTile(c,r){
  const t=terrain[r][c];
  const wx=c*TILE-cam.x, wy=r*TILE-cam.y;
  if(wx<-TILE||wy<-TILE||wx>canvas.width+TILE||wy>canvas.height+TILE)return;
  
  ctx.fillStyle=COLORS[t];
  ctx.fillRect(wx,wy,TILE,TILE);
  
  // Texture details
  if(t===T.GRASS||t===T.GRASS2){
    ctx.fillStyle=t===T.GRASS?'#255225':'#427042';
    ctx.fillRect(wx+2,wy+2,4,4);ctx.fillRect(wx+TILE-8,wy+TILE-8,4,4);
    ctx.fillRect(wx+TILE-6,wy+4,3,3);ctx.fillRect(wx+4,wy+TILE-6,3,3);
  }
  if(t===T.PATH){
    ctx.fillStyle='#7a6040';
    ctx.fillRect(wx+1,wy+1,TILE-2,TILE-2);
    ctx.fillStyle='#5a4228';
    for(let i=0;i<3;i++)ctx.fillRect(wx+4+i*14,wy+4,8,TILE-8);
  }
  if(t===T.PLAZA){
    ctx.fillStyle='#4a3828';ctx.fillRect(wx+1,wy+1,TILE-2,TILE-2);
    ctx.fillStyle='#3a2818';
    ctx.fillRect(wx+4,wy+4,TILE-8,TILE-8);
    ctx.strokeStyle='#6a5040';ctx.lineWidth=1;
    ctx.strokeRect(wx+8,wy+8,TILE-16,TILE-16);
  }
  if(t===T.WATER){
    const wave=Math.sin(frame*0.05+c*0.5+r*0.3)*2;
    ctx.fillStyle='#1e4a8e';ctx.fillRect(wx,wy+wave,TILE,4);
    ctx.fillStyle='#2a5aaa';ctx.fillRect(wx+TILE-12,wy+TILE/2+wave,10,3);
  }
  if(t===T.SAND){
    ctx.fillStyle='#9a8a5a';
    ctx.fillRect(wx+3,wy+3,5,5);ctx.fillRect(wx+TILE-10,wy+TILE-10,4,4);
  }
}

function drawPlot(plot){
  const px=plot.x*TILE-cam.x, py=plot.y*TILE-cam.y;
  const pw=plot.w*TILE, ph=plot.h*TILE;
  if(px>canvas.width+pw||py>canvas.height+ph||px+pw<0||py+ph<0)return;
  
  const owned=plots[plot.id];
  const isNear=nearPlot&&nearPlot.id===plot.id;
  
  // Plot border
  ctx.strokeStyle=owned?'#9b35e8':isNear?'#fbbf24':'#4ade8088';
  ctx.lineWidth=isNear?3:2;
  ctx.setLineDash(owned?[]:[6,4]);
  ctx.strokeRect(px+2,py+2,pw-4,ph-4);
  ctx.setLineDash([]);
  
  if(!owned){
    // Free plot overlay
    ctx.fillStyle='#4ade8008';
    ctx.fillRect(px+2,py+2,pw-4,ph-4);
    // Plot number
    ctx.fillStyle=isNear?'#fbbf24':'#4ade80';
    ctx.font='bold 11px Nunito,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('#'+plot.id,px+pw/2,py+12);
    // Price tag
    if(isNear){
      ctx.fillStyle='#fbbf2444';ctx.fillRect(px+pw/2-25,py+ph/2-10,50,20);
      ctx.fillStyle='#fbbf24';ctx.font='bold 10px Nunito,sans-serif';
      ctx.fillText('🪙 '+plot.price+' XC',px+pw/2,py+ph/2);
    }
  } else {
    // Draw house
    drawHouse(plot,owned,px,py,pw,ph);
  }
}

function drawHouse(plot,owned,px,py,pw,ph){
  const style=HOUSE_STYLES.find(s=>s.id===owned.houseStyle)||HOUSE_STYLES[0];
  const cx=px+pw/2, cy=py+ph/2;
  const hw=Math.min(pw,ph)*0.55, hh=hw*0.8;
  
  // Shadow
  ctx.fillStyle='#00000033';ctx.beginPath();ctx.ellipse(cx,cy+hh/2+4,hw*0.4,8,0,0,Math.PI*2);ctx.fill();
  
  // House body
  ctx.fillStyle=style.color+'aa';ctx.strokeStyle=style.color;ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(cx-hw/2,cy-hh/2,hw,hh,6);ctx.fill();ctx.stroke();
  
  // Roof
  ctx.fillStyle=style.color;ctx.beginPath();
  ctx.moveTo(cx-hw/2-4,cy-hh/2);ctx.lineTo(cx,cy-hh/2-hw*0.35);ctx.lineTo(cx+hw/2+4,cy-hh/2);
  ctx.closePath();ctx.fill();ctx.stroke();
  
  // Door
  ctx.fillStyle='#00000066';ctx.fillRect(cx-8,cy+hh/2-20,16,20);
  
  // Windows
  ctx.fillStyle='#ffffffaa';ctx.fillRect(cx-hw/2+8,cy-8,10,10);ctx.fillRect(cx+hw/2-18,cy-8,10,10);
  
  // House emoji
  ctx.font=`${Math.round(hw*0.35)}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(style.icon,cx,cy-5);
  
  // Owner name tag
  ctx.fillStyle='#00000088';ctx.beginPath();ctx.roundRect(cx-28,py+4,56,16,8);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 9px Nunito,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(owned.ownerEmoji+' '+owned.owner.split(' ')[0],cx,py+12);
}

function drawDeco(d){
  const sx=d.x*TILE-cam.x+TILE/2, sy=d.y*TILE-cam.y+TILE/2;
  if(sx<-TILE||sy<-TILE||sx>canvas.width+TILE||sy>canvas.height+TILE)return;
  ctx.shadowColor='#00000055';ctx.shadowBlur=4;
  ctx.font='22px serif';ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.fillText(d.icon,sx,sy+8);
  ctx.shadowBlur=0;
}

function drawNPC(npc){
  const sx=npc.x-cam.x, sy=npc.y-cam.y;
  if(sx<-40||sy<-40||sx>canvas.width+40||sy>canvas.height+40)return;
  // Shadow
  ctx.fillStyle='#00000044';ctx.beginPath();ctx.ellipse(sx,sy+16,12,4,0,0,Math.PI*2);ctx.fill();
  // Glow ring
  ctx.strokeStyle=npc.color+'66';ctx.lineWidth=3;ctx.beginPath();ctx.arc(sx,sy,15,0,Math.PI*2);ctx.stroke();
  // Avatar circle
  ctx.fillStyle=npc.color+'33';ctx.beginPath();ctx.arc(sx,sy,14,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=npc.color;ctx.lineWidth=2;ctx.stroke();
  // Emoji
  ctx.font='16px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(npc.emoji,sx,sy);
  // Name
  ctx.fillStyle='#000000aa';ctx.beginPath();ctx.roundRect(sx-18,sy-30,36,14,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 9px Nunito,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(npc.name,sx,sy-23);
  // Online dot
  ctx.fillStyle='#4ade80';ctx.beginPath();ctx.arc(sx+10,sy-10,3,0,Math.PI*2);ctx.fill();
}

function drawPlayer(){
  const sx=canvas.width/2, sy=canvas.height/2;
  const bob=Math.sin(frame*0.15)*2;
  // Shadow
  ctx.fillStyle='#00000055';ctx.beginPath();ctx.ellipse(sx,sy+17,13,5,0,0,Math.PI*2);ctx.fill();
  // Glow
  ctx.shadowColor='#9b35e8';ctx.shadowBlur=18;
  ctx.strokeStyle='#9b35e8';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(sx,sy+bob,17,0,Math.PI*2);ctx.stroke();
  ctx.shadowBlur=0;
  // Body
  ctx.fillStyle='#9b35e833';ctx.beginPath();ctx.arc(sx,sy+bob,16,0,Math.PI*2);ctx.fill();
  // Emoji
  ctx.font='18px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(player.emoji,sx,sy+bob);
  // Name tag
  ctx.fillStyle='#000000cc';ctx.beginPath();ctx.roundRect(sx-22,sy+bob-32,44,15,8);ctx.fill();
  ctx.fillStyle='#c060ff';ctx.font='bold 10px Nunito,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('Tú',sx,sy+bob-25);
  // Movement legs
  if(player.moving){
    const leg=Math.sin(frame*0.2)*6;
    ctx.font='10px serif';
    ctx.fillText('🦶',sx-6+leg,sy+bob+18);
    ctx.fillText('🦶',sx+6-leg,sy+bob+18);
  }
}

function drawMinimap(){
  mmCtx.fillStyle='#0e0b14';mmCtx.fillRect(0,0,90,90);
  const sx=90/W,sy=90/H;
  // Terrain
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const t=terrain[r][c];
    mmCtx.fillStyle=t===T.WATER?'#1a3a6e':t===T.PATH?'#6e5a3a':t===T.PLAZA?'#5a4a3a':t===T.SAND?'#8a7a4a':'#2d5a2d';
    mmCtx.fillRect(c*TILE*sx,r*TILE*sy,TILE*sx+1,TILE*sy+1);
  }
  // Plots
  ZONES.forEach(p=>{
    const owned=plots[p.id];
    mmCtx.fillStyle=owned?'#9b35e8':'#4ade8055';
    mmCtx.fillRect(p.x*TILE*sx,p.y*TILE*sy,p.w*TILE*sx,p.h*TILE*sy);
  });
  // NPCs
  NPCS.forEach(n=>{mmCtx.fillStyle=n.color;mmCtx.beginPath();mmCtx.arc(n.x*sx,n.y*sy,2.5,0,Math.PI*2);mmCtx.fill();});
  // Player
  mmCtx.fillStyle='#fff';mmCtx.strokeStyle='#9b35e8';mmCtx.lineWidth=1;
  mmCtx.beginPath();mmCtx.arc(player.x*sx,player.y*sy,3,0,Math.PI*2);mmCtx.fill();mmCtx.stroke();
  // Camera rect
  mmCtx.strokeStyle='#ffffff44';mmCtx.lineWidth=1;
  mmCtx.strokeRect(cam.x*sx,cam.y*sy,canvas.width*sx,canvas.height*sy);
}

function drawPlaza(){
  const px=8*TILE-cam.x,py=6*TILE-cam.y,pw=4*TILE,ph=4*TILE;
  const cx=px+pw/2,cy=py+ph/2;
  // Fountain
  ctx.fillStyle='#1a3a6e';ctx.beginPath();ctx.arc(cx,cy,22,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#5a8a8a';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#4aaabb';ctx.beginPath();ctx.arc(cx,cy,14,0,Math.PI*2);ctx.fill();
  // Water animation
  ctx.fillStyle='#ffffff44';ctx.beginPath();ctx.arc(cx+Math.sin(frame*0.08)*5,cy-8,4,0,Math.PI*2);ctx.fill();
  // Benches
  ctx.fillStyle='#8B4513';[[cx-30,cy+28],[cx+20,cy+28],[cx-30,cy-28],[cx+20,cy-28]].forEach(([bx,by])=>{ctx.fillRect(bx,by,16,6);});
  // Plaza sign
  ctx.font='10px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🏛️',cx,py+10);
  ctx.fillStyle='#ffffffaa';ctx.font='bold 8px Nunito,sans-serif';ctx.textAlign='center';ctx.fillText('Plaza Xelfi',cx,py+20);
}

// ===== NEAR PLOT DETECTION =====
let nearPlot=null;
function checkNearPlot(){
  nearPlot=null;
  for(const p of ZONES){
    const px=p.x*TILE,py=p.y*TILE,pw=p.w*TILE,ph=p.h*TILE;
    if(player.x>px-20&&player.x<px+pw+20&&player.y>py-20&&player.y<py+ph+20){
      nearPlot=p;break;
    }
  }
  document.getElementById('buyBtn').style.display=nearPlot?'flex':'none';
}

// ===== NEAR NPC DETECTION =====
function checkNearNPC(){
  const prox=document.getElementById('proxChat');
  let found=null;
  for(const npc of NPCS){
    const dx=player.x-npc.x,dy=player.y-npc.y;
    if(Math.sqrt(dx*dx+dy*dy)<60){found=npc;break;}
  }
  if(found){
    document.getElementById('proxName').textContent=found.emoji+' '+found.name;
    document.getElementById('proxMsg').textContent=found.msg;
    prox.classList.add('show');
  } else prox.classList.remove('show');
}

// ===== PLOT PANEL =====
function openPlotPanel(){
  if(!nearPlot)return;
  const p=nearPlot;const owned=plots[p.id];
  const isMe=owned&&owned.owner==='Eloy';
  document.getElementById('plotTitle').textContent=p.name;
  document.getElementById('plotSub').textContent='Zona '+p.zone+(owned?' · Ocupada':' · Disponible');
  const badge=document.getElementById('plotBadge');
  badge.innerHTML=owned?`<span class="plot-badge ${isMe?'mine':'taken'}">${isMe?'🏠 Tu parcela':'🔒 Ocupada por '+owned.owner}</span>`:'<span class="plot-badge free">✅ Disponible</span>';
  const info=document.getElementById('plotInfo');
  info.innerHTML=`
    <div class="info-row"><span class="info-label">Tamaño</span><span class="info-val">${p.w*16}x${p.h*16}m</span></div>
    <div class="info-row"><span class="info-label">Precio del terreno</span><span class="info-val">🪙 ${p.price} XC</span></div>
    ${owned?`<div class="info-row"><span class="info-label">Casa</span><span class="info-val">${HOUSE_STYLES.find(s=>s.id===owned.houseStyle)?.icon||'🏠'} ${owned.houseStyle}</span></div>`:''}
    <div class="info-row"><span class="info-label">Tu saldo</span><span class="info-val" style="color:#fbbf24">🪙 ${xc} XC</span></div>
  `;
  const actions=document.getElementById('plotActions');
  if(isMe){
    actions.innerHTML='';
    const btn=document.createElement('button');btn.className='btn-primary';btn.textContent='🏗️ Mejorar casa';btn.onclick=()=>{closePlotPanel();openBuilder(p);};actions.appendChild(btn);
    const btn2=document.createElement('button');btn2.className='btn-secondary';btn2.textContent='Cerrar';btn2.onclick=closePlotPanel;actions.appendChild(btn2);
  } else if(!owned){
    actions.innerHTML='';
    const canBuy=xc>=p.price;
    const btn=document.createElement('button');btn.className='btn-primary';btn.disabled=!canBuy;
    btn.textContent=canBuy?`🪙 Comprar por ${p.price} XC`:'XC insuficientes';
    btn.onclick=()=>{
      if(!canBuy)return;
      xc-=p.price;document.getElementById('xcCount').textContent=xc;
      plots[p.id]={owner:'Eloy',houseStyle:'cottage',ownerEmoji:'🚀'};
      closePlotPanel();openBuilder(p);
    };
    actions.appendChild(btn);
    const btn2=document.createElement('button');btn2.className='btn-secondary';btn2.textContent='Cancelar';btn2.onclick=closePlotPanel;actions.appendChild(btn2);
  } else {
    actions.innerHTML='<button class="btn-secondary" onclick="closePlotPanel()">Cerrar</button>';
  }
  document.getElementById('plotPanel').classList.add('open');
}
function closePlotPanel(){document.getElementById('plotPanel').classList.remove('open');}

// ===== HOUSE BUILDER =====
let buildingPlot=null;
function openBuilder(plot){
  buildingPlot=plot;selectedHouseStyle=null;
  const grid=document.getElementById('houseGrid');grid.innerHTML='';
  HOUSE_STYLES.forEach(s=>{
    const card=document.createElement('div');card.className='house-opt';
    card.innerHTML=`<div class="house-icon">${s.icon}</div><div class="house-name">${s.name}</div><div class="house-price">🪙 ${s.price}</div>`;
    card.onclick=()=>{selectedHouseStyle=s;grid.querySelectorAll('.house-opt').forEach(x=>x.classList.remove('sel'));card.classList.add('sel');document.getElementById('buildBtn').textContent=`🏗️ Construir por ${s.price} XC`;};
    grid.appendChild(card);
  });
  document.getElementById('buildBtn').textContent='Elige un estilo';
  document.getElementById('builderPanel').classList.add('open');
}
function closeBuilder(){document.getElementById('builderPanel').classList.remove('open');buildingPlot=null;selectedHouseStyle=null;}
function buildHouse(){
  if(!selectedHouseStyle||!buildingPlot)return;
  if(xc<selectedHouseStyle.price){alert('No tienes suficientes XC.');return;}
  xc-=selectedHouseStyle.price;document.getElementById('xcCount').textContent=xc;
  plots[buildingPlot.id]={owner:'Eloy',houseStyle:selectedHouseStyle.id,ownerEmoji:'🚀'};
  closeBuilder();alert('✅ ¡Casa construida!');
}

// ===== WORLD CHAT =====
const wChatMsgs=[
  {name:'Gama',emoji:'🌙',text:'¡Hola vecinos!',color:'#ff6b9d'},
  {name:'Carlos',emoji:'⭐',text:'Acabo de comprar la parcela #3',color:'#4ade80'},
  {name:'Hiza',emoji:'🔭',text:'El pueblo está quedando muy bonito',color:'#fbbf24'},
];
function openWorldChat(){
  const msgs=document.getElementById('worldChatMsgs');
  msgs.innerHTML='';
  wChatMsgs.forEach(m=>{
    const row=document.createElement('div');row.style.cssText='display:flex;gap:7px;align-items:flex-start;';
    row.innerHTML=`<span style="font-size:16px;flex-shrink:0;">${m.emoji}</span><div><span style="font-size:11px;font-weight:800;color:${m.color};font-family:Nunito,sans-serif;">${m.name}</span><div style="font-size:13px;margin-top:2px;">${m.text}</div></div>`;
    msgs.appendChild(row);
  });
  msgs.scrollTop=msgs.scrollHeight;
  document.getElementById('worldChatPanel').classList.add('open');
  document.getElementById('worldChatInp').focus();
}
function sendWorldChat(){
  const inp=document.getElementById('worldChatInp');const text=inp.value.trim();if(!text)return;
  wChatMsgs.push({name:'Eloy',emoji:'🚀',text,color:'#c060ff'});inp.value='';openWorldChat();
}
document.getElementById('worldChatInp').addEventListener('keydown',e=>{if(e.key==='Enter')sendWorldChat();});

// ===== NAVIGATION =====
function goHome(){
  const myPlot=ZONES.find(p=>plots[p.id]?.owner==='Eloy');
  if(myPlot){player.x=(myPlot.x+myPlot.w/2)*TILE;player.y=(myPlot.y+myPlot.h/2)*TILE;}
  else{player.x=9*TILE+24;player.y=7*TILE+24;}
}

// ===== JOYSTICK =====
const jBase=document.getElementById('jBase');
const jKnob=document.getElementById('jKnob');

function handleJoystick(cx,cy){
  const r=jBase.getBoundingClientRect();
  const bx=r.left+r.width/2,by=r.top+r.height/2;
  const dx=cx-bx,dy=cy-by;
  const dist=Math.sqrt(dx*dx+dy*dy),max=30;
  const d=Math.min(dist,max),angle=Math.atan2(dy,dx);
  jKnob.style.left=(d*Math.cos(angle)+r.width/2-17)+'px';
  jKnob.style.top=(d*Math.sin(angle)+r.height/2-17)+'px';
  jDx=dist>5?(d/max)*Math.cos(angle):0;
  jDy=dist>5?(d/max)*Math.sin(angle):0;
}
function resetJoystick(){jDx=0;jDy=0;jKnob.style.left='';jKnob.style.top='';}

jBase.addEventListener('touchstart',e=>{e.preventDefault();handleJoystick(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
jBase.addEventListener('touchmove',e=>{e.preventDefault();handleJoystick(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
jBase.addEventListener('touchend',resetJoystick);
jBase.addEventListener('mousedown',e=>handleJoystick(e.clientX,e.clientY));
window.addEventListener('mousemove',e=>{if(e.buttons&&jDx!==0)handleJoystick(e.clientX,e.clientY);});
window.addEventListener('mouseup',resetJoystick);

// Keyboard
const keys={};
document.addEventListener('keydown',e=>keys[e.key]=true);
document.addEventListener('keyup',e=>keys[e.key]=false);

// ===== MAIN LOOP =====
function update(){
  let dx=0,dy=0;
  if(keys['ArrowLeft']||keys['a'])dx=-1;
  if(keys['ArrowRight']||keys['d'])dx=1;
  if(keys['ArrowUp']||keys['w'])dy=-1;
  if(keys['ArrowDown']||keys['s'])dy=1;
  dx+=jDx;dy+=jDy;
  
  player.moving=!!(dx||dy);
  
  if(dx||dy){
    const len=Math.sqrt(dx*dx+dy*dy);
    const spd=2.5;
    const nx=player.x+dx/len*spd;
    const ny=player.y+dy/len*spd;
    const gc=Math.floor(nx/TILE),gr=Math.floor(ny/TILE);
    if(gc>=0&&gc<COLS&&gr>=0&&gr<ROWS&&terrain[gr][gc]!==T.WATER){
      player.x=Math.max(TILE,Math.min(W-TILE,nx));
      player.y=Math.max(TILE,Math.min(H-TILE,ny));
    }
  }
  
  // Camera
  cam.x=player.x-canvas.width/2;
  cam.y=player.y-canvas.height/2;
  cam.x=Math.max(0,Math.min(W-canvas.width,cam.x));
  cam.y=Math.max(0,Math.min(H-canvas.height,cam.y));
  
  // NPCs wander
  if(frame%2===0){
    NPCS.forEach(npc=>{
      npc.x+=npc.dx;npc.y+=npc.dy;
      const gc=Math.floor(npc.x/TILE),gr=Math.floor(npc.y/TILE);
      if(npc.x<TILE||npc.x>W-TILE||npc.y<TILE||npc.y>H-TILE||terrain[Math.max(0,gr)][Math.max(0,gc)]===T.WATER){npc.dx*=-1;npc.dy*=-1;}
    });
  }
  
  if(frame%15===0){checkNearPlot();checkNearNPC();}
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // Draw terrain
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)drawTile(c,r);
  // Plaza
  drawPlaza();
  // Plot zones
  ZONES.forEach(drawPlot);
  // Decos
  DECOS.forEach(drawDeco);
  // NPCs
  NPCS.forEach(drawNPC);
  // Player
  drawPlayer();
  // Minimap
  drawMinimap();
}

function loop(){
  frame++;
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
