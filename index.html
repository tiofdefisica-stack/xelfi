<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Xelfi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9b35e8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0b14;--surf:#16121f;--card:#1c1729;--bor:#2e2540;--acc:#9b35e8;--acc2:#c060ff;--txt:#ede8f5;--mut:#7a6a9a;--red:#ff4d6d;--grn:#4ade80;--yel:#fbbf24;}
body.light{--bg:#f0f2f5;--surf:#fff;--card:#fff;--bor:#dde1e7;--txt:#1c1e21;--mut:#65676b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:'Nunito Sans',sans-serif;min-height:100vh;}
.logo{display:inline-flex;align-items:center;cursor:pointer;gap:1px;}
.logo-x{font-family:'Comic Sans MS',cursive;font-weight:900;font-size:1.9em;color:#9b2dc8;-webkit-text-stroke:2px #6a0a9e;font-style:italic;line-height:1;}
.logo-e{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.2em;color:#9b2dc8;line-height:1;}
nav{position:sticky;top:0;z-index:200;background:var(--bg);border-bottom:1px solid var(--bor);display:flex;align-items:center;justify-content:space-between;padding:0 12px;height:52px;overflow:hidden;}
.nav-r{display:flex;gap:4px;align-items:center;flex-shrink:0;}
.nb{background:transparent;color:var(--mut);border:none;border-radius:8px;padding:5px 7px;cursor:pointer;font-weight:700;font-size:12px;font-family:'Nunito',sans-serif;white-space:nowrap;flex-shrink:0;}
.nb:hover{color:var(--acc2);}
.main{max-width:600px;margin:0 auto;padding:12px 10px 72px;}
.card{background:var(--card);border:1px solid var(--bor);border-radius:14px;padding:14px;margin-bottom:10px;animation:fu .2s ease;}
@keyframes fu{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.btn{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border:none;border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:800;font-size:14px;font-family:'Nunito',sans-serif;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-o{background:transparent;color:var(--mut);border:1px solid var(--bor);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:13px;font-family:'Nunito',sans-serif;}
input,textarea,select{background:var(--surf);border:1.5px solid var(--bor);border-radius:10px;padding:9px 12px;color:var(--txt);font-size:14px;width:100%;outline:none;font-family:'Nunito Sans',sans-serif;}
input:focus,textarea:focus{border-color:var(--acc);}
textarea{resize:none;line-height:1.5;}
.av{border-radius:50%;background:linear-gradient(135deg,#9b35e830,#c060ff30);border:2px solid #9b35e855;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;font-size:18px;}
.av img{width:100%;height:100%;object-fit:cover;display:block;}
.fl{font-size:11px;color:var(--mut);margin-bottom:3px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-family:'Nunito',sans-serif;}
.lnk{color:var(--acc2);cursor:pointer;font-weight:700;}
.err{color:var(--red);font-size:13px;padding:8px 12px;background:#ff4d6d12;border-radius:8px;}
.ok{color:var(--grn);font-size:13px;padding:8px 12px;background:#4ade8012;border-radius:8px;}
.spin{width:14px;height:14px;border:2px solid #fff4;border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;display:inline-block;vertical-align:middle;margin-right:4px;}
@keyframes sp{to{transform:rotate(360deg)}}
.ph{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start;}
.act-row{display:flex;gap:6px;padding-top:10px;border-top:1px solid var(--bor);flex-wrap:wrap;}
.ab{display:flex;align-items:center;gap:4px;background:var(--surf);border:1.5px solid var(--bor);border-radius:20px;padding:7px 13px;cursor:pointer;font-size:13px;font-weight:800;color:var(--mut);font-family:'Nunito',sans-serif;transition:transform .1s,background .15s;box-shadow:0 1px 4px #0002;}
.ab.active,.ab.reacted{background:#9b35e822;border-color:#9b35e8;color:var(--acc2);box-shadow:0 1px 6px #9b35e833;}
.ab.reposted{background:#4ade8022;border-color:#4ade80;color:var(--grn);box-shadow:0 1px 6px #4ade8033;}
.react-panel{position:absolute;bottom:110%;left:0;background:var(--card);border:1px solid var(--bor);border-radius:40px;padding:5px 8px;display:flex;gap:4px;box-shadow:0 4px 16px #000a;z-index:300;}
.rb{font-size:20px;background:transparent;border:none;cursor:pointer;border-radius:50%;padding:3px;}
.cmts{margin-top:10px;border-top:1px solid var(--bor);padding-top:10px;}
.ci{display:flex;gap:7px;margin-bottom:8px;align-items:flex-start;}
.cb{background:var(--surf);border-radius:10px;padding:7px 10px;flex:1;border:1px solid var(--bor);}
.ca{font-weight:800;font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif;}
.ct2{color:var(--mut);font-size:11px;margin-left:5px;}
.ctxt{font-size:14px;line-height:1.5;margin-top:2px;color:var(--txt);}
.ci-row{display:flex;gap:6px;margin-top:8px;align-items:center;}
.ci-row input{flex:1;padding:7px 10px;font-size:13px;}
.sbtn{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border:none;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:14px;}
.mbox{position:absolute;bottom:100%;left:36px;background:var(--card);border:1px solid var(--bor);border-radius:10px;z-index:300;min-width:160px;display:none;box-shadow:0 4px 14px #000a;max-height:160px;overflow-y:auto;}
.mopt{padding:8px 11px;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:13px;}
.mopt:hover{background:var(--surf);}
.sug-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;}
.sug{background:var(--surf);border:1px solid var(--bor);border-radius:11px;padding:9px 10px;cursor:pointer;text-align:center;min-width:82px;flex-shrink:0;}
.sl{font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;font-family:'Nunito',sans-serif;}
.empty{text-align:center;color:var(--mut);padding:36px 16px;font-size:14px;}
.load{text-align:center;color:var(--mut);padding:20px;}
.bell-w{position:relative;display:inline-flex;}
@keyframes bellPulse{0%{transform:scale(1);}30%{transform:scale(1.35) rotate(-8deg);}50%{transform:scale(1.35) rotate(8deg);}70%{transform:scale(1.35) rotate(-5deg);}90%{transform:scale(1.2);}100%{transform:scale(1.25);}}
.bell-active{animation:bellPulse .5s ease forwards;font-size:22px !important;}
.nbadge{position:absolute;top:0;right:0;background:var(--red);color:#fff;border-radius:50%;width:14px;height:14px;font-size:8px;font-weight:800;display:none;align-items:center;justify-content:center;pointer-events:none;}
.npanel{}
.npanel-hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;border-bottom:1px solid var(--bor);}
.ni{display:flex;gap:8px;padding:9px 13px;border-bottom:1px solid var(--bor);cursor:pointer;align-items:flex-start;}
.ni.unread{background:#9b35e808;}
.ndot{width:6px;height:6px;border-radius:50%;background:var(--acc2);flex-shrink:0;margin-top:4px;}
.tag{border-radius:6px;padding:2px 6px;font-size:10px;font-weight:800;font-family:'Nunito',sans-serif;}
.tpub{background:#4ade8018;color:var(--grn);}
.tfri{background:#fbbf2418;color:var(--yel);}
.tprv{background:#ff4d6d18;color:var(--red);}
.tgrp{background:#9b35e818;color:var(--acc2);}
.av-pick{display:flex;gap:6px;flex-wrap:wrap;}
.av-btn{font-size:18px;background:transparent;border:2px solid var(--bor);border-radius:8px;padding:3px 5px;cursor:pointer;}
.av-btn.sel{background:#9b35e820;border-color:var(--acc);}
.pstats{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;}
.pstat b{font-family:'Nunito',sans-serif;font-weight:900;}
.pstat span{color:var(--mut);font-size:13px;}
.lock-msg{background:#fbbf2412;border:1px solid #fbbf2433;border-radius:10px;padding:11px;text-align:center;color:var(--yel);font-size:13px;margin-bottom:10px;}
.block-banner{background:#ff4d6d12;border:1px solid #ff4d6d33;border-radius:10px;padding:11px;text-align:center;color:var(--red);font-size:13px;margin-bottom:10px;}
.rp-banner{font-size:12px;color:var(--mut);margin-bottom:7px;display:flex;align-items:center;gap:4px;}
.tab-row{display:flex;margin-bottom:12px;border-bottom:2px solid var(--bor);}
.tab{background:transparent;border:none;color:var(--mut);font-weight:700;font-size:14px;font-family:'Nunito',sans-serif;padding:7px 13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;}
.tab.active{color:var(--acc2);border-bottom-color:var(--acc2);}
.gc{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bor);cursor:pointer;}
.gav{width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;overflow:hidden;}
.pav{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ff6b9d,#ff4d6d);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;overflow:hidden;}
.msg-wrap{display:flex;flex-direction:column;gap:7px;padding:8px 3px;}
.msg-row{display:flex;gap:7px;align-items:flex-end;width:100%;}
.msg-row.mine{flex-direction:row-reverse;}
.msg-bub{max-width:calc(100% - 44px);padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap;}
.msg-bub.theirs{background:var(--surf);border:1px solid var(--bor);}
.msg-bub.mine{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;}
.msg-time{font-size:10px;color:var(--mut);text-align:center;padding:2px;}
.chat-inp{display:flex;gap:6px;align-items:center;padding:9px 0;border-top:1px solid var(--bor);padding-bottom:max(10px,env(safe-area-inset-bottom));}
.chat-inp input{flex:1;}
.bnav{position:fixed;bottom:0;left:0;right:0;height:58px;background:var(--card);border-top:1px solid var(--bor);display:flex;align-items:center;justify-content:space-around;z-index:200;}
.bnav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;height:100%;background:transparent;border:none;cursor:pointer;color:var(--mut);font-size:20px;padding:0;position:relative;}
.bnav-btn.active{color:var(--acc);}
.bnav-btn span{font-size:10px;font-weight:700;font-family:'Nunito',sans-serif;margin-top:1px;}
.xc-pill{display:flex;align-items:center;gap:3px;background:#fbbf2418;border-radius:16px;padding:3px 8px;cursor:pointer;flex-shrink:0;}
.xc-pill span{font-size:12px;font-weight:800;color:#fbbf24;font-family:'Nunito',sans-serif;}
.voice-btn{background:transparent;border:1px solid var(--bor);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:15px;color:var(--mut);}
.voice-btn.recording{background:#ff4d6d18;border-color:#ff4d6d;color:var(--red);animation:pulse .6s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.gif-panel{position:absolute;bottom:100%;left:0;right:0;background:var(--card);border:1px solid var(--bor);border-radius:12px;z-index:300;box-shadow:0 4px 18px #000a;padding:9px;}
.gif-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;max-height:200px;overflow-y:auto;}
.gif-item{border-radius:7px;overflow:hidden;cursor:pointer;aspect-ratio:1;}
.gif-item img{width:100%;height:100%;object-fit:cover;display:block;}
.ref-card{background:linear-gradient(135deg,#0a2e0a,#1a4a1a);border:2px solid #4ade8044;border-radius:14px;padding:14px;margin-bottom:10px;}
.ref-link{background:#00000033;border-radius:9px;padding:8px 11px;font-size:11px;color:#4ade80;font-weight:700;word-break:break-all;margin:8px 0;}
.store-hero{background:linear-gradient(135deg,#1a0a2e,#2d0a4e);padding:20px 14px;text-align:center;border-radius:14px;margin-bottom:10px;}
.saldo-card{background:#ffffff10;border:1px solid #9b35e833;border-radius:14px;padding:10px 16px;display:inline-flex;align-items:center;gap:9px;margin-top:8px;}
.saldo-num{font-size:24px;font-weight:900;color:#fbbf24;font-family:'Nunito',sans-serif;}
.section-card{border-radius:14px;padding:14px;cursor:pointer;margin-bottom:8px;}
.sc-referral{background:linear-gradient(135deg,#1a3a0a,#2d6a1a);border:2px solid #4ade8044;}
.sc-funcs{background:linear-gradient(135deg,#1e3a5f,#2d5a8e);}
.sc-custom{background:linear-gradient(135deg,#3d1a5f,#6b2d9e);}
.sc-visib{background:linear-gradient(135deg,#1a4a2e,#2d7a4e);}
.sc-gift{background:linear-gradient(135deg,#4a0a2a,#8b1a4a);}
.sc-sorpresa{background:linear-gradient(135deg,#1a3a4a,#2d6a7a);}
.item-card{background:var(--surf);border:1px solid var(--bor);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.item-icon{font-size:22px;width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#2e2540;background:var(--surf);border:1px solid var(--bor);}
.item-info{flex:1;}
.item-name{font-size:13px;font-weight:800;font-family:'Nunito',sans-serif;color:var(--txt);}
.item-desc{font-size:11px;color:var(--mut);margin-top:2px;}
.item-dur{font-size:11px;color:var(--acc2);font-weight:700;margin-top:2px;}
.item-buy{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.item-price{font-size:12px;font-weight:900;color:#fbbf24;display:flex;align-items:center;gap:2px;}
.buy-btn{background:linear-gradient(135deg,var(--acc2),var(--acc));border:none;border-radius:7px;padding:5px 10px;color:#fff;font-size:11px;font-weight:800;cursor:pointer;}
.buy-btn.locked{background:var(--bor);color:var(--mut);cursor:not-allowed;}
.buy-btn.owned{background:linear-gradient(135deg,#4ade80,#22c55e);color:#0e0b14;}
.active-badge{background:#4ade8018;border:1px solid #4ade8033;border-radius:5px;padding:2px 5px;font-size:9px;color:#4ade80;font-weight:800;}
.tip-amount{background:var(--surf);border:2px solid var(--bor);border-radius:10px;padding:10px;text-align:center;cursor:pointer;}
.tip-amount.sel{border-color:var(--acc2);background:#9b35e818;}
.tip-val{font-size:18px;font-weight:900;color:#fbbf24;font-family:'Nunito',sans-serif;}
.ai-badge{background:var(--acc);color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;margin-left:3px;}
.prof-av-w{position:relative;flex-shrink:0;}
.av-ov{position:absolute;inset:0;border-radius:50%;background:#00000077;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;color:#fff;cursor:pointer;font-size:14px;}
.prof-av-w:hover .av-ov,.prof-av-w:active .av-ov{opacity:1;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-thumb{background:var(--bor);border-radius:3px;}
/* STORIES */
.stories-wrap{width:100%;overflow-x:auto;display:flex;gap:10px;padding:4px 2px 8px;-webkit-overflow-scrolling:touch;}
.stories-wrap::-webkit-scrollbar{display:none;}
.story-bubble{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;cursor:pointer;}
.story-ring{width:58px;height:58px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#c060ff,#9b35e8);flex-shrink:0;}
.story-ring.seen{background:var(--bor);}
.story-ring.add{background:linear-gradient(135deg,#4ade80,#22c55e);}
.story-av{width:100%;height:100%;border-radius:50%;border:2.5px solid var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--card);position:relative;}
.story-av img{width:100%;height:100%;object-fit:cover;}
.story-add-icon{position:absolute;bottom:-2px;right:-2px;width:18px;height:18px;background:linear-gradient(135deg,#4ade80,#22c55e);border-radius:50%;border:2px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#0e0b14;}
.story-name{font-size:10px;font-weight:700;color:var(--mut);max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;}
/* STORY VIEWER */
.story-viewer{position:fixed;inset:0;background:#000;z-index:2000;display:none;flex-direction:column;}
.story-viewer.open{display:flex;}
.story-progress-row{display:flex;gap:3px;padding:10px 12px 6px;position:absolute;top:0;left:0;right:0;z-index:10;}
.story-prog{flex:1;height:3px;background:#ffffff44;border-radius:2px;overflow:hidden;}
.story-prog-fill{height:100%;background:#fff;border-radius:2px;width:0%;transition:width linear;}
.story-top{position:absolute;top:22px;left:12px;right:12px;z-index:10;display:flex;align-items:center;gap:9px;}
.story-top-av{width:34px;height:34px;border-radius:50%;border:2px solid #fff;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:16px;background:#333;}
.story-top-av img{width:100%;height:100%;object-fit:cover;}
.story-top-info{flex:1;}
.story-top-name{font-size:13px;font-weight:800;color:#fff;font-family:Nunito,sans-serif;}
.story-top-time{font-size:11px;color:#ffffffaa;}
.story-close{background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px;}
.story-img{width:100%;height:100%;object-fit:cover;display:block;-webkit-touch-callout:none;user-select:none;pointer-events:none;}
.story-tap-area{position:absolute;inset:0;display:flex;-webkit-touch-callout:none;user-select:none;}
.story-tap-prev{flex:1;cursor:pointer;}
.story-tap-next{flex:1;cursor:pointer;}
.story-caption{position:absolute;bottom:0;left:0;right:0;padding:40px 16px 20px;background:linear-gradient(transparent,#000a);color:#fff;font-size:14px;line-height:1.5;}
/* UPLOAD STORY */
.story-upload-overlay{position:fixed;inset:0;background:#000b;z-index:2100;display:none;align-items:center;justify-content:center;}
.story-reactions{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:20;padding:0 16px;}
.story-react-btn{font-size:28px;background:#00000055;border:none;border-radius:50%;width:48px;height:48px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:transform .15s;}
.story-react-btn:active{transform:scale(1.3);}
.story-react-sent{font-size:13px;color:#fff;text-align:center;background:#00000055;border-radius:20px;padding:6px 14px;backdrop-filter:blur(4px);}
.story-reactions-summary{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:20;flex-wrap:wrap;padding:0 16px;}
.story-react-count{font-size:13px;color:#fff;background:#00000066;border-radius:20px;padding:5px 12px;backdrop-filter:blur(4px);}
.story-upload-overlay.open{display:flex;}
.story-upload-box{background:var(--card);border:1px solid var(--bor);border-radius:18px;padding:20px;width:90%;max-width:340px;}
.story-upload-title{font-weight:900;font-size:16px;font-family:Nunito,sans-serif;margin-bottom:12px;text-align:center;}
.story-preview{width:100%;aspect-ratio:9/16;max-height:280px;border-radius:12px;overflow:hidden;background:var(--surf);display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:40px;}
.story-preview img{width:100%;height:100%;object-fit:cover;}

/* REPOST COMPOSER */
.repost-overlay{position:fixed;inset:0;background:#000b;z-index:2000;display:none;align-items:flex-end;justify-content:center;}
.repost-overlay.open{display:flex;}
.repost-box{background:var(--card);border:2px solid var(--bor);border-radius:20px 20px 0 0;width:100%;max-width:500px;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;}
.repost-title{font-weight:900;font-size:15px;font-family:Nunito,sans-serif;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.repost-textarea{width:100%;background:var(--bg);border:1.5px solid var(--bor);border-radius:10px;padding:10px 12px;color:var(--txt);font-size:14px;outline:none;resize:none;font-family:'Nunito Sans',sans-serif;min-height:80px;margin-bottom:10px;}
.repost-textarea:focus{border-color:var(--acc);}
.repost-preview{background:var(--surf);border:1px solid var(--bor);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;}
.repost-preview-author{font-weight:800;color:var(--acc2);margin-bottom:4px;font-size:12px;}
.repost-preview-text{color:var(--mut);line-height:1.5;}

/* IMAGE VIEWER */
.img-viewer{position:fixed;inset:0;background:#000;z-index:5000;display:none;flex-direction:column;align-items:center;justify-content:center;}
.img-viewer.open{display:flex;}

/* REPLY PREVIEW */

/* GAMES */
.games-overlay{position:fixed;inset:0;background:#000b;z-index:2000;display:none;align-items:center;justify-content:center;}
.games-overlay.open{display:flex;}

.mgame-dot.ok{background:var(--grn);}

.guser-name{font-size:9px;color:var(--mut);font-weight:700;max-width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gchat-msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
.gday-div{text-align:center;color:var(--mut);font-size:11px;padding:4px 0;}
.gmsg-row{display:flex;gap:7px;align-items:flex-end;max-width:88%;}
.gmsg-row.mine{flex-direction:row-reverse;align-self:flex-end;}
.gmsg-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;overflow:hidden;}
.gmsg-av img{width:100%;height:100%;object-fit:cover;}
.gmsg-col{display:flex;flex-direction:column;gap:2px;}
.gmsg-name{font-size:10px;font-weight:800;color:var(--acc2);font-family:Nunito,sans-serif;}
.gmsg-row.mine .gmsg-name{text-align:right;}
.gbub{padding:8px 12px;border-radius:17px;font-size:14px;line-height:1.5;word-break:break-word;max-width:240px;}
.gbub.theirs{background:var(--card);border:1px solid var(--bor);border-bottom-left-radius:3px;}
.gbub.mine{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border-bottom-right-radius:3px;}
.gbub-time{font-size:10px;color:var(--mut);padding:0 3px;}
.gmsg-row.mine .gbub-time{text-align:right;}
.gchat-inp-area{padding:9px 11px;background:var(--surf);border-top:1px solid var(--bor);display:flex;gap:7px;align-items:flex-end;flex-shrink:0;padding-bottom:max(9px,env(safe-area-inset-bottom));}
.gchat-inp{flex:1;background:var(--bg);border:1.5px solid var(--bor);border-radius:20px;padding:9px 13px;color:var(--txt);font-size:14px;outline:none;resize:none;max-height:90px;font-family:'Nunito Sans',sans-serif;line-height:1.4;}
.gchat-inp:focus{border-color:var(--acc);}
.gchat-send{width:38px;height:38px;background:linear-gradient(135deg,var(--acc2),var(--acc));border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:15px;color:#fff;}
.gchat-send:active{transform:scale(.9);}
.gemoji-row{display:flex;gap:5px;padding:5px 11px 0;background:var(--surf);}
.gep{font-size:19px;cursor:pointer;padding:2px;border-radius:5px;}
.gep:active{background:var(--bor);}
button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}

function formatText(txt){
  if(!txt)return'';
  const r=[];let i=0;
  while(i<txt.length){
    if(txt[i]==='h'&&txt.slice(i,i+4)==='http'){let j=i;while(j<txt.length&&!/\s/.test(txt[j]))j++;r.push('<a href="'+esc(txt.slice(i,j))+'" target="_blank" rel="noopener" style="color:#c060ff;text-decoration:underline;word-break:break-all;">'+esc(txt.slice(i,j))+'</a>');i=j;continue;}
    if(txt[i]==='@'){let j=i+1;while(j<txt.length&&/[a-zA-Z0-9_]/.test(txt[j]))j++;if(j>i+1){r.push('<span style="color:#c060ff;font-weight:700">'+txt.slice(i,j)+'</span>');i=j;continue;}}
    if(txt[i]==='#'){let j=i+1;while(j<txt.length&&/[a-zA-Z0-9_\u00C0-\u017E]/.test(txt[j]))j++;if(j>i+1){r.push('<span style="color:#9b35e8;font-weight:700">'+txt.slice(i,j)+'</span>');i=j;continue;}}
    const ch=txt[i];if(ch==='&')r.push('&amp;');else if(ch==='<')r.push('&lt;');else if(ch==='>')r.push('&gt;');else r.push(ch);i++;
  }
  return r.join('').replace(/\n/g,'<br>');
}

      };
      content.appendChild(ni);
    });
  }

onAuthStateChanged(auth,async u=>{
  try{
    if(u){

      const cutoff=new Date('2026-04-12T00:00:00Z');
      const createdAt=u.metadata?.creationTime?new Date(u.metadata.creationTime):new Date(0);
      if(!u.emailVerified && createdAt>=cutoff){
        await signOut(auth);
        S.cu=null;S.me=null;S.view='login';
        render();
        setTimeout(()=>showMsg('lmsg','Verifica tu email antes de entrar. Revisa tu bandeja de entrada 📧','err'),300);

      S.cu=u;const p=await loadU(u.uid);S.me=p;if(p)S.users[u.uid]=p;await loadFriends();await loadBlocked();

      try{
        const savedView=sessionStorage.getItem('xelfi-view');
        const savedPid=sessionStorage.getItem('xelfi-pid');
        const savedChatWith=sessionStorage.getItem('xelfi-chatWith');
        if(savedView&&savedView!=='login'&&savedView!=='register'){

          S.view=savedView==='chat'?'messages':savedView;
          if(savedPid)S.pid=savedPid;

      if(S.view==='login'||S.view==='register')S.view='feed';listenNotifs(u.uid);setTimeout(()=>checkReferral(),2000);setTimeout(()=>buildStoreBubble(),1200);}

});

window.addEventListener('popstate',(e)=>{
  // First try to close any open overlay panels
  const overlayIds=['npanel','single-post-panel','normas-panel','pro-profile-panel','ad-detail-panel','store-feed-panel','img-viewer','repost-ov','pro-card-ov','new-group-ov','new-channel-ov','pending-ads-ov','reports-admin-ov'];
  let closed=false;
  for(const id of overlayIds){
    const el=document.getElementById(id);
    if(el&&(el.classList.contains('open')||el.style.transform==='translateY(0px)'||el.style.transform==='translateY(0)'||el.style.display==='flex'||id==='npanel')){
      el.remove();closed=true;break;
    }
  }
  if(closed){history.pushState(null,'',window.location.href);return;}
  // Then try xelfi view history
  if(xelfiHistory.length>1){
    xelfiHistory.pop();
    S.view=xelfiHistory[xelfiHistory.length-1]||'feed';
    render();
  } else {
    history.pushState(null,'',window.location.href);
  }
});

function render(){
  // Track navigation history
  if(xelfiHistory[xelfiHistory.length-1]!==S.view){
    xelfiHistory.push(S.view);
    if(xelfiHistory.length>15)xelfiHistory.shift();
    history.pushState(null,'',window.location.href);
  }
  // Save current view to sessionStorage
  try{sessionStorage.setItem('xelfi-view',S.view);if(S.pid)sessionStorage.setItem('xelfi-pid',S.pid);if(S.chatWith)sessionStorage.setItem('xelfi-chatWith',S.chatWith);}catch(e){}
  const app=document.getElementById('app');app.innerHTML='';
  // Show store bubble only on feed
  setTimeout(()=>{
    const sb=document.getElementById('store-bubble');
    if(sb)sb.style.display=(S.view==='feed')?'flex':'none';
  },50);
  const ob=document.getElementById('bnav');if(ob)ob.remove();
  if(!S.cu){app.appendChild(S.view==='register'?renderReg():renderLogin());return;}
  const v=S.view;
  if(v==='profile'){renderProf(app);addBnav('profile');}
  else if(v==='messages'){renderMsgs(app);addBnav('messages');}
  else if(v==='chat'){renderChat(app);}
  else if(v==='search'){renderSearch(app);addBnav('search');}
  else if(v==='groups'||v==='pages'){renderGroups(app);addBnav('groups');}
  else if(v==='group'){renderGroup(app);}
  else if(v==='page'){renderPage(app);}
  else if(v==='newgroup'){renderNewGroup(app);}
  else if(v==='newpage'){renderNewPage(app);}
  else if(v==='settings'){renderSettings(app);addBnav('settings');}
  else if(v==='store'){renderStore(app);addBnav('feed');}

async function doReg(){

  try{

    const h=(f.h?(f.h.startsWith('@')?f.h:'@'+f.h):'@'+f.n.toLowerCase().replace(/\s/g,'')).toLowerCase();

    const reserved=['@eloy_vallina','@xelfi','@admin','@soporte'];

    await setDoc(doc(db,'users',cred.user.uid),profile);
    S.me=profile;S.users[cred.user.uid]=profile;

      const img=document.createElement('img');img.src=img64;img.style.cssText='width:100%;border-radius:8px;'+(S.nimgs.length===1?'max-height:280px;':'height:120px;')+';object-fit:cover;display:block;';

      rm.onclick=()=>{S.nimgs.splice(idx,1);S.ni=S.nimgs[0]||'';render();};
      wrap.appendChild(img);wrap.appendChild(rm);pv.appendChild(wrap);
    });
    card.appendChild(pv);
  }
  const fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.multiple=true;fi.style.display='none';
  fi.onchange=e=>{
    const files=Array.from(e.target.files).slice(0,3);if(!files.length)return;
    S.nimgs=[];let loaded=0;
    files.forEach(f=>{
      const r=new FileReader();r.onload=ev=>{
        const i=new Image();i.onload=()=>{
          const cv=document.createElement('canvas');const mw=800;const rt=Math.min(1,mw/i.width);
          cv.width=Math.round(i.width*rt);cv.height=Math.round(i.height*rt);
          cv.getContext('2d').drawImage(i,0,0,cv.width,cv.height);
          S.nimgs.push(cv.toDataURL('image/jpeg',0.7));
          loaded++;if(loaded===files.length){S.ni=S.nimgs[0]||'';render();}
        };i.src=ev.target.result;
      };r.readAsDataURL(f);

  const pb=document.createElement('button');pb.className='btn';pb.style.cssText='padding:8px 14px;font-size:13px;';pb.textContent='Publicar';
  pb.onclick=async()=>{if(!S.np.trim()&&(!S.nimgs||S.nimgs.length===0))return;
    // Daily post limit
    if(!isAdmin()){
      const todayStart=new Date();todayStart.setHours(0,0,0,0);
      const pSnap=await getDocs(query(collection(db,'posts'),orderBy('createdAt','desc')));
      let cnt=0;pSnap.forEach(d=>{const dd=d.data();if(dd.userId===S.cu.uid&&dd.createdAt?.toDate&&dd.createdAt.toDate()>=todayStart)cnt++;});
      if(cnt>=10){alert('Límite de 10 posts por día alcanzado 🚫');return;}
    }
    pb.disabled=true;pb.innerHTML='<span class="spin"></span>';
    try{const _postContent=S.np;const _postImage=(S.nimgs&&S.nimgs[0])||null;
    const _postRef=await addDoc(collection(db,'posts'),{userId:S.cu.uid,type:(S.nimgs&&S.nimgs.length>0)?'image':'status',content:_postContent,image:_postImage,images:S.nimgs&&S.nimgs.length>1?S.nimgs:null,privacy:S.npv,createdAt:serverTimestamp(),likes:[],comments:[],reposts:[]});
    if(_postContent.toLowerCase().includes('@xelfi'))setTimeout(()=>checkAI({id:_postRef.id,content:_postContent,image:null}),1500);
    await addXC(S.cu.uid,10);S.np='';S.ni='';S.nimgs=[];S.npv='public';render();}
    catch(e){alert('Error: '+e.message);pb.disabled=false;pb.textContent='Publicar';}};
  act.appendChild(ib);act.appendChild(ps);act.appendChild(pb);card.appendChild(act);return card;
}
function handleMention(val,box,cb){
  const ai=val.lastIndexOf('@');if(ai<0){box.style.display='none';return;}
  const q=val.slice(ai+1).toLowerCase();
  const ms=S.friends.map(uid=>S.users[uid]).filter(u=>u&&((u.name||'').toLowerCase().includes(q)||(u.handle||'').toLowerCase().includes(q))).slice(0,5);
  if(!ms.length){box.style.display='none';return;}
  box.innerHTML='';box.style.display='block';
  ms.forEach(u=>{const opt=document.createElement('div');opt.className='mopt';opt.innerHTML=em(u.avatar)+' <b>'+esc(u.name)+'</b>';opt.onmousedown=ev=>{ev.preventDefault();const nv=val.slice(0,ai)+'@'+(u.handle||'').replace('@','')+' ';cb(nv);box.style.display='none';};box.appendChild(opt);});
}

async function sendCmt(post,cinEl){
  const text=cinEl?cinEl.value:document.getElementById('ci-'+post.id)?.value||'';if(!text.trim())return;
  // Check daily comment limit
  const todayCmt=new Date();todayCmt.setHours(0,0,0,0);
  const allPosts=await getDocs(collection(db,'posts'));
  let cmtCount=0;
  allPosts.forEach(d=>{const cmts=d.data().comments||[];cmts.forEach(cm=>{if(cm.userId===S.cu.uid&&new Date(cm.createdAt)>=todayCmt)cmtCount++;});});
  if(cmtCount>=50){alert('Has alcanzado el límite de 50 comentarios por día 🚫');return;}
  try{await updateDoc(doc(db,'posts',post.id),{comments:arrayUnion({userId:S.cu.uid,text,createdAt:new Date().toISOString()})});await addNotif(post.userId,'comment',post.id);await addXC(S.cu.uid,5);if(cinEl)cinEl.value='';
    if(text.toLowerCase().includes('@xelfi'))await callXelfiAI(text.replace(/@xelfi/gi,'').trim(),post.id);}catch(e){}
}

async function loadMsgsTab(tab,list){
  list.innerHTML='<div style="text-align:center;padding:30px;color:var(--mut);">Cargando...</div>';
  if(tab==='direct'){
    list.innerHTML='';
    if(!S.friends||!S.friends.length){list.innerHTML='<div style="text-align:center;padding:30px;color:var(--mut);">Agrega amigos para chatear</div>';return;}
    for(const fuid of S.friends){
      const fu=await loadU(fuid);if(!fu)continue;
      const chatId=[S.cu.uid,fuid].sort().join('_');
      let lastMsg=null;let unread=0;
      try{
        const ms=await getDocs(query(collection(db,'chats',chatId,'messages'),orderBy('createdAt','desc')));
        if(ms&&!ms.empty){lastMsg=ms.docs[0].data();unread=ms.docs.filter(d=>d.data().to===S.cu.uid&&!d.data().read).length;}
      }catch(e){console.warn('chat load error',fuid,e);}
      const row=document.createElement('div');row.className='msgs-row';
      const av=avEl(fu,44);av.style.flexShrink='0';row.appendChild(av);
      const info=document.createElement('div');info.className='msgs-row-info';
      const nm=document.createElement('div');nm.className='msgs-row-name';nm.textContent=fu.name;
      const pv=document.createElement('div');pv.className='msgs-row-preview';pv.textContent=lastMsg?lastMsg.text:'Iniciar conversación...';
      info.appendChild(nm);info.appendChild(pv);row.appendChild(info);
      const meta=document.createElement('div');meta.className='msgs-row-meta';
      if(lastMsg?.createdAt){const d=lastMsg.createdAt.toDate?.();if(d){const h=d.getHours().toString().padStart(2,'0');const m2=d.getMinutes().toString().padStart(2,'0');const time=document.createElement('div');time.className='msgs-time';time.textContent=h+':'+m2;meta.appendChild(time);}}
      if(unread>0){const badge=document.createElement('div');badge.className='msgs-unread';badge.textContent=unread;meta.appendChild(badge);}
      row.appendChild(meta);
      row.onclick=()=>{S.chatWith=fuid;S.view='chat';render();};

async function sendMsg(chatId){

  const ci=document.getElementById('chat-input-field');if(ci)ci.value='';
  try{
    await setDoc(doc(db,'chats',chatId),{participants:[S.cu.uid,S.chatWith],updatedAt:serverTimestamp()},{merge:true});

        }).catch(()=>{});
      }
    },1000);
  }catch(e){console.error('sendMsg error',e);alert('Error enviando: '+e.message);}
}

// STORIES
let storyViewerIdx=0;let storyList=[];let storyTimer=null;let storyProgress=null;

async function loadStories(container){
  try{
    const sn=await getDocs(query(collection(db,'stories'),orderBy('createdAt','desc')));
    const now=Date.now();const valid=[];
    sn.forEach(d=>{const s={id:d.id,...d.data()};const age=now-(s.createdAt?.toDate?.()?.getTime()||now);if(age<86400000)valid.push(s);});
    storyList=valid;
    container.innerHTML='';
    // Add bubble
    const addBub=buildAddStoryBubble();container.appendChild(addBub);
    // Story bubbles
    valid.forEach((s,i)=>{container.appendChild(buildStoryBubble(s,i));});
  }catch(e){console.error(e);}
}

function buildAddStoryBubble(){
  const wrap=document.createElement('div');wrap.className='story-bubble';
  const ring=document.createElement('div');ring.className='story-ring add';
  const av=document.createElement('div');av.className='story-av';
  if(S.me?.photo){const img=document.createElement('img');img.src=S.me.photo;av.appendChild(img);}else{av.textContent=em(S.me?.avatar);}
  const plus=document.createElement('div');plus.className='story-add-icon';plus.textContent='+';av.appendChild(plus);
  ring.appendChild(av);wrap.appendChild(ring);
  const nm=document.createElement('div');nm.className='story-name';nm.textContent='Tu historia';wrap.appendChild(nm);
  wrap.onclick=()=>openStoryUpload();return wrap;
}

function buildStoryBubble(s,i){
  const wrap=document.createElement('div');wrap.className='story-bubble';
  const ring=document.createElement('div');ring.className='story-ring';
  const av=document.createElement('div');av.className='story-av';
  if(s.photo){const img=document.createElement('img');img.src=s.photo;av.appendChild(img);}else{av.textContent=em(s.avatar);}
  ring.appendChild(av);wrap.appendChild(ring);
  const nm=document.createElement('div');nm.className='story-name';nm.textContent=(s.name||'').split(' ')[0];wrap.appendChild(nm);
  wrap.onclick=()=>openStoryViewer(i);return wrap;
}

function openStoryViewer(idx){
  if(!storyList.length)return;
  storyViewerIdx=idx;
  let viewer=document.getElementById('story-viewer');
  if(!viewer){viewer=buildStoryViewer();document.body.appendChild(viewer);}
  viewer.classList.add('open');
  showStory(storyViewerIdx);
}

function buildStoryViewer(){
  const v=document.createElement('div');v.className='story-viewer';v.id='story-viewer';
  // Progress bars
  const pr=document.createElement('div');pr.className='story-progress-row';pr.id='story-prog-row';v.appendChild(pr);
  // Top bar
  const top=document.createElement('div');top.className='story-top';top.id='story-top';v.appendChild(top);
  // Image
  const img=document.createElement('img');img.className='story-img';img.id='story-img';v.appendChild(img);
  // Caption
  const cap=document.createElement('div');cap.className='story-caption';cap.id='story-cap';v.appendChild(cap);
  // Tap areas
  const tap=document.createElement('div');tap.className='story-tap-area';
  const prev=document.createElement('div');prev.className='story-tap-prev';prev.onclick=()=>prevStory();
  const next=document.createElement('div');next.className='story-tap-next';next.onclick=()=>nextStory();
  tap.appendChild(prev);tap.appendChild(next);v.appendChild(tap);
  // Pause on hold
  let holdTimer=null;
  tap.addEventListener('touchstart',e=>{holdTimer=setTimeout(()=>pauseStory(),150);},{passive:true});
  tap.addEventListener('touchend',()=>{clearTimeout(holdTimer);resumeStory();},{passive:true});
  tap.addEventListener('mousedown',()=>{holdTimer=setTimeout(()=>pauseStory(),150);});
  tap.addEventListener('mouseup',()=>{clearTimeout(holdTimer);resumeStory();});
  // Reactions container
  const reactArea=document.createElement('div');reactArea.id='story-react-area';v.appendChild(reactArea);
  return v;
}

function showStory(idx){
  if(idx<0||idx>=storyList.length){closeStoryViewer();return;}
  const s=storyList[idx];
  // Progress bars
  const pr=document.getElementById('story-prog-row');
  if(pr){pr.innerHTML='';storyList.forEach((_,i)=>{const b=document.createElement('div');b.className='story-prog';const f=document.createElement('div');f.className='story-prog-fill';f.id='spf-'+i;if(i<idx)f.style.width='100%';b.appendChild(f);pr.appendChild(b);});}
  // Top
  const top=document.getElementById('story-top');
  if(top){top.innerHTML='';const av=document.createElement('div');av.className='story-top-av';if(s.photo){const img=document.createElement('img');img.src=s.photo;av.appendChild(img);}else av.textContent=em(s.avatar);const info=document.createElement('div');info.className='story-top-info';const nm=document.createElement('div');nm.className='story-top-name';nm.textContent=s.name||'Usuario';const ts=s.createdAt?.toDate?.();const ago=ts?Math.floor((Date.now()-ts.getTime())/3600000)+'h':'ahora';const ti=document.createElement('div');ti.className='story-top-time';ti.textContent=ago;info.appendChild(nm);info.appendChild(ti);const cl=document.createElement('button');cl.className='story-close';cl.textContent='✕';cl.onclick=closeStoryViewer;
    // Delete button if own story
    if(s.userId===S.cu?.uid){const db3=document.createElement('button');db3.style.cssText='background:transparent;border:none;color:#fff;font-size:18px;cursor:pointer;padding:4px 8px;';db3.textContent='⋯';db3.onclick=async e=>{e.stopPropagation();if(confirm('Eliminar tu historia?')){try{await deleteDoc(doc(db,'stories',s.id));closeStoryViewer();alert('Historia eliminada.');}catch(err){alert('Error.');}}};top.appendChild(av);top.appendChild(info);top.appendChild(db3);top.appendChild(cl);}
    else{top.appendChild(av);top.appendChild(info);top.appendChild(cl);}
  }
  // Image
  const img=document.getElementById('story-img');if(img)img.src=s.image||'';
  // Caption
  const cap=document.getElementById('story-cap');if(cap)cap.textContent=s.caption||'';
  // Auto advance 5s
  clearTimeout(storyTimer);if(storyProgress)clearInterval(storyProgress);if(storyProgressInterval)clearInterval(storyProgressInterval);
  storyPaused=false;storyProgressPct=0;
  const fill=document.getElementById('spf-'+idx);
  if(fill){storyProgress=setInterval(()=>{if(storyPaused)return;storyProgressPct+=100/50;fill.style.width=Math.min(storyProgressPct,100)+'%';if(storyProgressPct>=100){clearInterval(storyProgress);nextStory();}},100);}
  // Load reactions
  renderStoryReactions(s);
}

let storyPaused=false;let storyProgressPct=0;let storyProgressInterval=null;
function pauseStory(){storyPaused=true;if(storyProgressInterval){clearInterval(storyProgressInterval);storyProgressInterval=null;}}
function resumeStory(){if(!storyPaused)return;storyPaused=false;const fill=document.getElementById('spf-'+storyViewerIdx);if(!fill)return;storyProgressInterval=setInterval(()=>{storyProgressPct+=100/50;fill.style.width=Math.min(storyProgressPct,100)+'%';if(storyProgressPct>=100){clearInterval(storyProgressInterval);nextStory();}},100);}

async function renderStoryReactions(s){
  const area=document.getElementById('story-react-area');if(!area)return;
  area.innerHTML='';
  const isOwn=s.userId===S.cu?.uid;
  if(isOwn){
    // Show reaction counts
    const reactions=s.reactions||{};
    const REACTS=['👍','❤️','😂','😮','😢','🔥'];
    const totals=REACTS.filter(e=>reactions[e]&&Object.keys(reactions[e]).length>0);
    const commentList=Array.isArray(s.storyComments)?s.storyComments:[];
    if(totals.length||commentList.length){
      const sum=document.createElement('div');sum.className='story-reactions-summary';
      totals.forEach(e=>{const cnt=Object.keys(reactions[e]||{}).length;const el=document.createElement('div');el.className='story-react-count';el.textContent=e+' '+cnt;sum.appendChild(el);});
      if(commentList.length){
        const cmtEl=document.createElement('div');cmtEl.style.cssText='position:absolute;bottom:70px;left:12px;right:12px;max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;';
        commentList.forEach(cmt=>{const c2=document.createElement('div');c2.style.cssText='background:#00000066;border-radius:10px;padding:6px 10px;font-size:12px;color:#fff;backdrop-filter:blur(4px);';c2.innerHTML='<b style="color:#c060ff;">'+esc(cmt.name)+':</b> '+esc(cmt.text);cmtEl.appendChild(c2);});
        area.appendChild(cmtEl);
      }
      area.appendChild(sum);
    } else {
      const msg=document.createElement('div');msg.style.cssText='position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#ffffff88;font-size:12px;';msg.textContent='Sin reacciones aún';area.appendChild(msg);
    }
  } else {
    // Show reaction buttons
    const row=document.createElement('div');row.className='story-reactions';
    const REACTS=['👍','❤️','😂','😮','😢','🔥'];
    const myReaction=s.reactions?Object.keys(s.reactions).find(e=>s.reactions[e]&&s.reactions[e][S.cu?.uid]):null;
    REACTS.forEach(e=>{
      const btn=document.createElement('button');btn.className='story-react-btn';btn.textContent=e;
      if(myReaction===e)btn.style.background='#9b35e888';
      btn.onclick=async ev=>{ev.stopPropagation();
        try{const upd={};upd['reactions.'+e+'.'+S.cu.uid]=true;if(myReaction&&myReaction!==e)upd['reactions.'+myReaction+'.'+S.cu.uid]=false;
        await updateDoc(doc(db,'stories',s.id),upd);
        // Show sent feedback
        row.style.display='none';const fb=document.createElement('div');fb.className='story-react-sent';fb.textContent=e+' Enviado';fb.style.cssText='position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:14px;color:#fff;background:#00000066;border-radius:20px;padding:8px 18px;';area.appendChild(fb);}catch(err){}};
      row.appendChild(btn);});
    area.appendChild(row);
    // Comment input
    const cWrap=document.createElement('div');cWrap.style.cssText='position:absolute;bottom:70px;left:12px;right:12px;display:flex;gap:6px;align-items:center;';
    const cNote=document.createElement('div');cNote.style.cssText='position:absolute;bottom:110px;left:12px;right:12px;text-align:center;font-size:10px;color:#ffffff88;';cNote.textContent='Solo el autor verá tu comentario';area.appendChild(cNote);
    const cInp=document.createElement('input');cInp.style.cssText='flex:1;background:#00000066;border:1px solid #ffffff44;border-radius:20px;padding:8px 14px;color:#fff;font-size:13px;outline:none;backdrop-filter:blur(6px);';cInp.placeholder='Escribe un comentario...';
    const cSend=document.createElement('button');cSend.style.cssText='background:linear-gradient(135deg,#c060ff,#9b35e8);border:none;border-radius:50%;width:34px;height:34px;color:#fff;cursor:pointer;font-size:15px;flex-shrink:0;';cSend.textContent='➤';
    cSend.onclick=async ev=>{ev.stopPropagation();const txt=cInp.value.trim();if(!txt)return;
      try{
        await updateDoc(doc(db,'stories',s.id),{storyComments:arrayUnion({uid:S.cu.uid,text:txt,name:S.me?.name||'',avatar:S.me?.avatar||'star',createdAt:new Date().toISOString()})});
        await addNotif(s.userId,'comment',s.id);
        cInp.value='';cSend.textContent='✓';setTimeout(()=>cSend.textContent='➤',1500);
      }catch(err){console.error(err);}
    };
    cInp.addEventListener('keydown',e=>{if(e.key==='Enter')cSend.onclick(e);});
    cWrap.appendChild(cInp);cWrap.appendChild(cSend);area.appendChild(cWrap);
  }
}

function nextStory(){clearTimeout(storyTimer);if(storyProgress)clearInterval(storyProgress);storyViewerIdx++;if(storyViewerIdx>=storyList.length)closeStoryViewer();else showStory(storyViewerIdx);}
function prevStory(){clearTimeout(storyTimer);if(storyProgress)clearInterval(storyProgress);storyViewerIdx=Math.max(0,storyViewerIdx-1);showStory(storyViewerIdx);}

  const v=document.createElement('div');v.className='img-viewer';v.id='img-viewer';
  const cl=document.createElement('button');cl.className='img-viewer-close';cl.textContent='✕';cl.onclick=closeImageViewer;v.appendChild(cl);
  const counter=document.createElement('div');counter.className='img-viewer-counter';counter.id='iv-counter';v.appendChild(counter);
  const img=document.createElement('img');img.className='img-viewer-img';img.id='iv-img';v.appendChild(img);
  const prev=document.createElement('button');prev.className='img-viewer-prev';prev.textContent='‹';prev.onclick=()=>ivNav(-1);v.appendChild(prev);
  const next=document.createElement('button');next.className='img-viewer-next';next.textContent='›';next.onclick=()=>ivNav(1);v.appendChild(next);
  const dots=document.createElement('div');dots.className='img-viewer-dots';dots.id='iv-dots';v.appendChild(dots);
  // Swipe support
  let tx=0;
  v.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
  v.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)ivNav(dx<0?1:-1);},{passive:true});
  // Close on background tap
  v.addEventListener('click',e=>{if(e.target===v)closeImageViewer();});
  document.body.appendChild(v);
}
function openImageViewer(imgs,idx){
  buildImageViewer();
  ivImgs=Array.isArray(imgs)?imgs:[imgs];ivIdx=idx||0;
  ivShow();
  document.getElementById('img-viewer').classList.add('open');
}
function ivShow(){
  const img=document.getElementById('iv-img');if(img)img.src=ivImgs[ivIdx];
  const counter=document.getElementById('iv-counter');
  if(counter)counter.textContent=ivImgs.length>1?(ivIdx+1)+' / '+ivImgs.length:'';
  const prev=document.querySelector('.img-viewer-prev');const next=document.querySelector('.img-viewer-next');
  if(prev)prev.style.display=ivImgs.length>1?'flex':'none';
  if(next)next.style.display=ivImgs.length>1?'flex':'none';
  const dots=document.getElementById('iv-dots');if(dots){dots.innerHTML='';if(ivImgs.length>1)ivImgs.forEach((_,i)=>{const d=document.createElement('div');d.className='img-viewer-dot'+(i===ivIdx?' active':'');dots.appendChild(d);});}
}
function ivNav(dir){ivIdx=(ivIdx+dir+ivImgs.length)%ivImgs.length;ivShow();}
function closeImageViewer(){const v=document.getElementById('img-viewer');if(v)v.classList.remove('open');}

  const dots=document.getElementById('mg-dots');if(dots)dots.innerHTML='';
  // Build deck
  const pool=MG_EMOJIS.slice(0,cfg.pairs);const deck=[...pool,...pool].sort(()=>Math.random()-.5);
  const grid=document.getElementById('mg-grid');if(!grid)return;
  const gEl=document.getElementById('mgame-ov');
  const availH=gEl?gEl.clientHeight-220:500;
  const cfg2=MG_DIFFS[mg.diff];
  const rows=Math.ceil(cfg2.pairs*2/4);
  const cardSz=Math.floor(Math.min((window.innerWidth-36)/4,(availH-rows*6)/rows));
  grid.style.gridTemplateColumns='repeat(4,'+cardSz+'px)';
  grid.style.gridTemplateRows='repeat('+rows+','+cardSz+'px)';
  grid.innerHTML='';mg.cards=[];
  deck.forEach((emoji,i)=>{const card=document.createElement('div');card.className='mgame-card';card.dataset.emoji=emoji;card.style.width=cardSz+'px';card.style.height=cardSz+'px';card.innerHTML='<div class="mgame-inner"><div class="mgame-front"></div><div class="mgame-back" style="font-size:'+Math.floor(cardSz*0.45)+'px">'+emoji+'</div></div>';card.addEventListener('click',()=>mgFlip(card));grid.appendChild(card);mg.cards.push(card);});
  mg.timer=setInterval(()=>{if(!mg.active)return;mg.elapsed++;const tmE=document.getElementById('mg-timerEl');if(tmE)tmE.textContent=mg.elapsed+'s';const pct=Math.max(0,(cfg.time-mg.elapsed)/cfg.time*100);const tf2=document.getElementById('mg-tfill');if(tf2){tf2.style.width=pct+'%';tf2.style.background=pct>50?'linear-gradient(90deg,var(--acc2),var(--acc))':pct>25?'linear-gradient(90deg,#fbbf24,#f59e0b)':'linear-gradient(90deg,#ff4d6d,#dc2626)';}if(mg.elapsed>=cfg.time){mgStop();mgGameOver(false);}},1000);
}

function mgFlip(card){
  if(mg.lock||!mg.active)return;
  if(card.classList.contains('flipped')||card.classList.contains('matched'))return;
  if(mg.flipped.length>=2)return;
  card.classList.add('flipped');mg.flipped.push(card);
  if(mg.flipped.length===2){
    mg.moves++;const movEl=document.getElementById('mg-movesEl');if(movEl)movEl.textContent=mg.moves;mg.lock=true;
    const [a,b]=mg.flipped;
    if(a.dataset.emoji===b.dataset.emoji){
      setTimeout(()=>{a.classList.add('matched');b.classList.add('matched');a.classList.remove('flipped');b.classList.remove('flipped');mg.flipped=[];mg.lock=false;mg.matched++;const prEl=document.getElementById('mg-pairsEl');if(prEl)prEl.textContent=mg.matched+'/'+MG_DIFFS[mg.diff].pairs;if(mg.matched===MG_DIFFS[mg.diff].pairs){mgStop();setTimeout(()=>mgGameOver(true),400);}},500);
    } else {setTimeout(()=>{a.classList.remove('flipped');b.classList.remove('flipped');mg.flipped=[];mg.lock=false;},900);}
  }
}

async function mgGameOver(won){
  mg.active=false;const cfg=MG_DIFFS[mg.diff];
  let emoji,title,sub,xc=0;
  if(won){const p=mg.moves/cfg.pairs;const stars=p<=1.25?3:p<=1.75?2:1;xc=[10,15,20][mg.diff]*stars;emoji=stars===3?'🏆':stars===2?'🔥':'👍';title=stars===3?'¡Perfecto!':stars===2?'¡Muy bien!':'¡Completado!';sub=mg.moves+' movimientos en '+mg.elapsed+'s';}
  else{emoji='😅';title='¡Tiempo agotado!';sub='Encontraste '+mg.matched+' de '+cfg.pairs+' parejas';xc=mg.matched;}
  // Award XC
  if(xc>0&&S.cu)await addXC(S.cu.uid,xc);
  const res=document.getElementById('mgame-res');
  document.getElementById('mgr-emoji').textContent=emoji;
  document.getElementById('mgr-title').textContent=title;
  document.getElementById('mgr-sub').textContent=sub;
  document.getElementById('mgr-xc').textContent=xc>0?'+ '+xc+' XC':'';
  if(res)res.classList.add('open');
}

const TC_EMOJIS=['🟣','🌙','🌺','🔮','💜','🎯','🦋','🌊'];

let tc={state:'idle',round:0,times:[],startTime:0,timer:null,best:null};

function openTocaGame(){

function buildTocaUI(){

function tcUpdateDots(){
  const dots=document.getElementById('tc-dots');if(!dots)return;dots.innerHTML='';
  for(let i=0;i<5;i++){const d=document.createElement('div');d.className='mgame-dot'+(i<tc.times.length?' ok':i===tc.round?' cur':'');dots.appendChild(d);}
}

function tcShowIdle(){tc.state='idle';tc.round=0;tc.times=[];tcUpdateDots();const e=document.getElementById('toca-emoji');const m=document.getElementById('toca-msg');if(e)e.textContent='⚡';if(m){m.textContent='Toca para empezar';m.style.color='var(--acc2)';}}

function tcStartRound(){
  tc.state='waiting';tcUpdateDots();
  const distractors=TC_EMOJIS.filter(e=>e!==TC_TARGET);
  const shown=distractors[Math.floor(Math.random()*distractors.length)];
  const e=document.getElementById('toca-emoji');const m=document.getElementById('toca-msg');
  if(e)e.textContent=shown;if(m){m.textContent='Espera...';m.style.color='var(--mut)';}
  const delay=1000+Math.random()*3000;
  tc.timer=setTimeout(()=>{if(tc.state!=='waiting')return;tc.state='ready';if(e)e.textContent=TC_TARGET;if(m){m.textContent='TOCA!';m.style.color='#4ade80';}tc.startTime=Date.now();},delay);
}

function tcHandleTap(){
  if(tc.state==='idle'){tcStartRound();}
  else if(tc.state==='waiting'){clearTimeout(tc.timer);tc.state='tooearly';const e=document.getElementById('toca-emoji');const m=document.getElementById('toca-msg');if(e)e.textContent='❌';if(m){m.textContent='Demasiado pronto!';m.style.color='var(--red)';}setTimeout(()=>tcStartRound(),1200);}
  else if(tc.state==='ready'){
    const reaction=Date.now()-tc.startTime;tc.times.push(reaction);
    const lastEl=document.getElementById('tc-lastEl');if(lastEl)lastEl.textContent=reaction+'ms';
    tc.state='result';tc.round++;tcUpdateDots();
    const e=document.getElementById('toca-emoji');const m=document.getElementById('toca-msg');
    const color=reaction<250?'#4ade80':reaction<400?'#fbbf24':'#ff4d6d';
    const txt=reaction<250?'INCREIBLE!':reaction<350?'Rapido!':reaction<500?'Bien!':'Lento...';
    if(e)e.textContent='⚡';if(m){m.textContent=reaction+'ms — '+txt;m.style.color=color;}
    if(tc.round>=5)setTimeout(tcEndGame,1200);else setTimeout(tcStartRound,1200);
  }
}

async function tcEndGame(){
  tc.state='done';
  const avg=Math.round(tc.times.reduce((a,b)=>a+b,0)/tc.times.length);
  const best=Math.min(...tc.times);
  const avgEl=document.getElementById('tc-avgEl');if(avgEl)avgEl.textContent=avg+'ms';
  const isRecord=!tc.best||best<tc.best;if(isRecord)tc.best=best;
  const bestEl=document.getElementById('tc-bestEl');if(bestEl)bestEl.textContent=tc.best+'ms';
  let xc=avg<200?30:avg<300?20:avg<400?15:avg<500?10:5;
  if(isRecord)xc+=10;
  if(S.cu)await addXC(S.cu.uid,xc);
  const e=document.getElementById('toca-emoji');const m=document.getElementById('toca-msg');
  if(e)e.textContent=avg<300?'🏆':avg<400?'🔥':'👍';
  if(m){m.innerHTML=avg+'ms de media<br><span style="color:#fbbf24;font-size:14px;">+'+xc+' XC ganados'+(isRecord?' 🏆 Nuevo record!':'')+'</span><br><span style="font-size:13px;color:var(--mut);">Toca para jugar de nuevo</span>';m.style.color='var(--acc2)';}
  tc.state='idle';tc.round=0;tc.times=[];
}

function crRand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function crGenQ(){
  const cfg=CR_DIFFS[cr.diff];const op=cfg.ops[Math.floor(Math.random()*cfg.ops.length)];
  let a,b,ans;
  if(op==='+'){a=crRand(1,cfg.max);b=crRand(1,cfg.max);ans=a+b;}
  else if(op==='-'){a=crRand(2,cfg.max);b=crRand(1,a);ans=a-b;}
  else if(op==='x'){a=crRand(2,12);b=crRand(2,12);ans=a*b;}
  else{b=crRand(2,12);ans=crRand(2,12);a=b*ans;}
  return{op,a,b,ans};
}

function crStartGame(){
  clearInterval(cr.timer);cr.q=0;cr.score=0;cr.streak=0;cr.answered=false;
  const sEl=document.getElementById('cr-scoreEl');if(sEl)sEl.textContent='0';
  const qEl=document.getElementById('cr-qEl');if(qEl)qEl.textContent='1/10';
  const stEl=document.getElementById('cr-streak');if(stEl)stEl.textContent='';
  crNextQ();
}

function crNextQ(){
  if(cr.q>=10){crEndGame();return;}
  cr.answered=false;cr.current=crGenQ();
  const op=cr.current.op;const opNames={'+':'SUMA','-':'RESTA','x':'MULT','/ ':'DIV'};
  const opEl=document.getElementById('cr-op');if(opEl)opEl.textContent=opNames[op]||op;
  const eq=cr.current.a+' '+op+' '+cr.current.b+' = ?';
  const eqEl=document.getElementById('cr-eq');if(eqEl)eqEl.textContent=eq;
  const qEl=document.getElementById('cr-qEl');if(qEl)qEl.textContent=(cr.q+1)+'/10';
  const qcard=document.getElementById('cr-qcard');if(qcard)qcard.style.borderColor='var(--bor)';
  // Build answers
  const wrongs=new Set();while(wrongs.size<3){const d=crRand(1,10);wrongs.add(Math.random()<.5?cr.current.ans+d:Math.max(0,cr.current.ans-d));}
  const opts=[cr.current.ans,...wrongs].sort(()=>Math.random()-.5);
  const agrid=document.getElementById('cr-answers');if(!agrid)return;agrid.innerHTML='';
  opts.forEach(opt=>{const btn=document.createElement('button');btn.style.cssText='background:var(--surf);border:2px solid var(--bor);border-radius:14px;padding:14px 8px;font-size:22px;font-weight:900;cursor:pointer;font-family:Nunito,sans-serif;color:var(--txt);';btn.textContent=opt;btn.onclick=()=>crAnswer(opt,btn);agrid.appendChild(btn);});
  // Timer
  clearInterval(cr.timer);let timeLeft=CR_DIFFS[cr.diff].time;
  const tf=document.getElementById('cr-tfill');if(tf){tf.style.width='100%';tf.style.background='linear-gradient(90deg,var(--acc2),var(--acc))';}
  const tEl=document.getElementById('cr-timerEl');if(tEl)tEl.textContent=timeLeft+'s';
  cr.timer=setInterval(()=>{timeLeft-=.1;const pct=Math.max(0,timeLeft/CR_DIFFS[cr.diff].time*100);if(tf){tf.style.width=pct+'%';tf.style.background=pct>50?'linear-gradient(90deg,var(--acc2),var(--acc))':pct>25?'linear-gradient(90deg,#fbbf24,#f59e0b)':'linear-gradient(90deg,#ff4d6d,#dc2626)';}if(tEl)tEl.textContent=Math.ceil(timeLeft)+'s';if(timeLeft<=0){clearInterval(cr.timer);crAnswer(null,null);}},100);
}

function crAnswer(val,btn){
  if(cr.answered)return;cr.answered=true;clearInterval(cr.timer);
  const correct=val===cr.current.ans;
  const qcard=document.getElementById('cr-qcard');
  document.querySelectorAll('#cr-answers button').forEach(b=>{if(parseInt(b.textContent)===cr.current.ans)b.style.cssText=b.style.cssText+'background:#0a2e0a;border-color:#4ade80;color:#4ade80;';});
  if(correct){if(btn){btn.style.background='#0a2e0a';btn.style.borderColor='#4ade80';btn.style.color='#4ade80';}if(qcard)qcard.style.borderColor='#4ade80';cr.score++;cr.streak++;const sEl=document.getElementById('cr-scoreEl');if(sEl)sEl.textContent=cr.score;const stEl=document.getElementById('cr-streak');if(stEl)stEl.textContent=cr.streak>=3?'Racha '+cr.streak+'!':'';}
  else{if(btn){btn.style.background='#2a0a0a';btn.style.borderColor='#ff4d6d';btn.style.color='#ff4d6d';}if(qcard)qcard.style.borderColor='#ff4d6d';cr.streak=0;const stEl=document.getElementById('cr-streak');if(stEl)stEl.textContent='';}
  cr.q++;setTimeout(crNextQ,900);
}

}

function eqShowMenu(){eq.running=false;cancelAnimationFrame(eq.raf);eqStartGame();}

function eqStartGame(){
  eq.score=0;eq.lives=3;eq.level=1;eq.frame=0;eq.obstacles=[];eq.coins=[];eq.coinsCollected=0;eq.particles=[];eq.running=true;
  const canvas=document.getElementById('eq-canvas');if(!canvas)return;
  eq.player.x=canvas.width/2;eq.player.y=canvas.height-60;eq.player.targetX=canvas.width/2;
  document.getElementById('eq-scoreEl').textContent='0';
  document.getElementById('eq-livesEl').textContent='❤️❤️❤️';
  document.getElementById('eq-coinsEl').textContent='0';
  eqLoop();
}

function eqLoop(){
  if(!eq.running)return;
  eq.frame++;
  const canvas=document.getElementById('eq-canvas');if(!canvas)return;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#0e0b14';ctx.fillRect(0,0,canvas.width,canvas.height);
  // Stars
  eq.stars.forEach(s=>{s.y+=s.speed;if(s.y>canvas.height)s.y=0;ctx.fillStyle='#ffffff33';ctx.beginPath();ctx.arc(s.x%canvas.width,s.y,s.r,0,Math.PI*2);ctx.fill();});
  // Spawn
  const rate=Math.max(30,90-eq.diff*15-(eq.level-1)*8);
  if(eq.frame%rate===0){const ems=['☄️','🪨','💣','⚡','🔴'];const spd=2+eq.diff+Math.random()*1.5+(eq.level-1)*0.4;eq.obstacles.push({x:Math.random()*(canvas.width-30)+15,y:-30,emoji:ems[Math.floor(Math.random()*(2+eq.diff))],speed:spd,hit:false});}
  if(eq.frame%120===0)eq.coins.push({x:Math.random()*(canvas.width-30)+15,y:-20,speed:1.8+Math.random(),collected:false});
  if(eq.frame%300===0){eq.level++;eq.score+=50;}
  if(eq.frame%10===0){eq.score++;document.getElementById('eq-scoreEl').textContent=eq.score;}
  // Player
  eq.player.x+=(eq.player.targetX-eq.player.x)*0.18;
  eq.player.x=Math.max(20,Math.min(canvas.width-20,eq.player.x));
  ctx.font='18px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🔥',eq.player.x,eq.player.y+26);
  ctx.font='34px serif';ctx.fillText('🚀',eq.player.x,eq.player.y);ctx.shadowBlur=0;
  // Obstacles
  eq.obstacles.forEach((o,i)=>{o.y+=o.speed;ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.font='30px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.emoji,o.x,o.y);const dx=o.x-eq.player.x,dy=o.y-eq.player.y;if(!o.hit&&Math.sqrt(dx*dx+dy*dy)<26){o.hit=true;eq.lives--;document.getElementById('eq-livesEl').textContent='❤️'.repeat(eq.lives)+'🖤'.repeat(3-eq.lives);for(let j=0;j<6;j++){const a=Math.random()*Math.PI*2;eq.particles.push({x:o.x,y:o.y,dx:Math.cos(a)*3,dy:Math.sin(a)*3,life:1,emoji:'💥'});}if(eq.lives<=0){eq.running=false;eqEndGame();return;}}if(o.y>canvas.height+40)eq.obstacles.splice(i,1);});
  // Coins
  const coinImg=document.querySelector('img[src="xelfi-coin.png"]');
  eq.coins.forEach((coin,i)=>{coin.y+=coin.speed;if(coin.collected||coin.y>canvas.height+30){eq.coins.splice(i,1);return;}
    ctx.shadowColor='#fbbf24';ctx.shadowBlur=10;
    if(coinImg&&coinImg.complete){ctx.drawImage(coinImg,coin.x-14,coin.y-14,28,28);}
    else{ctx.font='24px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🪙',coin.x,coin.y);}
    ctx.shadowBlur=0;
    const dx=coin.x-eq.player.x,dy=coin.y-eq.player.y;
    if(Math.sqrt(dx*dx+dy*dy)<28){coin.collected=true;eq.coinsCollected++;document.getElementById('eq-coinsEl').textContent=eq.coinsCollected;for(let j=0;j<4;j++){const a=Math.random()*Math.PI*2;eq.particles.push({x:coin.x,y:coin.y,dx:Math.cos(a)*3,dy:Math.sin(a)*3,life:1,emoji:'✨'});}eq.coins.splice(i,1);}});
  // Particles
  eq.particles.forEach((p,i)=>{p.x+=p.dx;p.y+=p.dy;p.life-=0.05;if(p.life<=0){eq.particles.splice(i,1);return;}ctx.globalAlpha=p.life;ctx.font='14px serif';ctx.fillText(p.emoji,p.x,p.y);ctx.globalAlpha=1;});
  eq.raf=requestAnimationFrame(eqLoop);
}

async function eqEndGame(){
  const bonus=Math.floor(eq.score/10)*(eq.diff+1);
  const total=eq.coinsCollected+bonus;
  if(total>0&&S.cu)await addXC(S.cu.uid,total);
  const res=document.getElementById('eq-res');
  document.getElementById('eq-r-emoji').textContent=eq.score>200?'🏆':eq.score>100?'🔥':'😅';
  document.getElementById('eq-r-title').textContent=eq.score>200?'¡Increíble!':eq.score>100?'¡Bien hecho!':'¡Sigue practicando!';
  document.getElementById('eq-r-sub').textContent='Puntuación: '+eq.score+' · Nivel '+eq.level+'\n🪙 '+eq.coinsCollected+' monedas + '+bonus+' bonus';
  document.getElementById('eq-r-xc').textContent='+ '+total+' XC';
  if(res)res.classList.add('open');
}

function sqShowMenu(ov){document.getElementById('sq-start').style.display='block';}

function sqStartGame(){
  document.getElementById('sq-start').style.display='none';
  sq.sequence=[];sq.playerSeq=[];sq.round=0;sqNextRound();
}

function sqNextRound(){
  sq.round++;sq.playerSeq=[];
  document.getElementById('sq-roundEl').textContent=sq.round;
  document.getElementById('sq-status').textContent='Memoriza...';
  document.getElementById('sq-status').style.color='var(--acc2)';
  sqUpdateDots();sq.sequence.push(Math.floor(Math.random()*4));
  sq.playing=true;sqSetButtons(false);
  setTimeout(()=>sqPlay(0),600);
}

function sqPlay(i){
  if(i>=sq.sequence.length){sq.playing=false;sqSetButtons(true);document.getElementById('sq-status').textContent='¡Tu turno!';document.getElementById('sq-status').style.color='var(--grn)';return;}
  setTimeout(()=>{sqLight(sq.sequence[i],true);setTimeout(()=>{sqLight(sq.sequence[i],false);setTimeout(()=>sqPlay(i+1),200);},600);},100);
}

function sqLight(c,on){const btn=document.getElementById('sq-btn-'+c);if(btn)btn.style.filter=on?'brightness(1.4)':'brightness(.6)';if(btn)btn.style.transform=on?'scale(1.06)':'scale(1)';}

function sqSetButtons(en){for(let i=0;i<4;i++){const b=document.getElementById('sq-btn-'+i);if(b){b.style.pointerEvents=en?'auto':'none';if(!en){b.style.filter='brightness(.6)';b.style.transform='scale(1)';}}}}

function sqTap(c){
  if(sq.playing)return;
  sqLight(c,true);setTimeout(()=>sqLight(c,false),200);
  sq.playerSeq.push(c);sqUpdateDots();
  const idx=sq.playerSeq.length-1;
  if(sq.playerSeq[idx]!==sq.sequence[idx]){
    document.getElementById('sq-status').textContent='❌ Incorrecto!';document.getElementById('sq-status').style.color='var(--red)';
    sqSetButtons(false);setTimeout(()=>sqEndGame(),900);return;
  }
  if(sq.playerSeq.length===sq.sequence.length){document.getElementById('sq-status').textContent='✅ ¡Correcto!';document.getElementById('sq-status').style.color='var(--grn)';sqSetButtons(false);setTimeout(sqNextRound,900);}
}

function sqUpdateDots(){
  const dots=document.getElementById('sq-dots');if(!dots)return;dots.innerHTML='';
  sq.sequence.forEach((_,i)=>{const d=document.createElement('div');d.className='mgame-dot'+(i<sq.playerSeq.length?' ok':i===sq.playerSeq.length?' cur':'');dots.appendChild(d);});
}

async function sqEndGame(){
  const r=sq.round-1;if(r>sq.best)sq.best=r;
  document.getElementById('sq-bestEl').textContent=sq.best;
  const xc=r*3;if(xc>0&&S.cu)await addXC(S.cu.uid,xc);
  document.getElementById('sq-status').textContent=(r>=10?'🏆 ':r>=5?'🔥 ':'')+'Ronda '+r+' · +'+xc+' XC';
  document.getElementById('sq-status').style.color='#fbbf24';
  document.getElementById('sq-start').style.display='block';
  document.getElementById('sq-start').textContent='🔄 Jugar otra vez';
  sqSetButtons(false);
}

      const next=document.createElement('button');next.style.cssText='position:absolute;right:8px;top:50%;transform:translateY(-50%);background:#000a;border:none;color:#fff;font-size:22px;border-radius:50%;width:36px;height:36px;cursor:pointer;';next.textContent='›';
      const dots=document.createElement('div');dots.style.cssText='position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;';
      allImgs.forEach((_,i)=>{const d=document.createElement('div');d.style.cssText='width:6px;height:6px;border-radius:50%;background:'+(i===0?'#fff':'#ffffff55')+';';dots.appendChild(d);});
      const updateCar=()=>{carImg.src=allImgs[carIdx];dots.children[carIdx]&&Array.from(dots.children).forEach((d,i)=>d.style.background=i===carIdx?'#fff':'#ffffff55');};
      prev.onclick=e=>{e.stopPropagation();carIdx=(carIdx-1+allImgs.length)%allImgs.length;updateCar();};
      next.onclick=e=>{e.stopPropagation();carIdx=(carIdx+1)%allImgs.length;updateCar();};
      let tx=0;carouselWrap.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
      carouselWrap.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40){carIdx=(carIdx+(dx<0?1:-1)+allImgs.length)%allImgs.length;updateCar();}},{passive:true});
      carouselWrap.appendChild(prev);carouselWrap.appendChild(next);carouselWrap.appendChild(dots);
    }

  } else {
    const cover=document.createElement('div');cover.className='ad-cover-placeholder';cover.style.cssText+='background:'+ad.color+'22;';cover.textContent=ad.emoji||'🏪';panel.appendChild(cover);
  }
  // Content
  const content=document.createElement('div');content.className='ad-detail-content';content.style.paddingTop='16px';
  const name=document.createElement('div');name.className='ad-detail-name';name.textContent=ad.title||ad.name||'';content.appendChild(name);
  const badge=document.createElement('div');badge.className='store-ad-badge';badge.style.marginBottom='12px';badge.textContent=ad.tag||ad.category||'Anunciante';content.appendChild(badge);
  // Short description
  if(ad.content){const shortDesc=document.createElement('div');shortDesc.className='ad-detail-desc';shortDesc.textContent=ad.content;content.appendChild(shortDesc);}
  // Long description
  if(ad.description){const longDesc=document.createElement('div');longDesc.className='ad-detail-desc';longDesc.style.borderTop='1px solid var(--bor)';longDesc.style.paddingTop='12px';longDesc.textContent=ad.description;content.appendChild(longDesc);}
  // Contact buttons
  if(ad.userId&&ad.userId!==S.cu?.uid){
    const chatBtn=document.createElement('button');chatBtn.className='ad-contact-btn';chatBtn.style.background='linear-gradient(135deg,#c060ff,#9b35e8)';chatBtn.textContent='💬 Enviar mensaje al anunciante';

    content.appendChild(chatBtn);
  }
  panel.appendChild(content);
  document.body.appendChild(panel);
  setTimeout(()=>panel.classList.add('open'),10);
}

let miniChatUnsub=null;
function openMiniChat(toUserId,toName){
  const chatId=[S.cu.uid,toUserId].sort().join('_');
  const existing=document.getElementById('mini-chat-panel');if(existing)existing.remove();
  if(miniChatUnsub){miniChatUnsub();miniChatUnsub=null;}
  const panel=document.createElement('div');panel.className='mini-chat-panel';panel.id='mini-chat-panel';
  const toUser=S.users[toUserId]||{name:toName||'Anunciante',avatar:'star'};
  // Header
  const hdr=document.createElement('div');hdr.className='mini-chat-header';
  const av=document.createElement('div');av.className='av';av.style.cssText='width:36px;height:36px;flex-shrink:0;font-size:16px;';
  if(toUser.photo){const img=document.createElement('img');img.src=toUser.photo;img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:50%;';av.appendChild(img);}else av.textContent=em(toUser.avatar||'star');
  const info=document.createElement('div');info.style.flex='1';
  const nm=document.createElement('div');nm.style.cssText='font-weight:800;font-size:14px;font-family:Nunito,sans-serif;';nm.textContent=toUser.name||toName||'Anunciante';
  const sub=document.createElement('div');sub.style.cssText='font-size:11px;color:var(--mut);';sub.textContent='Chat directo';
  info.appendChild(nm);info.appendChild(sub);
  const cl=document.createElement('button');cl.style.cssText='background:transparent;border:none;color:var(--mut);font-size:20px;cursor:pointer;';cl.textContent='✕';
  cl.onclick=()=>{panel.remove();if(miniChatUnsub){miniChatUnsub();miniChatUnsub=null;}};
  hdr.appendChild(av);hdr.appendChild(info);hdr.appendChild(cl);panel.appendChild(hdr);
  // Messages
  const msgs=document.createElement('div');msgs.className='mini-chat-msgs';
  panel.appendChild(msgs);
  // Input
  const inputRow=document.createElement('div');inputRow.className='mini-chat-input-row';
  const inp=document.createElement('input');inp.className='mini-chat-inp';inp.placeholder='Escribe un mensaje...';inp.type='text';
  const sendBtn=document.createElement('button');sendBtn.className='mini-chat-send';sendBtn.textContent='➤';
  const sendMsg=async()=>{
    const txt=inp.value.trim();if(!txt)return;inp.value='';
    try{
      await addDoc(collection(db,'mini_chats',chatId,'messages'),{from:S.cu.uid,text:txt,createdAt:serverTimestamp()});
      await setDoc(doc(db,'mini_chats',chatId),{participants:[S.cu.uid,toUserId],lastMsg:txt,updatedAt:serverTimestamp()},{merge:true});
      await addNotif(toUserId,'message',chatId);
    }catch(e){console.error('chat error',e);}
  };
  sendBtn.onclick=sendMsg;inp.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});
  inputRow.appendChild(inp);inputRow.appendChild(sendBtn);panel.appendChild(inputRow);
  document.body.appendChild(panel);
  setTimeout(()=>{panel.classList.add('open');inp.focus();},10);
  // Listen messages
  miniChatUnsub=onSnapshot(query(collection(db,'mini_chats',chatId,'messages'),orderBy('createdAt','asc')),sn=>{
    msgs.innerHTML='';
    sn.forEach(d=>{const m=d.data();const bubble=document.createElement('div');bubble.className='mini-chat-msg '+(m.from===S.cu.uid?'mine':'theirs');bubble.textContent=m.text;msgs.appendChild(bubble);});
    msgs.scrollTop=msgs.scrollHeight;
  });
}

function buildChannelPost(post,ch){
  const card=document.createElement('div');card.className='channel-post';
  // Date
  if(post.createdAt){const d=post.createdAt.toDate?.();if(d){const dateEl=document.createElement('div');dateEl.style.cssText='font-size:11px;color:var(--mut);margin-bottom:8px;';dateEl.textContent=d.toLocaleDateString('es-ES',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});card.appendChild(dateEl);}}
  // Text
  if(post.text){const txt=document.createElement('div');txt.className='channel-post-text';txt.textContent=post.text;card.appendChild(txt);}
  // Image
  if(post.image){const img=document.createElement('img');img.src=post.image;img.style.cssText='width:calc(100% + 28px);margin-left:-14px;margin-right:-14px;max-height:360px;object-fit:cover;display:block;margin-bottom:10px;';card.appendChild(img);}
  // Reactions
  const reactRow=document.createElement('div');reactRow.className='channel-react-row';
  const REACTS=['👍','❤️','😂','😮','🔥'];
  REACTS.forEach(e=>{
    const btn=document.createElement('button');btn.className='channel-react-btn';
    const myReact=post.reactions?.[e]?.includes(S.cu?.uid);
    if(myReact)btn.classList.add('active');
    const cnt=(post.reactions?.[e]?.length||0);
    btn.textContent=e+(cnt>0?' '+cnt:'');
    btn.onclick=async()=>{
      const upd={};
      if(myReact)upd['reactions.'+e]=arrayRemove(S.cu.uid);
      else upd['reactions.'+e]=arrayUnion(S.cu.uid);
      await updateDoc(doc(db,'channels',ch.id,'posts',post.id),upd);
      btn.classList.toggle('active',!myReact);
      const newCnt=cnt+(myReact?-1:1);btn.textContent=e+(newCnt>0?' '+newCnt:'');
    };
    reactRow.appendChild(btn);
  });
  // Comments count
  const cmtBtn=document.createElement('button');cmtBtn.className='channel-react-btn';cmtBtn.textContent='💬 '+(post.commentCount||0);
  cmtBtn.onclick=()=>openChannelComments(post,ch,card);
  reactRow.appendChild(cmtBtn);
  card.appendChild(reactRow);
  return card;
}

function openReport(type, targetId, targetUserId, preview){
  let ov=document.getElementById('report-ov');if(ov)ov.remove();

  const cl=document.createElement('button');cl.style.cssText='background:transparent;border:none;color:var(--mut);font-size:20px;cursor:pointer;';cl.textContent='✕';cl.onclick=()=>ov.remove();title.appendChild(cl);box.appendChild(title);

  });

  const detLbl=document.createElement('label');detLbl.className='ad-form-label';detLbl.style.marginTop='12px';detLbl.textContent='Detalles adicionales (opcional)';box.appendChild(detLbl);

    if(!selReason){alert('Selecciona un motivo.');return;}
    sendBtn.disabled=true;sendBtn.textContent='Enviando...';
    try{
      await addDoc(collection(db,'reports'),{
        type,targetId,targetUserId,
        reason:selReason,details:ta.value.trim(),

        status:'pending',createdAt:serverTimestamp(),
        preview:preview?preview.slice(0,200):''
      });
      ov.remove();

    }catch(e){alert('Error: '+e.message);sendBtn.disabled=false;sendBtn.textContent='Enviar denuncia';}
  };
  box.appendChild(sendBtn);
  ov.appendChild(box);ov.onclick=e=>{if(e.target===ov)ov.remove();};document.body.appendChild(ov);
}

// HEALTH SYSTEM
function getHealthInfo(infractions){
  const n=infractions||0;
  if(n===0)return{emoji:'🟢',label:'Saludable',color:'#22c55e',pct:100,desc:'Tu perfil está en perfecto estado.'};
  if(n<=2)return{emoji:'🟡',label:'Aviso',color:'#fbbf24',pct:75,desc:'Tienes '+n+' infracción'+(n>1?'es':'')+'. Cuida el contenido que publicas.'};
  if(n<=4)return{emoji:'🟠',label:'En riesgo',color:'#f97316',pct:40,desc:'Atención: '+n+' infracciones. Una más puede suponer suspensión temporal.'};
  if(n<=7)return{emoji:'🔴',label:'Peligro',color:'#ef4444',pct:15,desc:'Perfil en peligro. '+n+' infracciones acumuladas.'};
  return{emoji:'⛔',label:'Suspendido',color:'#7f1d1d',pct:5,desc:'Perfil suspendido por acumulación de infracciones.'};
}

function buildHealthBar(infractions){
  const info=getHealthInfo(infractions);

  const top=document.createElement('div');top.style.cssText='display:flex;justify-content:space-between;align-items:center;';
  const lbl=document.createElement('div');lbl.className='health-label';lbl.textContent=info.emoji+' Salud del perfil: '+info.label;
  const pts=document.createElement('div');pts.style.cssText='font-size:11px;color:var(--mut);';pts.textContent=(infractions||0)+' infracciones';
  top.appendChild(lbl);top.appendChild(pts);wrap.appendChild(top);
  const track=document.createElement('div');track.className='health-bar-track';
  const fill=document.createElement('div');fill.className='health-bar-fill';fill.style.cssText='width:'+info.pct+'%;background:'+info.color+';';
  track.appendChild(fill);wrap.appendChild(track);
  const sub=document.createElement('div');sub.className='health-sub';sub.textContent=info.desc;wrap.appendChild(sub);
  if(infractions>0){const rec=document.createElement('div');rec.style.cssText='font-size:10px;color:var(--mut);margin-top:4px;';rec.textContent='⏱️ Los puntos se recuperan con el tiempo siendo un buen miembro de la comunidad';wrap.appendChild(rec);}
  return wrap;
}

async function addInfraction(userId, reason){
  try{
    const userRef=doc(db,'users',userId);
    await updateDoc(userRef,{infractions:increment(1),lastInfractionAt:serverTimestamp()});
    // Send warning notification
    await addDoc(collection(db,'notifications'),{
      toUserId:userId,type:'warning',
      fromUserId:'system',fromName:'Xelfi',
      message:'Tu contenido fue eliminado por: '+reason+'. Acumulación de infracciones puede resultar en suspensión.',
      read:false,createdAt:serverTimestamp()
    });
  }catch(e){console.error('infraction error',e);}
}
