<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xelfi</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0b14;--surf:#16121f;--card:#1c1729;--bor:#2e2540;--acc:#9b35e8;--acc2:#c060ff;--txt:#ede8f5;--mut:#7a6a9a;--red:#ff4d6d;--grn:#4ade80;--yel:#fbbf24;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:'Nunito Sans',sans-serif;min-height:100vh;}
.logo{display:inline-flex;align-items:baseline;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:900;user-select:none;}
.logo-x{font-size:1.8em;background:linear-gradient(160deg,#cc44ff,#9b35e8,#6a10c8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-e{font-size:1.2em;background:linear-gradient(135deg,#cc44ff,#9b35e8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
nav{position:sticky;top:0;z-index:200;background:#0e0b14ee;border-bottom:1px solid var(--bor);display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:54px;backdrop-filter:blur(12px);}
.nav-r{display:flex;gap:6px;align-items:center;}
.nbtn{background:transparent;color:var(--mut);border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:700;font-size:13px;font-family:'Nunito',sans-serif;transition:all .15s;}
.nbtn:hover{background:#9b35e810;color:var(--acc2);}
.main{max-width:600px;margin:0 auto;padding:18px 14px;}
.card{background:var(--card);border:1px solid var(--bor);border-radius:16px;padding:16px;margin-bottom:12px;animation:fu .2s ease;}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.btn{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border:none;border-radius:9px;padding:10px 18px;cursor:pointer;font-weight:800;font-size:14px;font-family:'Nunito',sans-serif;transition:all .15s;box-shadow:0 4px 14px #9b35e840;}
.btn:hover{transform:translateY(-1px);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-o{background:transparent;color:var(--mut);border:1px solid var(--bor);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:13px;font-family:'Nunito',sans-serif;transition:all .15s;}
.btn-o:hover{border-color:var(--acc);color:var(--acc2);}
input,textarea,select{background:var(--surf);border:1.5px solid var(--bor);border-radius:10px;padding:10px 13px;color:var(--txt);font-size:14px;width:100%;outline:none;font-family:'Nunito Sans',sans-serif;transition:border .15s;}
input:focus,textarea:focus,select:focus{border-color:var(--acc);}
textarea{resize:none;line-height:1.6;}
select option{background:var(--card);}
.av{border-radius:50%;background:linear-gradient(135deg,#9b35e830,#c060ff30);border:2px solid #9b35e855;display:flex;align-items:center;justify-content:center;flex-shrink:0;user-select:none;}
.av img{border-radius:50%;object-fit:cover;border:2px solid #9b35e855;}
.tag{border-radius:6px;padding:2px 8px;font-size:11px;font-weight:800;font-family:'Nunito',sans-serif;}
.tag-pub{background:#4ade8018;color:var(--grn);}
.tag-fri{background:#fbbf2418;color:var(--yel);}
.tag-prv{background:#ff4d6d18;color:var(--red);}
.tag-def{background:#9b35e818;color:var(--acc2);}
.fl{font-size:11px;color:var(--mut);margin-bottom:4px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-family:'Nunito',sans-serif;}
.av-pick{display:flex;gap:7px;flex-wrap:wrap;}
.av-btn{font-size:19px;background:transparent;border:2px solid var(--bor);border-radius:8px;padding:3px 6px;cursor:pointer;transition:all .15s;}
.av-btn.sel{background:#9b35e820;border-color:var(--acc);}
.lnk{color:var(--acc2);cursor:pointer;font-weight:700;}
.lnk:hover{text-decoration:underline;}
.err{color:var(--red);font-size:13px;padding:8px 12px;background:#ff4d6d15;border-radius:8px;border:1px solid #ff4d6d33;}
.spin{width:16px;height:16px;border:2px solid #fff4;border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;display:inline-block;vertical-align:middle;margin-right:5px;}
@keyframes sp{to{transform:rotate(360deg)}}
.ph{display:flex;gap:11px;margin-bottom:11px;}
.ph-info{flex:1;}
.ph-name{font-weight:800;font-size:14px;font-family:'Nunito',sans-serif;transition:color .15s;}
.ph-meta{font-size:12px;color:var(--mut);}
.act-row{display:flex;gap:7px;padding-top:10px;border-top:1px solid var(--bor);}
.ab{display:flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--bor);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:700;color:var(--mut);font-family:'Nunito',sans-serif;transition:all .15s;}
.ab:hover{border-color:var(--acc);color:var(--acc2);}
.ab.liked{background:#ff4d6d15;border-color:#ff4d6d55;color:var(--red);}
.ab.copen{background:#9b35e815;border-color:#9b35e855;color:var(--acc2);}
.ab.reposted{background:#4ade8015;border-color:#4ade8055;color:var(--grn);}
.cmts{margin-top:11px;}
.ci{display:flex;gap:8px;margin-bottom:9px;}
.cb{background:var(--surf);border-radius:10px;padding:8px 11px;flex:1;border:1px solid var(--bor);}
.ca{font-weight:800;font-size:13px;font-family:'Nunito',sans-serif;cursor:pointer;}
.ca:hover{color:var(--acc2);}
.ct2{color:var(--mut);font-size:11px;margin-left:5px;}
.ctxt{font-size:14px;line-height:1.5;margin-top:3px;}
.ci-row{display:flex;gap:8px;margin-top:9px;align-items:center;position:relative;}
.ci-row input{flex:1;padding:8px 12px;font-size:13px;}
.sbtn{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px;}
.mention-box{position:absolute;bottom:100%;left:40px;background:var(--card);border:1px solid var(--bor);border-radius:10px;z-index:300;min-width:180px;display:none;box-shadow:0 4px 16px #00000088;max-height:200px;overflow-y:auto;}
.mention-opt{padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;}
.mention-opt:hover{background:var(--surf);}
.sug-row{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;}
.sug{background:var(--surf);border:1px solid var(--bor);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:center;min-width:90px;flex-shrink:0;transition:all .15s;}
.sug:hover{border-color:var(--acc);transform:translateY(-2px);}
.sl{font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;font-family:'Nunito',sans-serif;}
.empty{text-align:center;color:var(--mut);padding:50px 20px;font-size:15px;}
.load{text-align:center;color:var(--mut);padding:30px;}
.bell-w{position:relative;display:inline-flex;}
.nbadge{position:absolute;top:1px;right:1px;background:var(--red);color:#fff;border-radius:50%;width:15px;height:15px;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;pointer-events:none;font-family:'Nunito',sans-serif;}
.npanel{position:fixed;top:54px;right:8px;width:300px;max-width:95vw;background:var(--card);border:1px solid var(--bor);border-radius:14px;z-index:9999;box-shadow:0 8px 32px #00000099;max-height:420px;overflow-y:auto;}
.npanel-hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bor);}
.ni{display:flex;gap:9px;padding:10px 14px;border-bottom:1px solid #2e254033;cursor:pointer;align-items:flex-start;}
.ni.unread{background:#9b35e808;}
.ndot{width:7px;height:7px;border-radius:50%;background:var(--acc2);flex-shrink:0;margin-top:4px;}
.prof-av-w{position:relative;flex-shrink:0;cursor:pointer;}
.prof-av-w:hover .av-ov{opacity:1;}
.av-ov{position:absolute;inset:0;border-radius:50%;background:#00000088;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;font-size:16px;color:#fff;}
.pstats{display:flex;gap:16px;margin-top:8px;}
.pstat{font-size:13px;}
.pstat b{font-family:'Nunito',sans-serif;font-weight:900;}
.pstat span{color:var(--mut);}
.priv-sel{padding:6px 10px;font-size:12px;width:auto;border-radius:8px;}
.lock-msg{background:#fbbf2415;border:1px solid #fbbf2433;border-radius:10px;padding:12px;text-align:center;color:var(--yel);font-size:14px;margin-bottom:12px;}
.repost-banner{font-size:12px;color:var(--mut);margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.chat-list-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bor);cursor:pointer;align-items:center;transition:background .15s;}
.chat-list-item:hover{background:var(--surf);}
.chat-list-item.unread{background:#9b35e808;}
.chat-unread-dot{width:9px;height:9px;border-radius:50%;background:var(--acc2);flex-shrink:0;}
.chat-preview{font-size:13px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.chat-name{font-weight:800;font-size:14px;font-family:Nunito,sans-serif;}
.msg-wrap{display:flex;flex-direction:column;gap:6px;padding:12px 0;}
.msg-row{display:flex;gap:8px;align-items:flex-end;}
.msg-row.mine{flex-direction:row-reverse;}
.msg-bubble{max-width:72%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.5;word-break:break-word;}
.msg-bubble.theirs{background:var(--surf);border:1px solid var(--bor);border-bottom-left-radius:4px;}
.msg-bubble.mine{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border-bottom-right-radius:4px;}
.msg-time{font-size:10px;color:var(--mut);margin-top:2px;text-align:center;padding:0 4px;}
.chat-input-row{display:flex;gap:8px;align-items:center;padding:12px 0 0;border-top:1px solid var(--bor);margin-top:8px;}
.chat-input-row input{flex:1;}
.comp-wrap{position:relative;flex:1;}
.comp-mbox{position:absolute;bottom:100%;left:0;background:var(--card);border:1px solid var(--bor);border-radius:10px;z-index:300;min-width:180px;display:none;box-shadow:0 4px 16px #00000088;max-height:200px;overflow-y:auto;}
</style>
</head>
<body>
<div id="app"><div class="load" style="padding:80px;font-size:16px">Cargando Xelfi...</div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,collection,addDoc,getDocs,doc,getDoc,setDoc,updateDoc,deleteDoc,query,orderBy,onSnapshot,arrayUnion,arrayRemove,increment,serverTimestamp,deleteField}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const FB={apiKey:"AIzaSyA695OTVjRtgTuw3-cqjPTyZ9O02eI_n5k",authDomain:"xelfi-7e2bf.firebaseapp.com",projectId:"xelfi-7e2bf",storageBucket:"xelfi-7e2bf.firebasestorage.app",messagingSenderId:"261957011071",appId:"1:261957011071:web:795d4bcfd0902bc157214a"};
const fbApp=initializeApp(FB);
const auth=getAuth(fbApp);
const db=getFirestore(fbApp);

const AVK=['star','moon','scope','flower','rocket','wave','fly','guitar','lab','cherry','bolt','target','fox','fish','palm'];
const AVE={star:'&#11088;',moon:'&#127769;',scope:'&#128301;',flower:'&#127802;',rocket:'&#128640;',wave:'&#127754;',fly:'&#129419;',guitar:'&#127928;',lab:'&#128300;',cherry:'&#127800;',bolt:'&#9889;',target:'&#127919;',fox:'&#129418;',fish:'&#128044;',palm:'&#127796;'};
const em=k=>AVE[k]||k||'&#11088;';

const S={view:'login',cu:null,me:null,pid:null,np:'',ni2:'',npv:'public',rf:{n:'',h:'',b:'',av:'star',e:'',p:''},lf:{e:'',p:''},le:'',re:'',oc:{},ct:{},sav:'star',posts:[],users:{},notifs:[],unread:0,friends:[],chatWith:null,msgText:'',msgUnread:0};

const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const logoHTML=()=>'<span class="logo"><span class="logo-x">X</span><span class="logo-e">elfi</span></span>';

function avEl(p,sz=40){
  if(p&&(p.photo||p.photoURL)){
    const img=document.createElement('img');
    img.src=p.photo||p.photoURL;img.style.cssText='width:'+sz+'px;height:'+sz+'px;border-radius:50%;object-fit:cover;border:2px solid #9b35e855;flex-shrink:0;';
    return img;
  }
  const d=document.createElement('div');d.className='av';
  d.style.cssText='width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*.42)+'px;';
  d.innerHTML=em(p&&p.avatar);return d;
}

function makeNav(r){
  const nav=document.createElement('nav');
  const lw=document.createElement('div');lw.innerHTML=logoHTML();
  lw.querySelector('.logo').onclick=()=>{if(S.cu){S.view='feed';render();}};
  nav.appendChild(lw);nav.appendChild(r);return nav;
}

function timeAgo(ts){
  if(!ts)return'ahora mismo';
  const d=ts.toDate?ts.toDate():new Date(ts);
  const s=Math.floor((Date.now()-d)/1000);
  if(s<60)return'ahora mismo';
  if(s<3600)return'hace '+Math.floor(s/60)+' min';
  if(s<86400)return'hace '+Math.floor(s/3600)+' h';
  return'hace '+Math.floor(s/86400)+' dias';
}

async function loadU(uid){
  if(S.users[uid])return S.users[uid];
  const sn=await getDoc(doc(db,'users',uid));
  if(sn.exists()){S.users[uid]=sn.data();return S.users[uid];}
  return null;
}

async function loadFriends(){
  if(!S.cu)return;
  const sn=await getDocs(collection(db,'friendships'));
  S.friends=[];
  sn.forEach(d=>{
    const f=d.data();
    if(f.status==='accepted'){
      if(f.from===S.cu.uid)S.friends.push(f.to);
      else if(f.to===S.cu.uid)S.friends.push(f.from);
    }
  });
}

const isFriend=uid=>S.friends.includes(uid);

function canSee(post){
  if(!post.privacy||post.privacy==='public')return true;
  if(post.userId===S.cu.uid)return true;
  if(post.privacy==='friends')return isFriend(post.userId);
  return false;
}

function formatText(txt){
  return esc(txt).replace(/@([a-zA-Z0-9_]+)/g,'<span style="color:#c060ff;font-weight:700">@$1</span>');
}

// NOTIFICATIONS
let unsubN=null;
function listenNotifs(uid){
  if(unsubN)unsubN();
  unsubN=onSnapshot(query(collection(db,'notifications'),orderBy('createdAt','desc')),sn=>{
    S.notifs=[];
    sn.forEach(d=>{const n={id:d.id,...d.data()};if(n.toUserId===uid)S.notifs.push(n);});
    S.unread=S.notifs.filter(n=>!n.read).length;
    const b=document.getElementById('nbadge');
    if(b){b.textContent=S.unread;b.style.display=S.unread>0?'flex':'none';}
  });
}

async function addNotif(toUid,type,postId,extra){
  if(!toUid||toUid===S.cu.uid)return;
  await addDoc(collection(db,'notifications'),{toUserId:toUid,type,fromUserId:S.cu.uid,fromName:S.me.name,fromAvatar:S.me.avatar||'star',postId:postId||null,extra:extra||null,read:false,createdAt:serverTimestamp()});
}

async function markRead(){
  for(const n of S.notifs.filter(x=>!x.read))
    await updateDoc(doc(db,'notifications',n.id),{read:true});
}

function notifTxt(n){
  if(n.type==='like')return n.fromName+' le dio like a tu post';
  if(n.type==='comment')return n.fromName+' comento tu post';
  if(n.type==='freq')return n.fromName+' quiere ser tu amigo';
  if(n.type==='facc')return n.fromName+' acepto tu solicitud';
  if(n.type==='repost')return n.fromName+' republico tu post';
  if(n.type==='message')return n.fromName+' te envio un mensaje';
  return'Nueva notificacion';
}

function renderNotifPanel(){
  const panel=document.createElement('div');panel.id='npanel';panel.className='npanel';
  const hdr=document.createElement('div');hdr.className='npanel-hdr';
  const title=document.createElement('span');title.style.cssText='font-weight:800;font-family:Nunito,sans-serif;font-size:15px';title.textContent='Notificaciones';
  const markBtn=document.createElement('button');markBtn.style.cssText='background:transparent;border:none;color:var(--acc2);font-size:12px;font-weight:700;cursor:pointer;';markBtn.textContent='Todo leido';
  markBtn.onclick=()=>markRead();
  hdr.appendChild(title);hdr.appendChild(markBtn);panel.appendChild(hdr);
  if(!S.notifs.length){
    const e=document.createElement('div');e.style.cssText='text-align:center;color:var(--mut);padding:24px;font-size:14px;';e.textContent='Sin notificaciones';panel.appendChild(e);
  } else {
    S.notifs.slice(0,20).forEach(n=>{
      const item=document.createElement('div');item.className='ni'+(n.read?'':' unread');
      const emS=document.createElement('span');emS.style.cssText='font-size:19px;flex-shrink:0';emS.innerHTML=em(n.fromAvatar);
      const cont=document.createElement('div');cont.style.flex='1';
      const txt=document.createElement('div');txt.style.cssText='font-size:13px;line-height:1.4';txt.textContent=notifTxt(n);
      const time=document.createElement('div');time.style.cssText='font-size:11px;color:var(--mut);margin-top:2px';time.textContent=timeAgo(n.createdAt);
      cont.appendChild(txt);cont.appendChild(time);
      if(n.type==='freq'&&n.extra){
        const br=document.createElement('div');br.style.cssText='display:flex;gap:6px;margin-top:6px';
        const ab=document.createElement('button');ab.style.cssText='background:var(--acc);color:#fff;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:700;';ab.textContent='Aceptar';
        ab.onclick=async e=>{
          e.stopPropagation();
          await updateDoc(doc(db,'friendships',n.extra),{status:'accepted'});
          await updateDoc(doc(db,'notifications',n.id),{read:true});
          await addNotif(n.fromUserId,'facc',null,null);
          await loadFriends();
          const p=document.getElementById('npanel');if(p)p.remove();
          render();
        };
        const rb=document.createElement('button');rb.style.cssText='background:#ff4d6d22;color:var(--red);border:1px solid #ff4d6d44;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:700;';rb.textContent='Rechazar';
        rb.onclick=async e=>{
          e.stopPropagation();
          await deleteDoc(doc(db,'friendships',n.extra));
          await updateDoc(doc(db,'notifications',n.id),{read:true});
          const p=document.getElementById('npanel');if(p)p.remove();
        };
        br.appendChild(ab);br.appendChild(rb);cont.appendChild(br);
      } else {
        item.onclick=()=>{
          markRead();
          const p=document.getElementById('npanel');if(p)p.remove();
          if(n.postId){S.view='feed';render();setTimeout(()=>{const el=document.getElementById('p-'+n.postId);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},700);}
        };
      }
      item.appendChild(emS);item.appendChild(cont);
      if(!n.read){const dot=document.createElement('div');dot.className='ndot';item.appendChild(dot);}
      panel.appendChild(item);
    });
  }
  return panel;
}

async function sendFriendReq(toUid){
  const sn=await getDocs(collection(db,'friendships'));
  let exists=false;
  sn.forEach(d=>{const f=d.data();if((f.from===S.cu.uid&&f.to===toUid)||(f.from===toUid&&f.to===S.cu.uid))exists=true;});
  if(exists)return false;
  const ref=await addDoc(collection(db,'friendships'),{from:S.cu.uid,to:toUid,status:'pending',createdAt:serverTimestamp()});
  await addNotif(toUid,'freq',null,ref.id);
  return true;
}

// CHAT FUNCTIONS
function getChatId(uid1, uid2){
  return [uid1,uid2].sort().join('_');
}

async function listenMsgUnread(uid){
  // Listen for unread messages
  onSnapshot(collection(db,'chats'),async snap=>{
    let total=0;
    for(const d of snap.docs){
      const chatId=d.id;
      if(!chatId.includes(uid))continue;
      const msgsSnap=await getDocs(query(collection(db,'chats',chatId,'messages'),orderBy('createdAt','desc')));
      msgsSnap.forEach(m=>{const msg=m.data();if(msg.to===uid&&!msg.read)total++;});
    }
    S.msgUnread=total;
    const b=document.getElementById('mbadge');
    if(b){b.textContent=total;b.style.display=total>0?'flex':'none';}
  });
}

async function renderMessages(app){
  const wrap=document.createElement('div');
  const nr=document.createElement('div');nr.className='nav-r';
  const bk=document.createElement('button');bk.className='nbtn';bk.textContent='<- Feed';bk.onclick=()=>{S.view='feed';render();};
  nr.appendChild(bk);wrap.appendChild(makeNav(nr));
  const main=document.createElement('div');main.className='main';
  const hCard=document.createElement('div');hCard.className='card';
  const ht=document.createElement('h2');ht.style.cssText='font-family:Nunito,sans-serif;font-weight:900;font-size:18px;margin-bottom:14px;';ht.textContent='Mensajes';hCard.appendChild(ht);
  if(!S.friends.length){
    const e=document.createElement('div');e.style.cssText='color:var(--mut);font-size:14px;text-align:center;padding:20px 0;';e.textContent='Agrega amigos para poder enviar mensajes.';hCard.appendChild(e);

    await setDoc(doc(db,'users',cred.user.uid),profile);
    S.me=profile;S.users[cred.user.uid]=profile;S.re='';
  } catch(e){S.re=e.code==='auth/email-already-in-use'?'Ese correo ya esta registrado.':'Error: '+e.message;render();}
}

        const canvas=document.createElement('canvas');const mw=800;const r=Math.min(1,mw/imgEl.width);

        canvas.getContext('2d').drawImage(imgEl,0,0,canvas.width,canvas.height);
        S.ni2=canvas.toDataURL('image/jpeg',0.7);render();
      };imgEl.src=ev.target.result;
    };reader.readAsDataURL(f);
  };

  };

    rb.innerHTML='&#128257; Republicado de ';
    const bl=document.createElement('b');bl.style.cssText='color:var(--acc2);cursor:pointer;';bl.textContent=origU.name;
    bl.onclick=()=>{S.pid=post.originalUserId;S.view='profile';render();};
    rb.appendChild(bl);card.appendChild(rb);
  }
  const ph=document.createElement('div');ph.className='ph';
  const av=avEl(author,40);av.style.cursor='pointer';av.onclick=()=>{S.pid=post.userId;S.view='profile';render();};ph.appendChild(av);
  const info=document.createElement('div');info.className='ph-info';
  const nm=document.createElement('div');nm.className='ph-name';nm.style.cursor='pointer';nm.textContent=author.name;nm.onclick=()=>{S.pid=post.userId;S.view='profile';render();};
  const meta=document.createElement('div');meta.className='ph-meta';meta.textContent=(author.handle||'@usuario')+' · '+timeAgo(post.createdAt);
  info.appendChild(nm);info.appendChild(meta);ph.appendChild(info);
  const tagSpan=document.createElement('span');
  if(!post.privacy||post.privacy==='public'){tagSpan.className='tag tag-pub';tagSpan.innerHTML='&#127760;';}
  else if(post.privacy==='friends'){tagSpan.className='tag tag-fri';tagSpan.innerHTML='&#128101;';}
  else{tagSpan.className='tag tag-prv';tagSpan.innerHTML='&#128274;';}
  ph.appendChild(tagSpan);
  if(post.userId===S.cu.uid){
    const del=document.createElement('button');del.style.cssText='background:transparent;border:none;color:var(--mut);cursor:pointer;font-size:14px;padding:2px 5px;border-radius:6px;';del.innerHTML='&#128465;';
    del.onclick=async e=>{e.stopPropagation();if(confirm('Eliminar publicacion?'))await deleteDoc(doc(db,'posts',post.id));};
    ph.appendChild(del);
  }
  card.appendChild(ph);
  if(post.content){const p=document.createElement('p');p.style.cssText='line-height:1.65;font-size:15px;margin-bottom:10px;';p.innerHTML=formatText(post.content);card.appendChild(p);}
  if(post.image){
    const iw=document.createElement('div');iw.style.position='relative';
    const img=document.createElement('img');img.style.cssText='width:100%;border-radius:11px;max-height:360px;object-fit:cover;display:block;margin-bottom:10px;';img.src=post.image;iw.appendChild(img);
    if(post.userId===S.cu.uid){
      const di=document.createElement('button');di.style.cssText='position:absolute;top:7px;right:7px;background:#000b;color:#fff;border:none;border-radius:20px;padding:3px 9px;cursor:pointer;font-size:12px;font-weight:700;';di.textContent='Quitar imagen';
      di.onclick=async()=>{if(confirm('Quitar imagen?'))await updateDoc(doc(db,'posts',post.id),{image:deleteField(),type:'status'});};iw.appendChild(di);
    }
    card.appendChild(iw);
  }
  const likes=post.likes||[];const isLiked=likes.includes(S.cu.uid);const isOpen=!!S.oc[post.id];const comments=post.comments||[];const reposts=post.reposts||[];const isRep=reposts.includes(S.cu.uid);
  const acts=document.createElement('div');acts.className='act-row';
  const lb=document.createElement('button');lb.className='ab'+(isLiked?' liked':'');lb.innerHTML=(isLiked?'&#10084;':'&#129293;')+' '+likes.length;
  lb.onclick=async()=>{const ref=doc(db,'posts',post.id);if(isLiked)await updateDoc(ref,{likes:arrayRemove(S.cu.uid)});else{await updateDoc(ref,{likes:arrayUnion(S.cu.uid)});await addNotif(post.userId,'like',post.id,null);}};
  let pt;lb.addEventListener('touchstart',()=>{pt=setTimeout(async()=>{if(!likes.length)return;const ns=[];for(const u of likes){const ud=await loadU(u);if(ud)ns.push(ud.name);}alert('Les gusto a:\n'+ns.join('\n'));},600);},{passive:true});
  lb.addEventListener('touchend',()=>clearTimeout(pt),{passive:true});
  const cb=document.createElement('button');cb.className='ab'+(isOpen?' copen':'');cb.innerHTML='&#128172; '+comments.length;
  cb.onclick=()=>{S.oc[post.id]=!S.oc[post.id];render();};
  const rpb=document.createElement('button');rpb.className='ab'+(isRep?' reposted':'');rpb.innerHTML='&#128257; '+reposts.length;rpb.title='Republicar';
  rpb.onclick=async()=>{
    if(isRep){await updateDoc(doc(db,'posts',post.id),{reposts:arrayRemove(S.cu.uid)});return;}
    if(!confirm('Republicar este post?'))return;
    await addDoc(collection(db,'posts'),{userId:S.cu.uid,type:'repost',content:post.content,image:post.image||null,privacy:'public',originalUserId:post.userId,originalPostId:post.id,createdAt:serverTimestamp(),likes:[],comments:[],reposts:[]});
    await updateDoc(doc(db,'posts',post.id),{reposts:arrayUnion(S.cu.uid)});
    await addNotif(post.userId,'repost',post.id,null);
  };
  acts.appendChild(lb);acts.appendChild(cb);acts.appendChild(rpb);card.appendChild(acts);
  if(isOpen){
    const cs=document.createElement('div');cs.className='cmts';
    comments.forEach(c=>{
      const cu=S.users[c.userId]||{name:'Usuario',avatar:'star'};
      const ci=document.createElement('div');ci.className='ci';
      ci.appendChild(avEl(cu,30));
      const cb2=document.createElement('div');cb2.className='cb';
      const caSpan=document.createElement('span');caSpan.className='ca';caSpan.textContent=cu.name;caSpan.onclick=()=>{S.pid=c.userId;S.view='profile';render();};
      const ctSpan=document.createElement('span');ctSpan.className='ct2';ctSpan.textContent=timeAgo(c.createdAt);
      const ctxtP=document.createElement('p');ctxtP.className='ctxt';ctxtP.innerHTML=formatText(c.text);
      cb2.appendChild(caSpan);cb2.appendChild(ctSpan);cb2.appendChild(ctxtP);
      const cBtns=document.createElement('div');cBtns.style.cssText='display:flex;gap:8px;margin-top:4px;';
      const replyB=document.createElement('button');replyB.style.cssText='background:transparent;border:none;color:var(--mut);cursor:pointer;font-size:12px;font-weight:700;font-family:Nunito Sans,sans-serif;';replyB.textContent='Responder';
      replyB.onclick=()=>{const inp=document.getElementById('ci-'+post.id);if(inp){const rv='@'+cu.handle.replace('@','')+' ';inp.value=rv;inp.focus();S.ct[post.id]=rv;}};
      cBtns.appendChild(replyB);
      if(c.userId===S.cu.uid){
        const delC=document.createElement('button');delC.style.cssText='background:transparent;border:none;color:var(--mut);cursor:pointer;font-size:12px;font-family:Nunito Sans,sans-serif;';delC.textContent='Eliminar';
        delC.onclick=async()=>{if(confirm('Eliminar comentario?')){const upd=post.comments.filter(x=>!(x.userId===c.userId&&x.text===c.text&&x.createdAt===c.createdAt));await updateDoc(doc(db,'posts',post.id),{comments:upd});}};
        cBtns.appendChild(delC);
      }
      cb2.appendChild(cBtns);ci.appendChild(cb2);cs.appendChild(ci);
    });
    const ir=document.createElement('div');ir.className='ci-row';ir.style.position='relative';
    ir.appendChild(avEl(S.me,30));
    const cinWrap=document.createElement('div');cinWrap.style.cssText='flex:1;position:relative;';
    const cin=document.createElement('input');cin.id='ci-'+post.id;cin.placeholder='Comenta... (usa @)';cin.value=S.ct[post.id]||'';
    const cmbox=document.createElement('div');cmbox.className='mention-box';cmbox.id='mb-'+post.id;
    cin.addEventListener('input',e=>{
      S.ct[post.id]=e.target.value;
      const val=e.target.value;const ai=val.lastIndexOf('@');
      if(ai>=0){
        const q2=val.slice(ai+1).toLowerCase();
        const ms=S.friends.map(uid=>S.users[uid]).filter(u=>u&&(u.name.toLowerCase().includes(q2)||(u.handle||'').toLowerCase().includes(q2))).slice(0,5);
        if(ms.length){
          cmbox.innerHTML='';cmbox.style.display='block';
          ms.forEach(u=>{
            const opt=document.createElement('div');opt.className='mention-opt';
            opt.innerHTML=em(u.avatar)+' <b>'+esc(u.name)+'</b> <span style="color:var(--mut);font-size:11px">'+esc(u.handle)+'</span>';
            opt.onmousedown=ev=>{ev.preventDefault();const bef=val.slice(0,ai);const nv=bef+'@'+u.handle.replace('@','')+' ';cin.value=nv;S.ct[post.id]=nv;cmbox.style.display='none';cin.focus();};
            cmbox.appendChild(opt);
          });
        } else cmbox.style.display='none';
      } else cmbox.style.display='none';
    });
    cin.addEventListener('blur',()=>setTimeout(()=>cmbox.style.display='none',200));
    cin.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendCmt(post);}});
    cinWrap.appendChild(cin);cinWrap.appendChild(cmbox);
    const sb=document.createElement('button');sb.className='sbtn';sb.textContent='Enviar';sb.onclick=()=>sendCmt(post);
    ir.appendChild(cinWrap);ir.appendChild(sb);cs.appendChild(ir);card.appendChild(cs);
  }
  return card;
}

async function sendCmt(post){
  const text=S.ct[post.id]||'';if(!text.trim())return;
  S.users[S.cu.uid]=S.me;
  const c={userId:S.cu.uid,text,createdAt:new Date().toISOString()};
  await updateDoc(doc(db,'posts',post.id),{comments:arrayUnion(c)});
  await addNotif(post.userId,'comment',post.id,null);
  S.ct[post.id]='';
}

// PROFILE
async function renderProf(app){
  const prof=await loadU(S.pid);
  if(!prof){app.innerHTML='<div class="empty">Usuario no encontrado.</div>';return;}
  const uposts=S.posts.filter(p=>p.userId===S.pid);
  const isOwn=S.pid===S.cu.uid;
  const isF=isFriend(S.pid);
  let fc=0;let pending=null;
  try{
    const sn=await getDocs(collection(db,'friendships'));
    sn.forEach(d=>{
      const f=d.data();
      if(f.status==='accepted'&&(f.from===S.pid||f.to===S.pid))fc++;
      if(f.from===S.cu.uid&&f.to===S.pid&&f.status==='pending')pending=d.id;
    });
  }catch(e){}
  const wrap=document.createElement('div');
  const nr=document.createElement('div');nr.className='nav-r';
  const bk=document.createElement('button');bk.className='nbtn';bk.textContent='<- Feed';bk.onclick=()=>{S.view='feed';render();};
  const ob=document.createElement('button');ob.className='nbtn';ob.textContent='Salir';ob.onclick=async()=>{if(unsubP)unsubP();if(unsubN)unsubN();await signOut(auth);};
  nr.appendChild(bk);nr.appendChild(ob);wrap.appendChild(makeNav(nr));
  const main=document.createElement('div');main.className='main';
  const hc=document.createElement('div');hc.className='card';
  const ph=document.createElement('div');ph.style.cssText='display:flex;gap:14px;align-items:flex-start;';
  const avWrap=document.createElement('div');avWrap.className='prof-av-w';
  if(prof.photo||prof.photoURL){const img=document.createElement('img');img.src=prof.photo||prof.photoURL;img.style.cssText='width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid #9b35e855;';avWrap.appendChild(img);}
  else{const avd=avEl(prof,70);avWrap.appendChild(avd);}
  if(isOwn){
    const ov=document.createElement('div');ov.className='av-ov';ov.innerHTML='&#128247;';avWrap.appendChild(ov);
    const pfi=document.createElement('input');pfi.type='file';pfi.accept='image/*';pfi.style.display='none';
    pfi.onchange=async e=>{
      const file=e.target.files[0];if(!file)return;
      const reader=new FileReader();reader.onload=async ev=>{
        const imgEl=new Image();imgEl.onload=async()=>{
          const canvas=document.createElement('canvas');const sz=300;canvas.width=sz;canvas.height=sz;
          const ctx=canvas.getContext('2d');const mn=Math.min(imgEl.width,imgEl.height);
          const sx=(imgEl.width-mn)/2;const sy=(imgEl.height-mn)/2;
          ctx.drawImage(imgEl,sx,sy,mn,mn,0,0,sz,sz);
          const photo=canvas.toDataURL('image/jpeg',0.8);
          await updateDoc(doc(db,'users',S.cu.uid),{photo,photoURL:photo});
          S.me={...S.me,photo};S.users[S.cu.uid]=S.me;
          renderProf(document.getElementById('app'));
        };imgEl.src=ev.target.result;
      };reader.readAsDataURL(file);
    };
    avWrap.appendChild(pfi);avWrap.onclick=()=>pfi.click();
  }
  ph.appendChild(avWrap);
  const info=document.createElement('div');info.style.flex='1';
  const pname=document.createElement('div');pname.style.cssText='font-size:19px;font-weight:900;font-family:Nunito,sans-serif;margin-bottom:2px;';pname.textContent=prof.name;
  const phandle=document.createElement('div');phandle.style.cssText='color:var(--mut);font-size:13px;margin-bottom:6px;';phandle.textContent=prof.handle||'';
  const pbio=document.createElement('div');pbio.style.cssText='font-size:14px;margin-bottom:10px;line-height:1.5;';pbio.textContent=prof.bio||'Sin biografia';
  const pstats=document.createElement('div');pstats.className='pstats';
  const fs=document.createElement('div');fs.className='pstat';fs.innerHTML='<b>'+(isOwn?S.friends.length:fc)+'</b> <span>amigos</span>';
  const ps=document.createElement('div');ps.className='pstat';ps.innerHTML='<b>'+uposts.length+'</b> <span>posts</span>';
  pstats.appendChild(fs);pstats.appendChild(ps);
  info.appendChild(pname);info.appendChild(phandle);info.appendChild(pbio);info.appendChild(pstats);
  if(isOwn){
    const privDiv=document.createElement('div');privDiv.style.marginTop='10px';
    const privL=document.createElement('div');privL.className='fl';privL.textContent='Privacidad del perfil';
    const privS=document.createElement('select');privS.className='priv-sel';privS.style.width='100%';
    privS.innerHTML='<option value="false">Perfil publico</option><option value="true">Perfil privado (solo amigos)</option>';
    privS.value=String(prof.privateProfile||false);
    privS.onchange=async e=>{const ip=e.target.value==='true';await updateDoc(doc(db,'users',S.cu.uid),{privateProfile:ip});S.me={...S.me,privateProfile:ip};S.users[S.cu.uid]=S.me;};
    privDiv.appendChild(privL);privDiv.appendChild(privS);info.appendChild(privDiv);
  }
  ph.appendChild(info);
  if(!isOwn){
    const bw2=document.createElement('div');
    if(isF){
      const fb=document.createElement('button');fb.className='btn-o';fb.style.cssText='color:var(--grn);border-color:#4ade8055;font-size:13px;';fb.textContent='Amigos';fb.disabled=true;bw2.appendChild(fb);
      const mb=document.createElement('button');mb.className='btn';mb.style.cssText='padding:8px 14px;font-size:13px;margin-top:6px;display:block;';mb.innerHTML='&#128172; Mensaje';
      mb.onclick=()=>{S.chatWith=S.pid;S.view='chat';render();};bw2.appendChild(mb);
    }
    else if(pending){const fb=document.createElement('button');fb.className='btn-o';fb.style.fontSize='13px';fb.textContent='Solicitud enviada';fb.disabled=true;bw2.appendChild(fb);}
    else{const fb=document.createElement('button');fb.className='btn';fb.style.cssText='padding:8px 14px;font-size:13px;';fb.textContent='Agregar amigo';fb.onclick=async()=>{await sendFriendReq(S.pid);fb.textContent='Solicitud enviada';fb.disabled=true;fb.style.opacity='.6';};bw2.appendChild(fb);}
    ph.appendChild(bw2);
  }
  hc.appendChild(ph);main.appendChild(hc);
  if(prof.privateProfile&&!isOwn&&!isF){
    const lock=document.createElement('div');lock.className='lock-msg';lock.innerHTML='&#128274; Este perfil es privado. Solo sus amigos pueden ver sus publicaciones.';main.appendChild(lock);
  } else {
    if(!uposts.length){const e=document.createElement('div');e.className='empty';e.textContent='Sin publicaciones aun.';main.appendChild(e);}
    else uposts.forEach(p=>main.appendChild(renderPost(p)));
  }
  wrap.appendChild(main);app.innerHTML='';app.appendChild(wrap);
}
</script>
