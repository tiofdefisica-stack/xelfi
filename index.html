<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xelfi — Red Social</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0b14;
    --surface: #16121f;
    --card: #1c1729;
    --border: #2e2540;
    --accent: #9b35e8;
    --accent2: #c060ff;
    --text: #ede8f5;
    --muted: #7a6a9a;
    --red: #ff4d6d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Nunito Sans', sans-serif; min-height: 100vh; }

  .xelfi-logo { display: inline-flex; align-items: baseline; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 900; line-height: 1; user-select: none; }
  .xelfi-X { font-size: 2em; background: linear-gradient(160deg, #cc44ff 0%, #9b35e8 40%, #6a10c8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 2px 8px #9b35e855); }
  .xelfi-elfi { font-size: 1.35em; background: linear-gradient(135deg, #cc44ff 0%, #9b35e8 55%, #b040ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  nav .xelfi-X { font-size: 1.6em; }
  nav .xelfi-elfi { font-size: 1.05em; }
  .auth-logo .xelfi-X { font-size: 3.2em; }
  .auth-logo .xelfi-elfi { font-size: 2.2em; }

  nav { position: sticky; top: 0; z-index: 100; background: #0e0b14ee; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 18px; height: 54px; backdrop-filter: blur(14px); }
  .nav-right { display: flex; gap: 6px; align-items: center; }
  .nav-btn { background: transparent; color: var(--muted); border: none; border-radius: 8px; padding: 6px 11px; cursor: pointer; font-weight: 700; font-size: 13px; font-family: 'Nunito', sans-serif; transition: all .15s; }
  .nav-btn:hover { background: #9b35e815; color: var(--accent2); }

  .main { max-width: 600px; margin: 0 auto; padding: 20px 14px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 12px; animation: fadeUp .22s ease; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

  .btn-primary { background: linear-gradient(135deg, var(--accent2), var(--accent)); color: #fff; border: none; border-radius: 9px; padding: 10px 20px; cursor: pointer; font-weight: 800; font-size: 14px; font-family: 'Nunito', sans-serif; transition: all .15s; box-shadow: 0 4px 14px #9b35e840; width: 100%; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px #9b35e860; }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn-outline { background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 700; font-size: 13px; font-family: 'Nunito', sans-serif; transition: all .15s; }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent2); }

  input, textarea { background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 14px; color: var(--text); font-size: 14px; width: 100%; outline: none; font-family: 'Nunito Sans', sans-serif; transition: border .15s; }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: none; line-height: 1.6; }

  .avatar { border-radius: 50%; background: linear-gradient(135deg, #9b35e830, #c060ff30); border: 2px solid #9b35e855; display: flex; align-items: center; justify-content: center; flex-shrink: 0; user-select: none; }

  .tag { background: #9b35e818; color: var(--accent2); border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 800; font-family: 'Nunito', sans-serif; }

  .auth-wrap { max-width: 400px; margin: 28px auto; }
  .auth-row { display: flex; flex-direction: column; gap: 11px; }
  .form-label { font-size: 11px; color: var(--muted); margin-bottom: 3px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; font-family: 'Nunito', sans-serif; }
  .avatar-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .av-btn { font-size: 20px; background: transparent; border: 2px solid var(--border); border-radius: 8px; padding: 4px 7px; cursor: pointer; transition: all .15s; }
  .av-btn.sel { background: #9b35e820; border-color: var(--accent); }
  .link { color: var(--accent2); cursor: pointer; font-weight: 700; }
  .link:hover { text-decoration: underline; }
  .error { color: var(--red); font-size: 13px; font-weight: 700; padding: 8px 12px; background: #ff4d6d15; border-radius: 8px; border: 1px solid #ff4d6d33; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .demo-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .composer-row { display: flex; gap: 11px; margin-bottom: 11px; }
  .composer-actions { display: flex; justify-content: space-between; align-items: center; }
  .img-preview { position: relative; margin-bottom: 11px; }
  .img-preview img { width: 100%; border-radius: 10px; max-height: 240px; object-fit: cover; display: block; }
  .rm-img { position: absolute; top: 8px; right: 8px; background: #000b; color: #fff; border: none; border-radius: 50%; width: 26px; height: 26px; cursor: pointer; font-size: 13px; }

  .post-header { display: flex; align-items: center; gap: 11px; margin-bottom: 11px; }
  .post-author { flex: 1; cursor: pointer; }
  .post-author:hover .a-name { color: var(--accent2); }
  .a-name { font-weight: 800; font-size: 14px; font-family: 'Nunito', sans-serif; transition: color .15s; }
  .a-meta { font-size: 12px; color: var(--muted); }
  .post-content { line-height: 1.65; font-size: 15px; margin-bottom: 11px; }
  .post-img { width: 100%; border-radius: 11px; max-height: 360px; object-fit: cover; display: block; margin-bottom: 11px; }
  .post-actions { display: flex; gap: 7px; padding-top: 10px; border-top: 1px solid var(--border); }
  .act-btn { display: flex; align-items: center; gap: 5px; background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 6px 13px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--muted); font-family: 'Nunito', sans-serif; transition: all .15s; }
  .act-btn:hover { border-color: var(--accent); color: var(--accent2); }
  .act-btn.liked { background: #ff4d6d15; border-color: #ff4d6d55; color: var(--red); }
  .act-btn.open { background: #9b35e815; border-color: #9b35e855; color: var(--accent2); }

  .comments { margin-top: 11px; }
  .cmt-item { display: flex; gap: 9px; margin-bottom: 9px; }
  .cmt-bubble { background: var(--surface); border-radius: 10px; padding: 8px 12px; flex: 1; border: 1px solid var(--border); }
  .cmt-author { font-weight: 800; font-size: 13px; font-family: 'Nunito', sans-serif; }
  .cmt-time { color: var(--muted); font-size: 11px; margin-left: 5px; }
  .cmt-text { font-size: 14px; line-height: 1.5; margin-top: 3px; }
  .cmt-input-row { display: flex; gap: 8px; margin-top: 9px; align-items: center; }
  .cmt-input-row input { flex: 1; padding: 8px 12px; font-size: 13px; }
  .send-btn { background: linear-gradient(135deg, var(--accent2), var(--accent)); color: #fff; border: none; border-radius: 8px; padding: 8px 13px; cursor: pointer; font-size: 15px; }

  .sug-row { display: flex; gap: 9px; overflow-x: auto; padding-bottom: 4px; }
  .sug-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; cursor: pointer; text-align: center; min-width: 95px; flex-shrink: 0; transition: all .15s; }
  .sug-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .sug-em { font-size: 22px; margin-bottom: 4px; }
  .sug-name { font-size: 12px; font-weight: 800; font-family: 'Nunito', sans-serif; }
  .sug-h { font-size: 11px; color: var(--muted); }

  .prof-header { display: flex; gap: 14px; align-items: flex-start; }
  .prof-name { font-size: 19px; font-weight: 900; font-family: 'Nunito', sans-serif; margin-bottom: 2px; }
  .prof-handle { color: var(--muted); font-size: 13px; margin-bottom: 7px; }
  .prof-bio { font-size: 14px; margin-bottom: 11px; line-height: 1.5; }
  .prof-stats { display: flex; gap: 18px; }
  .stat { font-size: 13px; }
  .stat b { font-family: 'Nunito', sans-serif; font-weight: 900; }
  .stat span { color: var(--muted); }

  .section-label { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 9px; font-family: 'Nunito', sans-serif; }
  .empty { text-align: center; color: var(--muted); padding: 50px 20px; font-size: 15px; }
  .loading { text-align: center; color: var(--muted); padding: 30px; font-size: 14px; }
  .flex-c { display: flex; align-items: center; gap: 7px; }
  .text-sm { font-size: 13px; }
  .text-center { text-align: center; }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Spinner */
  .spinner { width: 20px; height: 20px; border: 2px solid #ffffff44; border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app"><div class="loading" style="padding:80px;font-size:16px">Cargando Xelfi... ✦</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, getDoc, setDoc, updateDoc, query, orderBy, onSnapshot, arrayUnion, arrayRemove, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA695OTVjRtgTuw3-cqjPTyZ9O02eI_n5k",
  authDomain: "xelfi-7e2bf.firebaseapp.com",
  projectId: "xelfi-7e2bf",
  storageBucket: "xelfi-7e2bf.firebasestorage.app",
  messagingSenderId: "261957011071",
  appId: "1:261957011071:web:795d4bcfd0902bc157214a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const AVATARS = ['⭐','🌙','🔭','🌺','🚀','🌊','🦋','🎸','🔬','🌸','⚡','🎯','🦊','🐬','🌴'];

const state = {
  view: 'login',
  currentUser: null,
  userProfile: null,
  profileId: null,
  newPost: '',
  newImage: null,
  regForm: { name:'', handle:'', bio:'', avatar:'⭐', email:'', pass:'' },
  loginForm: { email:'', pass:'' },
  loginError: '',
  regError: '',
  openComments: {},
  commentTexts: {},
  selectedAvatar: '⭐',
  posts: [],
  users: {},
  loading: false,
};

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function logoHTML(){ return `<span class="xelfi-logo"><span class="xelfi-X">X</span><span class="xelfi-elfi">elfi</span></span>`; }

function avatarEl(profile, size=40){
  const d = document.createElement('div');
  d.className = 'avatar';
  d.style.cssText = `width:${size}px;height:${size}px;font-size:${size*.42}px;`;
  d.textContent = profile?.avatar || '⭐';
  return d;
}

function makeNav(rightEl){
  const nav = document.createElement('nav');
  const logoWrap = document.createElement('div');
  logoWrap.innerHTML = logoHTML();
  logoWrap.querySelector('.xelfi-logo').onclick = () => { if(state.currentUser){ state.view='feed'; render(); } };
  nav.appendChild(logoWrap);
  nav.appendChild(rightEl);
  return nav;
}

function timeAgo(ts){
  if(!ts) return 'ahora mismo';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const diff = Math.floor((Date.now() - d) / 1000);
  if(diff < 60) return 'ahora mismo';
  if(diff < 3600) return `hace ${Math.floor(diff/60)} min`;
  if(diff < 86400) return `hace ${Math.floor(diff/3600)} h`;
  return `hace ${Math.floor(diff/86400)} días`;
}

async function loadUserProfile(uid){
  if(state.users[uid]) return state.users[uid];
  const snap = await getDoc(doc(db, 'users', uid));
  if(snap.exists()){
    state.users[uid] = snap.data();
    return state.users[uid];
  }
  return null;
}

// ── AUTH STATE ──
onAuthStateChanged(auth, async (user) => {
  if(user){
    state.currentUser = user;
    const profile = await loadUserProfile(user.uid);
    state.userProfile = profile;
    // Asegurar que el perfil propio esté en el cache de users
    if(profile) state.users[user.uid] = profile;
    state.view = 'feed';
  } else {
    state.currentUser = null;
    state.userProfile = null;
    state.view = 'login';
  }
  render();
});

// ── RENDER ──
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(!state.currentUser){
    app.appendChild(state.view === 'register' ? renderRegister() : renderLogin());
  } else if(state.view === 'profile'){
    app.appendChild(renderProfile());
  } else {
    app.appendChild(renderFeed());
  }
}

// ── LOGIN ──
function renderLogin(){
  const wrap = document.createElement('div');
  const nr = document.createElement('div'); nr.className = 'nav-right';
  const rb = document.createElement('button'); rb.className = 'nav-btn'; rb.textContent = 'Registrarse';
  rb.onclick = () => { state.view='register'; render(); };
  nr.appendChild(rb); wrap.appendChild(makeNav(nr));

  const main = document.createElement('div'); main.className = 'main';
  const card = document.createElement('div'); card.className = 'card auth-wrap';
  card.style.marginTop = '28px';
  card.innerHTML = `
    <div style="text-align:center;margin-bottom:18px" class="auth-logo">${logoHTML()}</div>
    <h2 style="font-family:'Nunito',sans-serif;font-weight:900;font-size:18px;margin-bottom:4px;text-align:center">Bienvenido de nuevo</h2>
    <p style="color:var(--muted);margin-bottom:16px;font-size:13px;text-align:center">Inicia sesión para continuar</p>
    <div class="auth-row">
      <div><div class="form-label">Correo</div><input id="l-e" type="email" placeholder="tu@email.com"></div>
      <div><div class="form-label">Contraseña</div><input id="l-p" type="password" placeholder="••••••••"></div>
      <div id="l-err" style="display:none" class="error"></div>
      <button class="btn-primary" id="l-btn">Iniciar sesión</button>
      <p class="text-sm text-center" style="color:var(--muted)">¿Sin cuenta? <span class="link" id="go-r">Regístrate aquí</span></p>
    </div>
  `;
  main.appendChild(card); wrap.appendChild(main);

  setTimeout(() => {
    const le = document.getElementById('l-e'); le.value = state.loginForm.email;
    const lp = document.getElementById('l-p'); lp.value = state.loginForm.pass;
    le.oninput = e => state.loginForm.email = e.target.value;
    lp.oninput = e => state.loginForm.pass = e.target.value;
    lp.onkeydown = e => e.key==='Enter' && doLogin();
    document.getElementById('l-btn').onclick = doLogin;
    document.getElementById('go-r').onclick = () => { state.view='register'; render(); };
    if(state.loginError){ const err=document.getElementById('l-err'); err.textContent=state.loginError; err.style.display=''; }
  }, 0);
  return wrap;
}

async function doLogin(){
  const btn = document.getElementById('l-btn');
  const err = document.getElementById('l-err');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Entrando...';
  err.style.display = 'none';
  try {
    await signInWithEmailAndPassword(auth, state.loginForm.email, state.loginForm.pass);
  } catch(e) {
    state.loginError = e.code === 'auth/invalid-credential' ? 'Correo o contraseña incorrectos.' : 'Error al iniciar sesión.';
    btn.disabled = false; btn.textContent = 'Iniciar sesión';
    err.textContent = state.loginError; err.style.display = '';
  }
}

// ── REGISTER ──
function renderRegister(){
  const wrap = document.createElement('div');
  const nr = document.createElement('div'); nr.className = 'nav-right';
  const lb = document.createElement('button'); lb.className = 'nav-btn'; lb.textContent = 'Iniciar sesión';
  lb.onclick = () => { state.view='login'; render(); };
  nr.appendChild(lb); wrap.appendChild(makeNav(nr));

  const main = document.createElement('div'); main.className = 'main';
  const card = document.createElement('div'); card.className = 'card auth-wrap';
  card.style.marginTop = '28px';
  card.innerHTML = `
    <div style="text-align:center;margin-bottom:14px" class="auth-logo">${logoHTML()}</div>
    <h2 style="font-family:'Nunito',sans-serif;font-weight:900;font-size:18px;margin-bottom:4px;text-align:center">Crear cuenta</h2>
    <p style="color:var(--muted);margin-bottom:14px;font-size:13px;text-align:center">Únete a la comunidad Xelfi</p>
    <div class="auth-row">
      <div><div class="form-label">Nombre</div><input id="r-n" placeholder="Tu nombre"></div>
      <div><div class="form-label">@Usuario</div><input id="r-h" placeholder="@usuario"></div>
      <div><div class="form-label">Correo electrónico</div><input id="r-e" type="email" placeholder="tu@email.com"></div>
      <div><div class="form-label">Biografía (opcional)</div><input id="r-b" placeholder="Cuéntanos de ti..."></div>
      <div>
        <div class="form-label">Elige tu avatar</div>
        <div class="avatar-picker" id="av-p"></div>
      </div>
      <div><div class="form-label">Contraseña</div><input id="r-p" type="password" placeholder="Mínimo 6 caracteres"></div>
      <div id="r-err" style="display:none" class="error"></div>
      <button class="btn-primary" id="r-btn">Crear cuenta</button>
      <p class="text-sm text-center" style="color:var(--muted)">¿Ya tienes cuenta? <span class="link" id="go-l">Inicia sesión</span></p>
    </div>
  `;
  main.appendChild(card); wrap.appendChild(main);

  setTimeout(() => {
    document.getElementById('r-n').oninput = e => state.regForm.name = e.target.value;
    document.getElementById('r-h').oninput = e => state.regForm.handle = e.target.value;
    document.getElementById('r-e').oninput = e => state.regForm.email = e.target.value;
    document.getElementById('r-b').oninput = e => state.regForm.bio = e.target.value;
    document.getElementById('r-p').oninput = e => state.regForm.pass = e.target.value;
    document.getElementById('r-btn').onclick = doRegister;
    document.getElementById('go-l').onclick = () => { state.view='login'; render(); };
    if(state.regError){ const err=document.getElementById('r-err'); err.textContent=state.regError; err.style.display=''; }
    const pk = document.getElementById('av-p');
    AVATARS.forEach(em => {
      const b = document.createElement('button'); b.className = 'av-btn' + (state.selectedAvatar===em?' sel':'');
      b.textContent = em;
      b.onclick = () => { state.selectedAvatar=em; state.regForm.avatar=em; pk.querySelectorAll('.av-btn').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); };
      pk.appendChild(b);
    });
  }, 0);
  return wrap;
}

async function doRegister(){
  const f = state.regForm;
  const btn = document.getElementById('r-btn');
  const err = document.getElementById('r-err');
  if(!f.name || !f.email || !f.pass){ err.textContent='Completa nombre, correo y contraseña.'; err.style.display=''; return; }
  if(f.pass.length < 6){ err.textContent='La contraseña debe tener al menos 6 caracteres.'; err.style.display=''; return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Creando cuenta...';
  err.style.display = 'none';
  try {
    const cred = await createUserWithEmailAndPassword(auth, f.email, f.pass);
    const handle = f.handle ? (f.handle.startsWith('@') ? f.handle : '@'+f.handle) : '@'+f.name.toLowerCase().replace(/\s/g,'');
    const profile = { name: f.name, handle, bio: f.bio||'', avatar: state.selectedAvatar, followers: 0, following: 0, email: f.email, createdAt: serverTimestamp() };
    await setDoc(doc(db, 'users', cred.user.uid), profile);
    state.userProfile = profile;
    state.regError = '';
  } catch(e) {
    state.regError = e.code === 'auth/email-already-in-use' ? 'Ese correo ya está registrado.' : 'Error al crear cuenta: ' + e.message;
    btn.disabled = false; btn.textContent = 'Crear cuenta';
    err.textContent = state.regError; err.style.display = '';
  }
}

// ── FEED ──
let unsubPosts = null;

function renderFeed(){
  const wrap = document.createElement('div');
  const nr = document.createElement('div'); nr.className = 'nav-right';
  const pb = document.createElement('button'); pb.className = 'nav-btn flex-c';
  pb.innerHTML = `<span>${state.userProfile?.avatar||'⭐'}</span><span>${esc(state.userProfile?.handle||'')}</span>`;
  pb.onclick = () => { state.profileId=state.currentUser.uid; state.view='profile'; render(); };
  const ob = document.createElement('button'); ob.className = 'nav-btn'; ob.textContent = 'Salir';
  ob.onclick = async () => { if(unsubPosts) unsubPosts(); await signOut(auth); };
  nr.appendChild(pb); nr.appendChild(ob); wrap.appendChild(makeNav(nr));

  const main = document.createElement('div'); main.className = 'main';
  main.appendChild(renderComposer());

  const postsDiv = document.createElement('div'); postsDiv.id = 'posts-container';
  postsDiv.innerHTML = '<div class="loading">Cargando publicaciones...</div>';
  main.appendChild(postsDiv);

  wrap.appendChild(main);

  // Real-time posts listener
  if(unsubPosts) unsubPosts();
  const q = query(collection(db, 'posts'), orderBy('createdAt', 'desc'));
  unsubPosts = onSnapshot(q, async (snapshot) => {
    const postsList = [];
    // Asegurar que el perfil propio siempre está en cache
    if(state.currentUser && state.userProfile) state.users[state.currentUser.uid] = state.userProfile;
    for(const docSnap of snapshot.docs){
      const data = { id: docSnap.id, ...docSnap.data() };
      if(!state.users[data.userId]) await loadUserProfile(data.userId);
      postsList.push(data);
    }
    state.posts = postsList;
    const container = document.getElementById('posts-container');
    if(!container) return;
    container.innerHTML = '';
    if(postsList.length === 0){
      container.innerHTML = '<div class="empty">¡Sé el primero en publicar en Xelfi! 🚀</div>';
    } else {
      postsList.forEach(post => container.appendChild(renderPost(post)));
    }
  });

  // Load suggested users
  loadSuggestedUsers(main);

  return wrap;
}

async function loadSuggestedUsers(main){
  try {
    const snap = await getDocs(collection(db, 'users'));
    const others = [];
    snap.forEach(d => { if(d.id !== state.currentUser.uid) others.push({ id:d.id, ...d.data() }); });
    if(others.length === 0) return;
    const sc = document.createElement('div'); sc.className = 'card'; sc.style.padding = '13px 18px';
    const sl = document.createElement('div'); sl.className = 'section-label'; sl.textContent = 'Personas en Xelfi';
    sc.appendChild(sl);
    const row = document.createElement('div'); row.className = 'sug-row';
    others.slice(0,10).forEach(u => {
      const s = document.createElement('div'); s.className = 'sug-card';
      s.innerHTML = `<div class="sug-em">${u.avatar||'⭐'}</div><div class="sug-name">${esc((u.name||'').split(' ')[0])}</div><div class="sug-h">${esc(u.handle||'')}</div>`;
      s.onclick = () => { state.profileId=u.id; state.view='profile'; render(); };
      row.appendChild(s);
    });
    sc.appendChild(row);
    // Insert after composer
    const composer = main.querySelector('.card');
    main.insertBefore(sc, composer.nextSibling);
  } catch(e) { console.log('Error cargando usuarios', e); }
}

// ── COMPOSER ──
function renderComposer(){
  const card = document.createElement('div'); card.className = 'card';
  const row = document.createElement('div'); row.className = 'composer-row';
  row.appendChild(avatarEl(state.userProfile, 40));
  const ta = document.createElement('textarea'); ta.placeholder = '¿Qué está pasando?'; ta.rows = 3;
  ta.value = state.newPost; ta.oninput = e => state.newPost = e.target.value;
  row.appendChild(ta); card.appendChild(row);

  const prev = document.createElement('div');
  if(state.newImage){
    prev.className = 'img-preview';
    const img = document.createElement('img'); img.src = state.newImage;
    const rm = document.createElement('button'); rm.className = 'rm-img'; rm.textContent = '✕';
    rm.onclick = () => { state.newImage=null; render(); };
    prev.appendChild(img); prev.appendChild(rm);
  }
  card.appendChild(prev);

  const fi = document.createElement('input'); fi.type='file'; fi.accept='image/*'; fi.style.display='none';
  fi.onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    // Compress image to base64 (max 800px wide)
    const reader = new FileReader();
    reader.onload = ev => {
      const imgEl = new Image();
      imgEl.onload = () => {
        const canvas = document.createElement('canvas');
        const maxW = 800;
        const ratio = Math.min(1, maxW / imgEl.width);
        canvas.width = imgEl.width * ratio; canvas.height = imgEl.height * ratio;
        canvas.getContext('2d').drawImage(imgEl, 0, 0, canvas.width, canvas.height);
        state.newImage = canvas.toDataURL('image/jpeg', 0.7);
        render();
      };
      imgEl.src = ev.target.result;
    };
    reader.readAsDataURL(f);
  };
  card.appendChild(fi);

  const act = document.createElement('div'); act.className = 'composer-actions';
  const ib = document.createElement('button'); ib.className = 'btn-outline'; ib.textContent = '📷 Imagen';
  ib.onclick = () => fi.click();
  const pb = document.createElement('button'); pb.className = 'btn-primary'; pb.style.width='auto'; pb.textContent = 'Publicar';
  pb.onclick = async () => {
    if(!state.newPost.trim() && !state.newImage) return;
    pb.disabled = true; pb.innerHTML = '<span class="spinner"></span>Publicando...';
    try {
      await addDoc(collection(db, 'posts'), {
        userId: state.currentUser.uid,
        type: state.newImage ? 'image' : 'status',
        content: state.newPost,
        image: state.newImage || null,
        createdAt: serverTimestamp(),
        likes: [],
        comments: [],
      });
      state.newPost = ''; state.newImage = null;
      render();
    } catch(e) { alert('Error al publicar: ' + e.message); pb.disabled=false; pb.textContent='Publicar'; }
  };
  act.appendChild(ib); act.appendChild(pb); card.appendChild(act);
  return card;
}

// ── POST ──
function renderPost(post){
  const author = state.users[post.userId] || { name:'Usuario', handle:'@usuario', avatar:'⭐' };
  const card = document.createElement('div'); card.className = 'card';

  const hdr = document.createElement('div'); hdr.className = 'post-header';
  const av = avatarEl(author, 40); av.style.cursor='pointer';
  av.onclick = () => { state.profileId=post.userId; state.view='profile'; render(); };
  hdr.appendChild(av);

  const ad = document.createElement('div'); ad.className = 'post-author';
  ad.innerHTML = `<div class="a-name">${esc(author.name)}</div><div class="a-meta">${esc(author.handle)} · ${timeAgo(post.createdAt)}</div>`;
  ad.onclick = () => { state.profileId=post.userId; state.view='profile'; render(); };
  hdr.appendChild(ad);

  const tg = document.createElement('span'); tg.className = 'tag';
  tg.textContent = post.type==='image' ? '📷 Foto' : '💬 Estado';
  hdr.appendChild(tg); card.appendChild(hdr);

  if(post.content){ const p=document.createElement('p'); p.className='post-content'; p.textContent=post.content; card.appendChild(p); }

  if(post.image){ const img=document.createElement('img'); img.className='post-img'; img.src=post.image; img.alt=''; card.appendChild(img); }

  const likes = post.likes || [];
  const isLiked = likes.includes(state.currentUser.uid);
  const isOpen = !!state.openComments[post.id];
  const comments = post.comments || [];

  const acts = document.createElement('div'); acts.className = 'post-actions';
  const lb = document.createElement('button'); lb.className = 'act-btn' + (isLiked?' liked':'');
  lb.innerHTML = `${isLiked?'❤️':'🤍'} <span>${likes.length}</span>`;
  lb.onclick = async () => {
    const ref = doc(db, 'posts', post.id);
    if(isLiked){ await updateDoc(ref, { likes: arrayRemove(state.currentUser.uid) }); }
    else { await updateDoc(ref, { likes: arrayUnion(state.currentUser.uid) }); }
  };

  const cb = document.createElement('button'); cb.className = 'act-btn' + (isOpen?' open':'');
  cb.innerHTML = `💬 <span>${comments.length}</span>`;
  cb.onclick = () => { state.openComments[post.id]=!state.openComments[post.id]; render(); };
  acts.appendChild(lb); acts.appendChild(cb); card.appendChild(acts);

  if(isOpen){
    const cs = document.createElement('div'); cs.className = 'comments';
    comments.forEach(c => {
      const cu = state.users[c.userId] || { name:'Usuario', avatar:'⭐' };
      const item = document.createElement('div'); item.className = 'cmt-item';
      item.appendChild(avatarEl(cu, 30));
      const bbl = document.createElement('div'); bbl.className = 'cmt-bubble';
      bbl.innerHTML = `<span class="cmt-author">${esc(cu.name)}</span><span class="cmt-time">${timeAgo(c.createdAt)}</span><p class="cmt-text">${esc(c.text)}</p>`;
      item.appendChild(bbl); cs.appendChild(item);
    });
    const ir = document.createElement('div'); ir.className = 'cmt-input-row';
    ir.appendChild(avatarEl(state.userProfile, 30));
    const cin = document.createElement('input'); cin.placeholder = 'Comenta algo...';
    cin.value = state.commentTexts[post.id] || '';
    cin.oninput = e => state.commentTexts[post.id] = e.target.value;
    cin.onkeydown = e => e.key==='Enter' && sendComment(post);
    const sb = document.createElement('button'); sb.className = 'send-btn'; sb.textContent = '↑';
    sb.onclick = () => sendComment(post);
    ir.appendChild(cin); ir.appendChild(sb); cs.appendChild(ir); card.appendChild(cs);
  }
  return card;
}

async function sendComment(post){
  const text = state.commentTexts[post.id] || '';
  if(!text.trim()) return;
  state.users[state.currentUser.uid] = state.userProfile;
  const comment = { userId: state.currentUser.uid, text, createdAt: new Date().toISOString() };
  await updateDoc(doc(db, 'posts', post.id), { comments: arrayUnion(comment) });
  state.commentTexts[post.id] = '';
}

// ── PROFILE ──
async function renderProfile(){
  const wrap = document.createElement('div');
  const nr = document.createElement('div'); nr.className = 'nav-right';
  const bk = document.createElement('button'); bk.className = 'nav-btn'; bk.textContent = '← Feed';
  bk.onclick = () => { state.view='feed'; render(); };
  const ob = document.createElement('button'); ob.className = 'nav-btn'; ob.textContent = 'Salir';
  ob.onclick = async () => { if(unsubPosts) unsubPosts(); await signOut(auth); };
  nr.appendChild(bk); nr.appendChild(ob); wrap.appendChild(makeNav(nr));

  const main = document.createElement('div'); main.className = 'main';
  main.innerHTML = '<div class="loading">Cargando perfil...</div>';
  wrap.appendChild(main);

  // Load profile
  let prof = await loadUserProfile(state.profileId);
  if(!prof){ main.innerHTML = '<div class="empty">Usuario no encontrado.</div>'; return wrap; }
  const isOwn = state.profileId === state.currentUser.uid;

  // Load user posts
  const allPosts = state.posts.filter(p => p.userId === state.profileId);

  main.innerHTML = '';

  const hc = document.createElement('div'); hc.className = 'card';
  const ph = document.createElement('div'); ph.className = 'prof-header';
  ph.appendChild(avatarEl(prof, 62));
  const info = document.createElement('div'); info.style.flex = '1';
  info.innerHTML = `<div class="prof-name">${esc(prof.name)}</div><div class="prof-handle">${esc(prof.handle)}</div><div class="prof-bio">${esc(prof.bio||'Sin biografía')}</div><div class="prof-stats"><div class="stat"><b>${prof.followers||0}</b> <span>seguidores</span></div><div class="stat"><b>${prof.following||0}</b> <span>siguiendo</span></div><div class="stat"><b>${allPosts.length}</b> <span>posts</span></div></div>`;
  ph.appendChild(info);
  if(!isOwn){
    const fb = document.createElement('button'); fb.className = 'btn-primary'; fb.style.cssText='width:auto;padding:8px 14px;font-size:13px'; fb.textContent = 'Seguir';
    fb.onclick = async () => {
      await updateDoc(doc(db,'users',state.profileId), { followers: increment(1) });
      await updateDoc(doc(db,'users',state.currentUser.uid), { following: increment(1) });
      fb.textContent='Siguiendo ✓'; fb.disabled=true; fb.style.opacity='.5';
    };
    ph.appendChild(fb);
  }
  hc.appendChild(ph); main.appendChild(hc);

  if(!allPosts.length){ const e=document.createElement('div'); e.className='empty'; e.textContent='Sin publicaciones aún.'; main.appendChild(e); }
  else allPosts.forEach(p => main.appendChild(renderPost(p)));

  return wrap;
}

</script>
