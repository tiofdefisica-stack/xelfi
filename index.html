async function openSinglePost(postId){
  let panel=document.getElementById('single-post-panel');if(panel)panel.remove();
  panel=document.createElement('div');panel.id='single-post-panel';
  panel.style.cssText='position:fixed;inset:0;background:var(--bg);z-index:2000;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;';
  // Header
  const hdr=document.createElement('div');hdr.style.cssText='display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surf);border-bottom:1px solid var(--bor);position:sticky;top:0;z-index:10;flex-shrink:0;';
  const back=document.createElement('button');back.style.cssText='background:transparent;border:none;font-size:22px;cursor:pointer;color:var(--txt);';back.textContent='←';back.onclick=()=>panel.remove();
  const t=document.createElement('div');t.style.cssText='font-weight:900;font-size:15px;font-family:Nunito,sans-serif;';t.textContent='Publicación';
  hdr.appendChild(back);hdr.appendChild(t);panel.appendChild(hdr);
  // Content area
  const content=document.createElement('div');content.style.cssText='padding:12px;padding-bottom:80px;';
  content.innerHTML='<div style="text-align:center;padding:40px;color:var(--mut);">Cargando...</div>';
  panel.appendChild(content);
  document.body.appendChild(panel);
  setTimeout(()=>panel.style.transform='translateY(0)',10);
  // Load post
  try{
    const postDoc=await getDoc(doc(db,'posts',postId));
    if(!postDoc.exists()){content.innerHTML='<div style="text-align:center;padding:40px;color:var(--mut);">Post no encontrado</div>';return;}
    const post={id:postDoc.id,...postDoc.data()};
    if(!S.users[post.userId])await loadU(post.userId);
    content.innerHTML='';
    const postCard=renderPost(post);
    content.appendChild(postCard);
    // Auto-expand comments
    const cmtBtn=postCard.querySelector('.act-row button[data-action="comment"]')||
      Array.from(postCard.querySelectorAll('.act-row button')).find(b=>b.textContent.includes('💬'));
    if(cmtBtn)cmtBtn.click();
    // Scroll to comments after render
    setTimeout(()=>{const cmtSection=postCard.querySelector('.comments-section');if(cmtSection)cmtSection.scrollIntoView({behavior:'smooth',block:'start'});},400);
  }catch(e){content.innerHTML='<div style="text-align:center;padding:40px;color:var(--mut);">Error cargando post</div>';}
}

let gchatOpen=false;let gchatUnsub=null;let gchatUnread=0;let gchatReply=null;let gchatReplyTo=null;

function buildGlobalChat(){
  // Only build once
  if(document.getElementById('gchat-panel'))return;

  const bub=document.createElement('div');bub.className='gchat-bubble';bub.id='gchat-bubble';bub.textContent='💬';

  const dv=document.createElement('div');dv.className='gday-div';dv.textContent='— Hoy —';msgs.appendChild(dv);
  panel.appendChild(msgs);
  // Emoji row
  const er=document.createElement('div');er.className='gemoji-row';
  ['👍','❤️','😂','🔥','🚀','⭐','🙌','😮'].forEach(e=>{const ep=document.createElement('span');ep.className='gep';ep.textContent=e;ep.onclick=()=>{const inp=document.getElementById('gchat-inp');if(inp){inp.value+=e;inp.focus();}};er.appendChild(ep);});
  panel.appendChild(er);
  // Input
  // Reply preview bar
  const rp=document.createElement('div');rp.className='gchat-reply-preview';rp.id='gchat-reply-preview';
  const rpInfo=document.createElement('div');rpInfo.style.flex='1';
  const rpName=document.createElement('div');rpName.className='gchat-reply-name';rpName.id='gchat-reply-name';
  const rpText=document.createElement('div');rpText.className='gchat-reply-text';rpText.id='gchat-reply-text';
  rpInfo.appendChild(rpName);rpInfo.appendChild(rpText);
  const rpCancel=document.createElement('button');rpCancel.className='gchat-reply-cancel';rpCancel.textContent='✕';
  rpCancel.onclick=()=>{gchatReply=null;rp.classList.remove('show');};
  rp.appendChild(rpInfo);rp.appendChild(rpCancel);panel.appendChild(rp);
  const ia=document.createElement('div');ia.className='gchat-inp-area';
  const inp=document.createElement('textarea');inp.className='gchat-inp';inp.id='gchat-inp';inp.placeholder='Escribe algo...';inp.rows=1;
  inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,90)+'px';});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendGChat();}});
  const sb=document.createElement('button');sb.className='gchat-send';sb.textContent='➤';sb.onclick=sendGChat;
  ia.appendChild(inp);ia.appendChild(sb);panel.appendChild(ia);
  document.body.appendChild(panel);
  // Listen online users
  listenGChatOnline();
}

function openGChat(){
  gchatOpen=true;gchatUnread=0;
  const badge=document.getElementById('gchat-badge');if(badge)badge.classList.remove('show');
  const panel=document.getElementById('gchat-panel');if(panel)panel.classList.add('open');
  listenGChatMsgs();
  setTimeout(()=>{const m=document.getElementById('gchat-msgs');if(m)m.scrollTop=m.scrollHeight;},400);
  document.getElementById('gchat-inp')?.focus();
}
function closeGChat(){
  gchatOpen=false;
  const panel=document.getElementById('gchat-panel');if(panel)panel.classList.remove('open');
  if(gchatUnsub){gchatUnsub();gchatUnsub=null;}
}

    // Listen to online users
    if(gchatOnlineUnsub)gchatOnlineUnsub();
    gchatOnlineUnsub=onSnapshot(collection(db,'gchat_online'),sn=>{
      const users=[];sn.forEach(d=>users.push(d.data()));
      const strip=document.getElementById('gchat-users');
      const onlineEl=document.getElementById('gchat-online');
      if(onlineEl)onlineEl.textContent=users.length+' conectados';
      if(strip){strip.innerHTML='';users.slice(0,15).forEach(u=>{const ch=document.createElement('div');ch.className='guser-chip';const av=document.createElement('div');av.className='guser-av';if(u.photo){const img=document.createElement('img');img.src=u.photo;av.appendChild(img);}else av.textContent=em(u.avatar);const nm=document.createElement('div');nm.className='guser-name';nm.textContent=(u.name||'').split(' ')[0];ch.appendChild(av);ch.appendChild(nm);strip.appendChild(ch);});}
    });
  }catch(e){console.error(e);}
}

function listenGChatMsgs(){
  if(gchatUnsub)gchatUnsub();
  try{
    gchatUnsub=onSnapshot(query(collection(db,'gchat'),orderBy('createdAt','asc')),sn=>{
      const msgs=document.getElementById('gchat-msgs');if(!msgs)return;
      const wasBottom=msgs.scrollHeight-msgs.scrollTop-msgs.clientHeight<60;
      // Render only new messages
      sn.docChanges().forEach(change=>{
        if(change.type==='added'){
          const msg={id:change.doc.id,...change.doc.data()};
          const el=buildGMsg(msg);msgs.appendChild(el);
          if(!gchatOpen){gchatUnread++;const badge=document.getElementById('gchat-badge');if(badge){badge.textContent=gchatUnread;badge.classList.add('show');}}
        }
      });
      if(wasBottom||gchatOpen)setTimeout(()=>msgs.scrollTop=msgs.scrollHeight,50);
    });
  }catch(e){console.error(e);}
}

function buildGMsg(msg){
  const mine=msg.userId===S.cu.uid;
  const row=document.createElement('div');row.className='gmsg-row'+(mine?' mine':'');
  const av=document.createElement('div');av.className='gmsg-av';
  if(msg.photo){const img=document.createElement('img');img.src=msg.photo;av.appendChild(img);}else{av.style.background=mine?'linear-gradient(135deg,#9b35e8,#c060ff)':'var(--card)';av.style.border='1px solid var(--bor)';av.textContent=em(msg.avatar);}
  const col=document.createElement('div');col.className='gmsg-col';
  if(!mine){const nm=document.createElement('div');nm.className='gmsg-name';nm.textContent=msg.name||'Usuario';col.appendChild(nm);}
  const bub=document.createElement('div');bub.className='gbub '+(mine?'mine':'theirs');
  if(msg.replyTo){
    const rb=document.createElement('div');rb.className='gbub-reply'+(mine?' mine':'');
    rb.textContent=(msg.replyTo.name||'')+': '+(msg.replyTo.text||'').slice(0,50);
    bub.appendChild(rb);
  }
  const btxt=document.createElement('span');btxt.textContent=msg.text;bub.appendChild(btxt);
  const ts=msg.createdAt?.toDate?msg.createdAt.toDate():new Date();
  const ti=document.createElement('div');ti.className='gbub-time';ti.textContent=ts.getHours()+':'+(ts.getMinutes()<10?'0':'')+ts.getMinutes();
  // Reply button
  const replyBtn=document.createElement('button');replyBtn.style.cssText='background:transparent;border:none;color:var(--mut);font-size:13px;cursor:pointer;padding:2px 5px;opacity:0.7;align-self:center;flex-shrink:0;';replyBtn.textContent='↩';replyBtn.title='Responder';
  replyBtn.onclick=()=>{
    gchatReplyTo={name:msg.name||'Usuario',text:msg.text,userId:msg.userId};
    const rp=document.getElementById('gchat-reply-prev');
    const rt=document.getElementById('gchat-reply-txt');
    if(rt)rt.innerHTML='<span class="gchat-reply-name">'+esc(msg.name||'Usuario')+'</span>: '+esc((msg.text||'').slice(0,60));
    if(rp)rp.classList.add('show');
    document.getElementById('gchat-inp')?.focus();
  };
  if(mine){col.appendChild(bub);col.appendChild(ti);row.appendChild(replyBtn);row.appendChild(av);row.appendChild(col);}
  else{col.appendChild(bub);col.appendChild(ti);row.appendChild(av);row.appendChild(col);row.appendChild(replyBtn);}
  return row;
}

function setGChatReply(msg){
  gchatReply={userId:msg.userId,name:msg.name,text:msg.text};
  const rp=document.getElementById('gchat-reply-preview');
  const rn=document.getElementById('gchat-reply-name');
  const rt=document.getElementById('gchat-reply-text');
  if(rp)rp.classList.add('show');
  if(rn)rn.textContent='↩ '+msg.name;
  if(rt)rt.textContent=msg.text;
  document.getElementById('gchat-inp')?.focus();
}

async function sendGChat(){
  const inp=document.getElementById('gchat-inp');if(!inp)return;
  const text=inp.value.trim();if(!text)return;
  inp.value='';inp.style.height='auto';
  const msgData={userId:S.cu.uid,name:S.me?.name||'',avatar:S.me?.avatar||'star',photo:S.me?.photo||'',text,createdAt:serverTimestamp()};
  if(gchatReplyTo)msgData.replyTo=gchatReplyTo;
  try{await addDoc(collection(db,'gchat'),msgData);gchatReplyTo=null;const rp=document.getElementById('gchat-reply-prev');if(rp)rp.classList.remove('show');}catch(e){console.error(e);}
}

// Init back button history
history.pushState(null,'',window.location.href);

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
