const isFriend=u=>S.friends.includes(u);
const isBlocked=u=>S.blocked.includes(u);
const isBlockedBy=u=>S.blockedBy.includes(u);
const isAdmin=()=>S.me&&S.me.isAdmin===true;
function canSee(p){if(isBlocked(p.userId)||isBlockedBy(p.userId))return false;if(!p.privacy||p.privacy==='public'||p.privacy==='group'||p.privacy==='page')return true;if(p.userId===S.cu.uid)return true;if(p.privacy==='friends')return isFriend(p.userId);return false;}

function formatText(txt){
  if(!txt)return'';
  const r=[];let i=0;
  while(i<txt.length){
    if(txt[i]==='h'&&txt.slice(i,i+4)==='http'){let j=i;while(j<txt.length&&!/\s/.test(txt[j]))j++;r.push('<a href="'+esc(txt.slice(i,j))+'" target="_blank" rel="noopener" style="color:#c060ff;text-decoration:underline;word-break:break-all;">'+esc(txt.slice(i,j))+'</a>');i=j;continue;}
    if(txt[i]==='@'){let j=i+1;while(j<txt.length&&/[a-zA-Z0-9_]/.test(txt[j]))j++;if(j>i+1){r.push('<span style="color:#c060ff;font-weight:700">'+txt.slice(i,j)+'</span>');i=j;continue;}}
    if(txt[i]==='#'){let j=i+1;while(j<txt.length&&/[a-zA-Z0-9_\u00C0-\u017E]/.test(txt[j]))j++;if(j>i+1){r.push('<span style="color:#9b35e8;font-weight:700">'+txt.slice(i,j)+'</span>');i=j;continue;}}
    const ch=txt[i];if(ch==='&')r.push('&amp;');else if(ch==='<')r.push('&lt;');else if(ch==='>')r.push('&gt;');else r.push(ch);i++;
  }
  return r.join('');
}

async function addXC(uid,amt){if(!uid||amt<=0)return;try{await updateDoc(doc(db,'users',uid),{xcoins:increment(amt)});if(uid===S.cu?.uid){
    S.me={...S.me,xcoins:(S.me.xcoins||0)+amt};S.users[uid]=S.me;
    const el=document.getElementById('xc-txt');if(el)el.textContent=S.me.xcoins;
  }}catch(e){}}
async function spendXC(uid,amt){try{const sn=await getDoc(doc(db,'users',uid));const bal=(sn.exists()?sn.data().xcoins:0)||0;if(bal<amt)return false;await updateDoc(doc(db,'users',uid),{xcoins:increment(-amt)});if(uid===S.cu?.uid){S.me={...S.me,xcoins:(S.me.xcoins||0)-amt};S.users[uid]=S.me;const el=document.getElementById('xc-txt');if(el)el.textContent=S.me.xcoins;}return true;}catch(e){return false;}}
function hasItem(id){if(!S.me?.purchases)return false;const p=S.me.purchases[id];if(!p)return false;if(p.permanent)return true;return new Date(p.expires)>new Date();}
function daysLeft(id){if(!S.me?.purchases?.[id])return 0;return Math.max(0,Math.ceil((new Date(S.me.purchases[id].expires)-new Date())/86400000));}
async function buyItem(item){
  if(!isAdmin()){const ok=await spendXC(S.cu.uid,item.p);if(!ok){alert('Necesitas '+item.p+' XC!');return;}}
  if(item.id==='sorpresa'){const r=Math.floor(Math.random()*91)+10;await addXC(S.cu.uid,r);alert('Ganaste '+r+' XC! 🎉');return;}
  const purchases={...(S.me.purchases||{})};
  purchases[item.id]=item.days===0?{permanent:true}:{expires:new Date(Date.now()+item.days*86400000).toISOString()};
  if(['vip','rugido','brillante'].includes(item.id))await updateDoc(doc(db,'users',S.cu.uid),{badges:arrayUnion(item.id)});
  if(item.id==='verified'){
    const pts=S.me?.points||0;
    if(pts<1000){alert('Necesitas alcanzar el nivel ⭐ Estrella (1000 pts) para verificarte.');return;}
    await updateDoc(doc(db,'users',S.cu.uid),{verified:true});S.me={...S.me,verified:true};S.users[S.cu.uid]=S.me;
  }
  await updateDoc(doc(db,'users',S.cu.uid),{purchases});S.me={...S.me,purchases};S.users[S.cu.uid]=S.me;
  alert('✅ '+item.n+' activado!');S.view='store-section';render();
}

  try{

    const current=sn.data().points||0;const newTotal=current+pts;
    await updateDoc(doc(db,'users',uid),{points:newTotal,xcoins:increment(Math.floor(pts/2))});
    if(uid===S.cu?.uid){
      const prevPts=S.me.points||0;
      S.me={...S.me,points:newTotal,xcoins:(S.me.xcoins||0)+Math.floor(pts/2)};
      S.users[uid]=S.me;
      const el=document.getElementById('xc-txt');if(el)el.textContent=S.me.xcoins;
      // Notify when reaching Estrella level for verification
      if(prevPts<1000&&newTotal>=1000&&!S.me.verified){

}

function handleMention(val,box,cb){
  const ai=val.lastIndexOf('@');if(ai<0){box.style.display='none';return;}
  const q=val.slice(ai+1).toLowerCase();
  const ms=S.friends.map(uid=>S.users[uid]).filter(u=>u&&((u.name||'').toLowerCase().includes(q)||(u.handle||'').toLowerCase().includes(q))).slice(0,5);
  if(!ms.length){box.style.display='none';return;}
  box.innerHTML='';box.style.display='block';

  else if(sec==='social'){const h2=document.createElement('h2');h2.style.cssText='font-family:Nunito,sans-serif;font-weight:900;font-size:16px;margin-bottom:10px;';h2.textContent='💝 Regalar XC';main.appendChild(h2);const card=document.createElement('div');card.className='card';const fl=document.createElement('div');fl.className='fl';fl.textContent='Buscar amigo';card.appendChild(fl);const inp=document.createElement('input');inp.placeholder='Nombre o @usuario...';inp.style.marginBottom='8px';const res=document.createElement('div');inp.oninput=e=>{res.innerHTML='';const q=e.target.value.toLowerCase();if(!q)return;S.friends.forEach(async uid=>{const u=await loadU(uid);if(!u)return;if((u.name||'').toLowerCase().includes(q)||(u.handle||'').toLowerCase().includes(q)){const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--bor);cursor:pointer;';row.appendChild(avEl(u,34));const inf=document.createElement('div');inf.innerHTML='<div style="font-weight:800;font-size:13px;">'+esc(u.name)+'</div>';row.appendChild(inf);row.onclick=()=>showGiftPanel(u,card);res.appendChild(row);}});};card.appendChild(inp);card.appendChild(res);main.appendChild(card);}
  else{const items=STORE.filter(i=>i.s===sec);const sNames={funcs:'🎤 Funciones',custom:'🎨 Personalización',visib:'👁 Visibilidad'};const h2=document.createElement('h2');h2.style.cssText='font-family:Nunito,sans-serif;font-weight:900;font-size:16px;margin-bottom:10px;';h2.textContent=sNames[sec]||sec;main.appendChild(h2);
    items.forEach(item=>{const ic=document.createElement('div');ic.className='item-card';const icon=document.createElement('div');icon.className='item-icon';icon.textContent=item.ic;const info=document.createElement('div');info.className='item-info';info.innerHTML='<div class="item-name">'+item.n+'</div><div class="item-desc">'+item.d+'</div>'+(item.days>0?'<div class="item-dur">⏱ '+(item.days<1?Math.round(item.days*24)+' horas':item.days+' dias')+'</div>':'');const buy=document.createElement('div');buy.className='item-buy';const price=document.createElement('div');price.className='item-price';price.appendChild(coinImg(12));price.appendChild(document.createTextNode(' '+item.p));const owned=hasItem(item.id);const canBuy=(S.me?.xcoins||0)>=item.p;const btn=document.createElement('button');if(owned){btn.className='buy-btn owned';btn.textContent='✓ Activo';if(item.days>0){const ab=document.createElement('div');ab.className='active-badge';ab.textContent=daysLeft(item.id)+'d';buy.appendChild(ab);}}else if(!canBuy&&!isAdmin()){btn.className='buy-btn locked';btn.textContent='🔒';}else{btn.className='buy-btn';btn.textContent='Comprar';}btn.onclick=async()=>{if(!owned)await buyItem(item);};buy.appendChild(price);buy.appendChild(btn);ic.appendChild(icon);ic.appendChild(info);ic.appendChild(buy);main.appendChild(ic);});}
  wrap.appendChild(main);app.innerHTML='';app.appendChild(wrap);
}
async function showGiftPanel(friend,parentCard){
  const ex=document.getElementById('gift-panel');if(ex)ex.remove();
  const panel=document.createElement('div');panel.id='gift-panel';panel.className='card';panel.style.cssText='margin-top:8px;border-color:var(--acc);';
  const h=document.createElement('h3');h.style.cssText='font-family:Nunito,sans-serif;font-weight:900;font-size:13px;margin-bottom:9px;';h.textContent='Regalar XC a '+friend.name;panel.appendChild(h);
  const grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:9px;';let selAmt=10;
  [10,25,50,100].forEach(amt=>{const t=document.createElement('div');t.className='tip-amount'+(amt===10?' sel':'');t.innerHTML='<div class="tip-val">'+amt+'</div><div style="font-size:10px;color:var(--mut);margin-top:2px;">XC</div>';t.onclick=()=>{selAmt=amt;grid.querySelectorAll('.tip-amount').forEach(x=>x.classList.remove('sel'));t.classList.add('sel');};grid.appendChild(t);});
  const sb=document.createElement('button');sb.className='btn';sb.style.width='100%';sb.textContent='Enviar XC';sb.onclick=async()=>{const ok=await spendXC(S.cu.uid,selAmt);if(!ok){alert('No tienes suficientes XC.');return;}await addXC(friend.id,selAmt);await addDoc(collection(db,'notifications'),{toUserId:friend.id,type:'gift',fromName:S.me.name,amount:selAmt,read:false,createdAt:serverTimestamp()});alert('✅ Enviaste '+selAmt+' XC a '+friend.name+'!');panel.remove();};
  panel.appendChild(grid);panel.appendChild(sb);parentCard.appendChild(panel);
}
