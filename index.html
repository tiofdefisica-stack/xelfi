const isFriend=uid=>S.friends.includes(uid);
const isBlocked=uid=>S.blocked.includes(uid);
const isBlockedBy=uid=>S.blockedBy.includes(uid);

function canSee(post){
  if(isBlocked(post.userId)||isBlockedBy(post.userId))return false;
  if(!post.privacy||post.privacy==='public'||post.privacy==='group'||post.privacy==='page')return true;
  if(post.userId===S.cu.uid)return true;
  if(post.privacy==='friends')return isFriend(post.userId);
  return false;
}

function formatText(txt){
  if(!txt)return'';
  const result=[];
  let i=0;
  while(i<txt.length){
    // URL
    if(txt[i]==='h'&&txt.slice(i,i+4)==='http'){
      let j=i;while(j<txt.length&&!/\s/.test(txt[j]))j++;
      const url=txt.slice(i,j);
      result.push('<a href="'+url+'" target="_blank" rel="noopener" style="color:#c060ff;text-decoration:underline;word-break:break-all;">'+url+'</a>');
      i=j;continue;
    }
    // Mention
    if(txt[i]==='@'){
      let j=i+1;while(j<txt.length&&/[a-zA-Z0-9_]/.test(txt[j]))j++;
      if(j>i+1){result.push('<span style="color:#c060ff;font-weight:700">'+txt.slice(i,j)+'</span>');i=j;continue;}
    }
    // Hashtag
    if(txt[i]==='#'){
      let j=i+1;while(j<txt.length&&/[a-zA-Z0-9_À-ž]/.test(txt[j]))j++;
      if(j>i+1){result.push('<span style="color:#9b35e8;font-weight:700">'+txt.slice(i,j)+'</span>');i=j;continue;}
    }
    // Normal char - escape HTML
    const ch=txt[i];
    if(ch==='&')result.push('&amp;');
    else if(ch==='<')result.push('&lt;');
    else if(ch==='>')result.push('&gt;');
    else result.push(ch);
    i++;
  }
  return result.join('');
}

function hasItem(itemId){
  if(!S.me||!S.me.purchases)return false;
  const p=S.me.purchases[itemId];if(!p)return false;
  if(p.permanent)return true;
  return new Date(p.expires)>new Date();
}
function daysLeft(itemId){
  if(!S.me||!S.me.purchases||!S.me.purchases[itemId])return 0;
  const diff=new Date(S.me.purchases[itemId].expires)-new Date();
  return Math.ceil(diff/86400000);
}

async function buyItem(item){
  if(isAdminUser()){
    // Admin gets for free
    await activateItem(item);return true;
  }
  const xc=S.me&&S.me.xcoins||0;
  if(xc<item.price){alert('No tienes suficientes XC. Necesitas '+item.price+' XC.');return false;}
  if(!confirm('Comprar '+item.name+' por '+item.price+' XC?'))return false;
  const ok=await spendXC(S.cu.uid,item.price);
  if(!ok){alert('Error al procesar la compra.');return false;}
  await activateItem(item);
  return true;
}

async function activateItem(item){
  const purchases=S.me.purchases||{};
  if(item.duration===0){
    // Permanent or instant
    if(item.id==='sorpresa'){
      const reward=Math.floor(Math.random()*91)+10;
      await addXC(S.cu.uid,reward,'sorpresa');
      alert('Abriste el sobre y ganaste '+reward+' XC! 🎉');return;
    }
    purchases[item.id]={permanent:true,bought:new Date().toISOString()};
    if(['vip','rugido','brillante'].includes(item.id)){
      await updateDoc(doc(db,'users',S.cu.uid),{badges:arrayUnion(item.id)});
    }
  } else {
    const expires=new Date(Date.now()+item.duration*24*60*60*1000).toISOString();
    purchases[item.id]={expires,bought:new Date().toISOString()};
  }
  await updateDoc(doc(db,'users',S.cu.uid),{purchases});
  S.me={...S.me,purchases};S.users[S.cu.uid]=S.me;
  alert('✅ '+item.name+' activado!');
  renderStoreSection(document.getElementById('app'));
}

// @XELFI AI
async function callXelfiAI(question,postId){
  if(!isAdminUser()){
    const ok=await spendXC(S.cu.uid,5);
    if(!ok){
      // Reply in comments
      await updateDoc(doc(db,'posts',postId),{comments:arrayUnion({userId:'xelfi_ai',text:'❌ Necesitas 5 XC para consultar a @xelfi. Visita la tienda para ganar más.',createdAt:new Date().toISOString(),isAI:true})});
      return;
    }
  }
  // Reply loading
  await updateDoc(doc(db,'posts',postId),{comments:arrayUnion({userId:'xelfi_ai',text:'🤖 Consultando...',createdAt:new Date().toISOString(),isAI:true,loading:true})});
  try{
    const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=AIzaSyD0wBqDwsM1FaEMuo1LwA1kYYEFFi5rQ0o',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:'Eres Xelfi, una IA amigable en una red social. Responde en español de forma breve y clara. Pregunta: '+question}]}]})
    });
    const data=await res.json();
    const reply=data.candidates?.[0]?.content?.parts?.[0]?.text||'No pude obtener respuesta.';
    const sn=await getDocs(collection(db,'posts'));
    const postSnap=await getDoc(doc(db,'posts',postId));
    if(postSnap.exists()){
      const cmts=postSnap.data().comments||[];
      const updated=cmts.filter(c=>!c.loading);
      updated.push({userId:'xelfi_ai',text:reply,createdAt:new Date().toISOString(),isAI:true});
      await updateDoc(doc(db,'posts',postId),{comments:updated});
    }
  }catch(e){
    const postSnap=await getDoc(doc(db,'posts',postId));
    if(postSnap.exists()){const cmts=(postSnap.data().comments||[]).filter(c=>!c.loading);cmts.push({userId:'xelfi_ai',text:'Error al conectar con la IA. Intenta de nuevo.',createdAt:new Date().toISOString(),isAI:true});await updateDoc(doc(db,'posts',postId),{comments:cmts});}
  }
}

// Check @xelfi mention in post content
async function checkAIMention(post){
  if(!post.content)return;
  const lower=post.content.toLowerCase();
  if(lower.includes('@xelfi')&&!post.aiProcessed){
    await updateDoc(doc(db,'posts',post.id),{aiProcessed:true});
    await callXelfiAI(post.content.replace(/@xelfi/gi,'').trim(),post.id);
  }
}

async function checkAIMentionInComment(text,postId){
  if(!text)return;

    await callXelfiAI(text.replace(/@xelfi/gi,'').trim(),postId);
  }
}

async function addPoints(uid,pts,reason){
  try{
    const ref=doc(db,'users',uid);
    const sn=await getDoc(ref);
    if(!sn.exists())return;
    const current=sn.data().points||0;
    const newTotal=current+pts;
    await updateDoc(ref,{points:newTotal});
    if(uid===S.cu.uid){
      S.me={...S.me,points:newTotal};
      S.users[uid]=S.me;
      // Check badges
      await checkBadges(uid,newTotal,sn.data());
    }
  }catch(e){}
}

async function checkBadges(uid,points,userData){
  try{
    const badges=userData.badges||[];
    const newBadges=[];
    if(!badges.includes('welcome'))newBadges.push('welcome');
    if(points>=1000&&!badges.includes('estrella'))newBadges.push('estrella');
    if(points>=5000&&!badges.includes('leyenda'))newBadges.push('leyenda');
    if(S.friends.length>=5&&!badges.includes('social'))newBadges.push('social');
    for(const bid of newBadges){
      const badge=BADGES.find(b=>b.id===bid);
      if(badge){
        await updateDoc(doc(db,'users',uid),{badges:arrayUnion(bid)});
        // Notify
        await addDoc(collection(db,'notifications'),{toUserId:uid,type:'badge',badge:badge.emoji,badgeName:badge.name,read:false,createdAt:serverTimestamp()});
      }
    }
  }catch(e){}
}

    if(voiceAllowed){voiceBtn.addEventListener('mousedown',startRec);voiceBtn.addEventListener('touchstart',e=>{e.preventDefault();startRec();},{passive:false});
    voiceBtn.addEventListener('mouseup',stopRec);voiceBtn.addEventListener('mouseleave',stopRec);voiceBtn.addEventListener('touchend',stopRec);
    async function startRec(){
      try{
        const stream=await navigator.mediaDevices.getUserMedia({audio:true});
        audioChunks=[];mediaRec=new MediaRecorder(stream,{mimeType:'audio/webm'});
        mediaRec.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};
        mediaRec.onstop=async()=>{
          stream.getTracks().forEach(t=>t.stop());
          const blob=new Blob(audioChunks,{type:'audio/webm'});
          if(blob.size>800000){alert('Audio demasiado largo. Maxima 5 segundos.');return;}
          const reader=new FileReader();
          reader.onload=async ev=>{
            try{await updateDoc(doc(db,'posts',post.id),{comments:arrayUnion({userId:S.cu.uid,text:'',audio:ev.target.result,createdAt:new Date().toISOString()})});await addNotif(post.userId,'comment',post.id);}
            catch(e){alert('Error enviando audio.');}
          };reader.readAsDataURL(blob);
        };
        mediaRec.start();voiceBtn.classList.add('recording');voiceBtn.textContent='⏹️';
        recTimer=setTimeout(()=>stopRec(),5000);
      }catch(e){alert('No se pudo acceder al microfono.');}
    }
    function stopRec(){
      clearTimeout(recTimer);
      if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();voiceBtn.classList.remove('recording');voiceBtn.textContent='🎤';}
    }
    const sb=document.createElement('button');sb.className='sbtn';sb.textContent='Enviar';sb.onclick=()=>sendCmt(post);
    ir.appendChild(cw2);ir.appendChild(voiceBtn);ir.appendChild(gifBtn);ir.appendChild(sb);cs.appendChild(ir);
    return cs;
}
async function sendCmt(post){
  const text=S.ct[post.id]||'';if(!text.trim())return;
  S.users[S.cu.uid]=S.me;
  const newComment={userId:S.cu.uid,text,createdAt:new Date().toISOString()};
  try{
    await updateDoc(doc(db,'posts',post.id),{comments:arrayUnion(newComment)});
    await addNotif(post.userId,'comment',post.id);
    await addPoints(S.cu.uid,5,'comment');
    S.ct[post.id]='';
    // Update inline without re-render
    const inp=document.getElementById('ci-'+post.id);if(inp)inp.value='';
    await checkAIMentionInComment(text,post.id);
  }catch(e){}
}

  }catch(e){}
}
