<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xelfi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9b35e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Xelfi">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0b14;--surf:#16121f;--card:#1c1729;--bor:#2e2540;--acc:#9b35e8;--acc2:#c060ff;--txt:#ede8f5;--mut:#7a6a9a;--red:#ff4d6d;--grn:#4ade80;--yel:#fbbf24;}
body.light{--bg:#f0f2f5;--surf:#ffffff;--card:#ffffff;--bor:#dde1e7;--txt:#1c1e21;--mut:#65676b;--acc:#9b35e8;--acc2:#c060ff;}
.bnav{position:fixed;bottom:0;left:0;right:0;height:56px;background:var(--card);border-top:1px solid var(--bor);display:flex;align-items:center;justify-content:space-around;z-index:200;backdrop-filter:blur(12px);}
.bnav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;height:100%;background:transparent;border:none;cursor:pointer;color:var(--mut);font-size:22px;transition:color .15s;padding:0;position:relative;}
.bnav-btn.active{color:var(--acc);}
.bnav-btn span{font-size:10px;font-weight:700;font-family:'Nunito',sans-serif;margin-top:2px;}
.bnav-badge{position:absolute;top:6px;right:calc(50% - 18px);background:var(--red);color:#fff;border-radius:50%;width:14px;height:14px;font-size:9px;font-weight:800;display:none;align-items:center;justify-content:center;}
.main{padding-bottom:70px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:'Nunito Sans',sans-serif;min-height:100vh;}
.logo{display:inline-flex;align-items:center;cursor:pointer;user-select:none;gap:2px;}
.logo-x{font-family:'Comic Sans MS',cursive;font-weight:900;font-size:2em;color:#9b2dc8;-webkit-text-stroke:2px #6a0a9e;font-style:italic;line-height:1;}
.logo-e{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.3em;color:#9b2dc8;line-height:1;}
nav{position:sticky;top:0;z-index:200;background:#0e0b14ee;border-bottom:1px solid var(--bor);display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:54px;backdrop-filter:blur(12px);}
.nav-r{display:flex;gap:4px;align-items:center;}
.nb{background:transparent;color:var(--mut);border:none;border-radius:8px;padding:5px 9px;cursor:pointer;font-weight:700;font-size:13px;font-family:'Nunito',sans-serif;transition:all .15s;}
.nb:hover{background:#9b35e810;color:var(--acc2);}
.main{max-width:600px;margin:0 auto;padding:16px 12px;}
.card{background:var(--card);border:1px solid var(--bor);border-radius:16px;padding:16px;margin-bottom:12px;animation:fu .2s ease;}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.btn{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border:none;border-radius:9px;padding:10px 18px;cursor:pointer;font-weight:800;font-size:14px;font-family:'Nunito',sans-serif;transition:all .15s;box-shadow:0 4px 14px #9b35e840;}
.btn:hover{transform:translateY(-1px);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-o{background:transparent;color:var(--mut);border:1px solid var(--bor);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:700;font-size:13px;font-family:'Nunito',sans-serif;transition:all .15s;}
.btn-o:hover{border-color:var(--acc);color:var(--acc2);}
input,textarea,select{background:var(--surf);border:1.5px solid var(--bor);border-radius:10px;padding:10px 13px;color:var(--txt);font-size:14px;width:100%;outline:none;font-family:'Nunito Sans',sans-serif;transition:border .15s;}
input:focus,textarea:focus,select:focus{border-color:var(--acc);}
textarea{resize:none;line-height:1.6;}
select option{background:var(--card);}
.av{border-radius:50%;background:linear-gradient(135deg,#9b35e830,#c060ff30);border:2px solid #9b35e855;display:flex;align-items:center;justify-content:center;flex-shrink:0;user-select:none;overflow:hidden;}
.av img{width:100%;height:100%;object-fit:cover;}
.fl{font-size:11px;color:var(--mut);margin-bottom:3px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-family:'Nunito',sans-serif;}
.lnk{color:var(--acc2);cursor:pointer;font-weight:700;}
.lnk:hover{text-decoration:underline;}
.err{color:var(--red);font-size:13px;padding:8px 12px;background:#ff4d6d15;border-radius:8px;border:1px solid #ff4d6d33;}
.ok{color:var(--grn);font-size:13px;padding:8px 12px;background:#4ade8015;border-radius:8px;border:1px solid #4ade8033;}
.spin{width:16px;height:16px;border:2px solid #fff4;border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;display:inline-block;vertical-align:middle;margin-right:5px;}
@keyframes sp{to{transform:rotate(360deg)}}
.ph{display:flex;gap:10px;margin-bottom:10px;}
.ph-name{font-weight:800;font-size:14px;font-family:'Nunito',sans-serif;cursor:pointer;transition:color .15s;}
.ph-name:hover{color:var(--acc2);}
.ph-meta{font-size:12px;color:var(--mut);}
.act-row{display:flex;gap:6px;padding-top:10px;border-top:1px solid var(--bor);flex-wrap:wrap;}
.ab{display:flex;align-items:center;gap:4px;background:transparent;border:1px solid var(--bor);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:700;color:var(--mut);font-family:'Nunito',sans-serif;transition:all .15s;}
.ab:hover{border-color:var(--acc);color:var(--acc2);}
.ab.reacted{background:#9b35e815;border-color:#9b35e855;color:var(--acc2);}
.ab.copen{background:#9b35e815;border-color:#9b35e855;color:var(--acc2);}
.ab.reposted{background:#4ade8015;border-color:#4ade8055;color:var(--grn);}
.react-panel{position:absolute;bottom:110%;left:0;background:var(--card);border:1px solid var(--bor);border-radius:50px;padding:6px 10px;display:flex;gap:6px;box-shadow:0 4px 20px #000a;z-index:300;white-space:nowrap;}
.rb{font-size:22px;background:transparent;border:none;cursor:pointer;border-radius:50%;padding:3px;transition:transform .15s;}
.rb:hover{transform:scale(1.3);}
.cmts{margin-top:10px;}
.ci{display:flex;gap:8px;margin-bottom:8px;}
.cb{background:var(--surf);border-radius:10px;padding:8px 11px;flex:1;border:1px solid var(--bor);}
.ca{font-weight:800;font-size:13px;font-family:'Nunito',sans-serif;cursor:pointer;}
.ca:hover{color:var(--acc2);}
.ct2{color:var(--mut);font-size:11px;margin-left:5px;}
.ctxt{font-size:14px;line-height:1.5;margin-top:3px;}
.ci-row{display:flex;gap:7px;margin-top:8px;align-items:center;position:relative;}
.ci-row input{flex:1;padding:8px 11px;font-size:13px;}
.sbtn{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px;}
.mbox{position:absolute;bottom:100%;left:40px;background:var(--card);border:1px solid var(--bor);border-radius:10px;z-index:300;min-width:180px;display:none;box-shadow:0 4px 16px #000a;max-height:180px;overflow-y:auto;}
.mopt{padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;}
.mopt:hover{background:var(--surf);}
.sug-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
.sug{background:var(--surf);border:1px solid var(--bor);border-radius:12px;padding:10px 11px;cursor:pointer;text-align:center;min-width:88px;flex-shrink:0;transition:all .15s;}
.sug:hover{border-color:var(--acc);transform:translateY(-2px);}
.sl{font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;font-family:'Nunito',sans-serif;}
.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:15px;}
.load{text-align:center;color:var(--mut);padding:24px;}
.bell-w{position:relative;display:inline-flex;}
.nbadge{position:absolute;top:1px;right:1px;background:var(--red);color:#fff;border-radius:50%;width:15px;height:15px;font-size:9px;font-weight:800;display:none;align-items:center;justify-content:center;pointer-events:none;}
.npanel{position:fixed;top:54px;right:6px;width:300px;max-width:95vw;background:var(--card);border:1px solid var(--bor);border-radius:14px;z-index:9999;box-shadow:0 8px 32px #000a;max-height:420px;overflow-y:auto;}
.npanel-hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bor);}
.ni{display:flex;gap:9px;padding:10px 14px;border-bottom:1px solid #2e254033;cursor:pointer;align-items:flex-start;}
.ni.unread{background:#9b35e808;}
.ndot{width:7px;height:7px;border-radius:50%;background:var(--acc2);flex-shrink:0;margin-top:4px;}
.tag{border-radius:6px;padding:2px 7px;font-size:11px;font-weight:800;font-family:'Nunito',sans-serif;}
.tpub{background:#4ade8018;color:var(--grn);}
.tfri{background:#fbbf2418;color:var(--yel);}
.tprv{background:#ff4d6d18;color:var(--red);}
.tgrp{background:#9b35e818;color:var(--acc2);}
.av-pick{display:flex;gap:7px;flex-wrap:wrap;}
.av-btn{font-size:19px;background:transparent;border:2px solid var(--bor);border-radius:8px;padding:3px 6px;cursor:pointer;transition:all .15s;}
.av-btn.sel{background:#9b35e820;border-color:var(--acc);}
.pstats{display:flex;gap:14px;margin-top:8px;}
.pstat{font-size:13px;}
.pstat b{font-family:'Nunito',sans-serif;font-weight:900;}
.pstat span{color:var(--mut);}
.prof-av-w{position:relative;flex-shrink:0;}
.prof-av-w:hover .av-ov{opacity:1;}
.av-ov{position:absolute;inset:0;border-radius:50%;background:#00000088;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;font-size:16px;color:#fff;cursor:pointer;}
.lock-msg{background:#fbbf2415;border:1px solid #fbbf2433;border-radius:10px;padding:12px;text-align:center;color:var(--yel);font-size:14px;margin-bottom:12px;}
.block-banner{background:#ff4d6d15;border:1px solid #ff4d6d33;border-radius:10px;padding:12px;text-align:center;color:var(--red);font-size:14px;margin-bottom:12px;}
.rp-banner{font-size:12px;color:var(--mut);margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.tab-row{display:flex;gap:0;margin-bottom:14px;border-bottom:2px solid var(--bor);}
.tab{background:transparent;border:none;color:var(--mut);font-weight:700;font-size:14px;font-family:'Nunito',sans-serif;padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;}
.tab.active{color:var(--acc2);border-bottom-color:var(--acc2);}
.gc{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--bor);cursor:pointer;}
.gc:last-child{border-bottom:none;}
.gav{width:46px;height:46px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;}
.pav{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ff6b9d,#ff4d6d);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;}
.msg-wrap{display:flex;flex-direction:column;gap:8px;padding:10px 4px;}
.msg-row{display:flex;gap:8px;align-items:flex-end;width:100%;}
.msg-row.mine{flex-direction:row-reverse;}
.msg-bub{max-width:calc(100% - 48px);padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.6;word-break:break-word;white-space:pre-wrap;overflow-wrap:anywhere;}
.msg-bub.theirs{background:var(--surf);border:1px solid var(--bor);border-bottom-left-radius:4px;}
.msg-bub.mine{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border-bottom-right-radius:4px;}
.msg-time{font-size:10px;color:var(--mut);text-align:center;padding:2px 4px;}
.voice-btn{background:transparent;border:1px solid var(--bor);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px;color:var(--mut);transition:all .15s;}
.voice-btn.recording{background:#ff4d6d22;border-color:#ff4d6d;color:var(--red);animation:pulse .6s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);};}
.audio-player{display:flex;align-items:center;gap:8px;background:var(--surf);border-radius:20px;padding:6px 12px;margin-top:4px;max-width:200px;}
.audio-play-btn{background:var(--acc);color:#fff;border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.audio-bar{flex:1;height:3px;background:var(--bor);border-radius:2px;position:relative;}
.audio-progress{height:100%;background:var(--acc2);border-radius:2px;width:0%;transition:width .1s;}
.audio-time{font-size:11px;color:var(--mut);flex-shrink:0;}
.gif-panel{position:absolute;bottom:100%;left:0;right:0;background:var(--card);border:1px solid var(--bor);border-radius:14px;z-index:300;box-shadow:0 4px 20px #000a;padding:10px;}
.gif-search{width:100%;margin-bottom:8px;}
.gif-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-height:220px;overflow-y:auto;}
.gif-item{border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:1;}
.gif-item img{width:100%;height:100%;object-fit:cover;display:block;}
.gif-item:hover{opacity:.8;}
.chat-inp{display:flex;gap:7px;align-items:center;padding:10px 0 0;border-top:1px solid var(--bor);margin-top:6px;}
.chat-inp input{flex:1;}
::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-thumb{background:var(--bor);border-radius:4px;}
</style>
</head>
<body>
<div id="app"><div class="load" style="padding:80px;font-size:16px">Cargando Xelfi...</div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,collection,addDoc,getDocs,doc,getDoc,setDoc,updateDoc,deleteDoc,query,orderBy,onSnapshot,arrayUnion,arrayRemove,increment,serverTimestamp,deleteField}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const FB={apiKey:"AIzaSyA695OTVjRtgTuw3-cqjPTyZ9O02eI_n5k",authDomain:"xelfi-7e2bf.firebaseapp.com",projectId:"xelfi-7e2bf",storageBucket:"xelfi-7e2bf.firebasestorage.app",messagingSenderId:"261957011071",appId:"1:261957011071:web:795d4bcfd0902bc157214a"};
const fbApp=initializeApp(FB);
const auth=getAuth(fbApp);
const db=getFirestore(fbApp);

const AVK=['star','moon','scope','flower','rocket','wave','fly','guitar','lab','cherry','bolt','target','fox','fish','palm'];
const AVE={star:'⭐',moon:'🌙',scope:'🔭',flower:'🌺',rocket:'🚀',wave:'🌊',fly:'🦋',guitar:'🎸',lab:'🔬',cherry:'🌸',bolt:'⚡',target:'🎯',fox:'🦊',fish:'🐬',palm:'🌴'};
const em=k=>AVE[k]||k||'⭐';

const REACTIONS=[{k:'like',e:'👍'},{k:'love',e:'❤️'},{k:'haha',e:'😂'},{k:'wow',e:'😲'},{k:'sad',e:'😢'},{k:'angry',e:'😡'}];

const S={view:'login',cu:null,me:null,pid:null,np:'',ni:'',npv:'public',rf:{n:'',h:'',b:'',av:'star',e:'',p:''},lf:{e:'',p:''},le:'',re:'',oc:{},ct:{},sav:'star',posts:[],users:{},notifs:[],unread:0,friends:[],blocked:[],blockedBy:[],chatWith:null,mt:'',mu:0,groupId:null,pageId:null,gf:{name:'',desc:'',emoji:'⭐',photo:''},pf:{name:'',desc:'',emoji:'📺',photo:''},pageCache:{}};

const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function logoHTML(){return'<span class="logo"><span class="logo-x">X</span><span class="logo-e">elfi</span></span>';}

function avEl(p,sz=40){
  const d=document.createElement('div');d.className='av';d.style.cssText='width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*.42)+'px;flex-shrink:0;';
  if(p&&(p.photo||p.photoURL)){const img=document.createElement('img');img.src=p.photo||p.photoURL;d.appendChild(img);}
  else d.textContent=em(p&&p.avatar);
  return d;
}

function makeNav(r){const nav=document.createElement('nav');const lw=document.createElement('div');lw.innerHTML=logoHTML();lw.querySelector('.logo').onclick=()=>{if(S.cu){S.view='feed';render();}};nav.appendChild(lw);nav.appendChild(r);return nav;}

function timeAgo(ts){if(!ts)return'ahora mismo';const d=ts.toDate?ts.toDate():new Date(ts);const s=Math.floor((Date.now()-d)/1000);if(s<60)return'ahora mismo';if(s<3600)return'hace '+Math.floor(s/60)+' min';if(s<86400)return'hace '+Math.floor(s/3600)+' h';return'hace '+Math.floor(s/86400)+' dias';}

async function loadU(uid){if(S.users[uid])return S.users[uid];try{const sn=await getDoc(doc(db,'users',uid));if(sn.exists()){S.users[uid]=sn.data();return S.users[uid];}}catch(e){}return null;}

async function loadFriends(){if(!S.cu)return;try{const sn=await getDocs(collection(db,'friendships'));S.friends=[];sn.forEach(d=>{const f=d.data();if(f.status==='accepted'){if(f.from===S.cu.uid)S.friends.push(f.to);else if(f.to===S.cu.uid)S.friends.push(f.from);}});}catch(e){}}

async function loadBlocked(){if(!S.cu)return;try{const sn=await getDocs(collection(db,'blocks'));S.blocked=[];S.blockedBy=[];sn.forEach(d=>{const b=d.data();if(b.by===S.cu.uid)S.blocked.push(b.uid);if(b.uid===S.cu.uid)S.blockedBy.push(b.by);});}catch(e){}}

const isFriend=uid=>S.friends.includes(uid);
const isBlocked=uid=>S.blocked.includes(uid);
const isBlockedBy=uid=>S.blockedBy.includes(uid);

function canSee(post){
  if(isBlocked(post.userId)||isBlockedBy(post.userId))return false;
  if(!post.privacy||post.privacy==='public'||post.privacy==='group'||post.privacy==='page')return true;
  if(post.userId===S.cu.uid)return true;
  if(post.privacy==='friends')return isFriend(post.userId);
  return false;
}

function formatText(txt){
  if(!txt)return'';
  return txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/(https?:\/\/[^\s<>"]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:#c060ff;text-decoration:underline;word-break:break-all;">$1</a>')
    .replace(/@([a-zA-Z0-9_]+)/g,'<span style="color:#c060ff;font-weight:700">@$1</span>')
    .replace(/#([a-zA-Z0-9_\u00C0-\u017E]+)/g,'<span style="color:#9b35e8;font-weight:700">#$1</span>');
}

function isAdmin(){return S.me&&S.me.isAdmin===true;}

// NOTIFICATIONS
let unsubN=null;
function listenNotifs(uid){
  if(unsubN)unsubN();
  try{unsubN=onSnapshot(query(collection(db,'notifications'),orderBy('createdAt','desc')),sn=>{
    S.notifs=[];sn.forEach(d=>{const n={id:d.id,...d.data()};if(n.toUserId===uid)S.notifs.push(n);});
    S.unread=S.notifs.filter(n=>!n.read).length;
    const b=document.getElementById('nbadge');if(b){b.textContent=S.unread;b.style.display=S.unread>0?'flex':'none';}
  });}catch(e){}
}
async function addNotif(toUid,type,postId){if(!toUid||toUid===S.cu.uid)return;try{await addDoc(collection(db,'notifications'),{toUserId:toUid,type,fromUserId:S.cu.uid,fromName:S.me.name,fromAvatar:S.me.avatar||'star',postId:postId||null,read:false,createdAt:serverTimestamp()});}catch(e){}}
async function markRead(){for(const n of S.notifs.filter(x=>!x.read))try{await updateDoc(doc(db,'notifications',n.id),{read:true});}catch(e){}}
function notifTxt(n){const m={'like':'le dio like a tu post','comment':'comento tu post','freq':'quiere ser tu amigo','facc':'acepto tu solicitud','repost':'republico tu post','message':'te envio un mensaje','gjoin':'quiere unirse a tu grupo','gjoined':'Tu solicitud fue aceptada'};return(n.fromName||'')+(m[n.type]?' '+m[n.type]:'');}

function renderNotifPanel(){
  const panel=document.createElement('div');panel.id='npanel';panel.className='npanel';
  const hdr=document.createElement('div');hdr.className='npanel-hdr';
  const t=document.createElement('span');t.style.cssText='font-weight:800;font-family:Nunito,sans-serif;font-size:15px';t.textContent='Notificaciones';
  const mb=document.createElement('button');mb.style.cssText='background:transparent;border:none;color:var(--acc2);font-size:12px;font-weight:700;cursor:pointer;';mb.textContent='Leer todo';mb.onclick=()=>markRead();
  hdr.appendChild(t);hdr.appendChild(mb);panel.appendChild(hdr);

function handleMention(val,box,cb){
  const ai=val.lastIndexOf('@');if(ai<0){box.style.display='none';return;}
  const q=val.slice(ai+1).toLowerCase();
  const ms=S.friends.map(uid=>S.users[uid]).filter(u=>u&&((u.name||'').toLowerCase().includes(q)||(u.handle||'').toLowerCase().includes(q))).slice(0,5);
  if(!ms.length){box.style.display='none';return;}
  box.innerHTML='';box.style.display='block';
  ms.forEach(u=>{const opt=document.createElement('div');opt.className='mopt';opt.innerHTML=em(u.avatar)+' <b>'+esc(u.name)+'</b> <span style="color:var(--mut);font-size:11px">'+esc(u.handle)+'</span>';opt.onmousedown=ev=>{ev.preventDefault();const nv=val.slice(0,ai)+'@'+u.handle.replace('@','')+' ';cb(nv);box.style.display='none';};box.appendChild(opt);});
}

    let mediaRec=null;let audioChunks=[];let recTimer=null;
    voiceBtn.addEventListener('mousedown',startRec);voiceBtn.addEventListener('touchstart',e=>{e.preventDefault();startRec();},{passive:false});
    voiceBtn.addEventListener('mouseup',stopRec);voiceBtn.addEventListener('mouseleave',stopRec);voiceBtn.addEventListener('touchend',stopRec);
    async function startRec(){
      try{
        const stream=await navigator.mediaDevices.getUserMedia({audio:true});
        audioChunks=[];mediaRec=new MediaRecorder(stream,{mimeType:'audio/webm'});
        mediaRec.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};
        mediaRec.onstop=async()=>{
          stream.getTracks().forEach(t=>t.stop());
          const blob=new Blob(audioChunks,{type:'audio/webm'});
          if(blob.size>800000){alert('Audio demasiado largo. Maxima 5 segundos.');return;}
          const reader=new FileReader();
          reader.onload=async ev=>{
            try{await updateDoc(doc(db,'posts',post.id),{comments:arrayUnion({userId:S.cu.uid,text:'',audio:ev.target.result,createdAt:new Date().toISOString()})});await addNotif(post.userId,'comment',post.id);}
            catch(e){alert('Error enviando audio.');}
          };reader.readAsDataURL(blob);
        };
        mediaRec.start();voiceBtn.classList.add('recording');voiceBtn.textContent='⏹️';
        recTimer=setTimeout(()=>stopRec(),5000);
      }catch(e){alert('No se pudo acceder al microfono.');}
    }
    function stopRec(){
      clearTimeout(recTimer);
      if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();voiceBtn.classList.remove('recording');voiceBtn.textContent='🎤';}
    }
    const sb=document.createElement('button');sb.className='sbtn';sb.textContent='Enviar';sb.onclick=()=>sendCmt(post);
    ir.appendChild(cw2);ir.appendChild(voiceBtn);ir.appendChild(gifBtn);ir.appendChild(sb);cs.appendChild(ir);
    return cs;
}
